[project]
name = "llm-gateway"
version = "0.1.0"
description = "Client IA commun (Ollama local d'abord, puis Gemini gratuit) avec profils matériel adaptatifs et stockage vectoriel (pgvector)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0,<3"]
# Stockage vectoriel PostgreSQL + pgvector (RAG des cours et copilote MicroForge)
pgvector = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
