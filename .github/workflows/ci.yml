# C18 — Intégration continue : lint + tests + couverture à chaque push / PR.
# Les actions tierces sont épinglées par SHA de commit (veille sécurité : compromissions
# d'actions/paquets en 2026). Mettre à jour via Dependabot.
name: ci

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} — ruff + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Installer les dépendances
        # Extras légers nécessaires aux tests (data : rapidfuzz, polars… ; app : streamlit ; anthropic : SDK Claude).
        run: uv sync --all-packages --group dev --extra data --extra app --extra anthropic
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests + couverture (porte 80 %)
        run: uv run pytest --cov --cov-report=xml --cov-report=term -m "not integration and not network"
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  pgvector:
    # RAG (cours + copilote MicroForge) sur une vraie base PostgreSQL + pgvector : index HNSW,
    # recherche cosinus, filtrage par groupe. Échoue si un test pgvector est ignoré.
    name: RAG — PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGVECTOR_TEST_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-packages --group dev --extra data --extra app --extra pgvector
      - name: Tests pgvector
        run: |
          uv run pytest -m pgvector -rA > pgvector.txt; status=$?
          cat pgvector.txt
          ! grep -q "SKIPPED" pgvector.txt && exit $status

  firmware-matrix:
    # La matrice vient du catalogue : une entrée par famille de cartes (+ variantes de puce).
    name: Matrice des cartes (catalogue)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - id: m
        run: echo "matrix=$(uv run python -m microforge.core.cli ci-matrix)" >> "$GITHUB_OUTPUT"

  firmware:
    # Compilation RÉELLE (arduino-cli) de tous les modèles sur la carte de référence de chaque
    # famille et sur chaque variante de puce, + un croquis de fumée par carte du catalogue.
    name: Firmwares (${{ matrix.name }})
    needs: firmware-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Installer arduino-cli, le cœur et les bibliothèques du catalogue
        env:
          INDEX: ${{ matrix.index }}
          CORE: ${{ matrix.core }}
          FQBN: ${{ matrix.fqbn }}
        run: |
          mkdir -p "$HOME/.local/bin"  # install.sh exige que le dossier existe
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli config init --overwrite
          if [ -n "$INDEX" ]; then arduino-cli config add board_manager.additional_urls "$INDEX"; fi
          arduino-cli core update-index
          arduino-cli core install "$CORE"
          uv run python -m microforge.core.cli libs --fqbn "$FQBN" | tee libs.txt
          if [ -s libs.txt ]; then xargs -d '\n' -a libs.txt arduino-cli lib install; fi
      - name: Générer et compiler TOUS les modèles compatibles
        run: uv run python -m microforge.core.cli compile-demo --all --fqbn "${{ matrix.fqbn }}" --out build/firmware
      - name: Croquis de fumée sur chaque carte de la famille
        if: ${{ matrix.smoke }}
        run: uv run python -m microforge.core.cli board-smoke --family "${{ matrix.family }}"

  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
