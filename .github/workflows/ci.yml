# C18 — Intégration continue : lint + tests + couverture à chaque push / PR.
# Les actions tierces sont épinglées par SHA de commit (veille sécurité : compromissions
# d'actions/paquets en 2026). Mettre à jour via Dependabot.
name: ci

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} — ruff + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Installer les dépendances
        # Extras légers nécessaires aux tests (data : rapidfuzz, polars… ; app : streamlit ; anthropic : SDK Claude).
        run: uv sync --all-packages --group dev --extra data --extra app --extra anthropic
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests + couverture (porte 80 %)
        run: uv run pytest --cov --cov-report=xml --cov-report=term -m "not integration and not network and not e2e"
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  e2e:
    # Parcours de bout en bout : api_data et api_ia démarrées par le test (SQLite, clés JWT éphémères,
    # modèle de langage simulé), puis Streamlit ou la PWA construite ; Chromium piloté par Playwright.
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Installer les dépendances
        run: uv sync --all-packages --group dev --extra data --extra app --extra anthropic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microforge/pwa/package-lock.json
      - name: Playwright pour Node et Chromium
        working-directory: microforge/tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Construire la PWA
        working-directory: microforge/pwa
        run: |
          npm ci
          npm run build
      # Streamlit : inscription → stock → idées → projet (8 onglets) → explorer → copilote.
      # PWA : inscription → stock → idées → projet (9 onglets, atelier virtuel) → copilote → photo → hors ligne,
      # servie avec les en-têtes de son image nginx (CSP) et auditée par axe à chaque vue.
      - name: Parcours Streamlit et PWA
        env:
          MF_E2E_STRICT: "1" # un prérequis manquant fait échouer le job au lieu d'ignorer le test
        run: uv run pytest -m e2e microforge/tests/test_e2e_parcours.py --basetemp=e2e-sortie
      - name: Captures et journaux du parcours
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: parcours-e2e
          path: e2e-sortie/**
          if-no-files-found: ignore

  pwa:
    # PWA React + Vite : tests unitaires du client d'API (Vitest), construction de production.
    name: PWA — tests et construction
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microforge/pwa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microforge/pwa/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build
      - name: Taille de la construction
        run: |
          {
            echo "### PWA construite"
            echo '```'
            du -ah dist | sort -h | tail -n 12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pgvector:
    # RAG (cours + copilote MicroForge) sur une vraie base PostgreSQL + pgvector : index HNSW,
    # recherche cosinus, filtrage par groupe. Échoue si un test pgvector est ignoré.
    name: RAG — PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGVECTOR_TEST_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-packages --group dev --extra data --extra app --extra pgvector
      - name: Tests pgvector
        run: |
          uv run pytest -m pgvector -rA > pgvector.txt; status=$?
          cat pgvector.txt
          ! grep -q "SKIPPED" pgvector.txt && exit $status

  monitoring:
    # Supervision (C11, C20) : configurations Prometheus et Alertmanager validées, règles d'alerte
    # testées sur des séries synthétiques (promtool : chaque alerte au-delà de son seuil et après
    # sa durée, aucune en dessous), puis pile lancée : Grafana démarre et charge ses tableaux de
    # bord, Prometheus est relié à Alertmanager. Images identiques au compose (test Python).
    name: Supervision — Prometheus, Alertmanager, Grafana
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microforge/monitoring
    env:
      PROMETHEUS: prom/prometheus:v3.15.1
      ALERTMANAGER: prom/alertmanager:v0.34.2
      GRAFANA: grafana/grafana:13.3.0
      LOKI: grafana/loki:3.7.9
      # Mot de passe propre à chaque exécution (lu par le compose) : ni valeur par défaut ni
      # identifiant écrit en clair dans le workflow.
      GRAFANA_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Configuration de Prometheus (promtool check config)
        run: docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS" check config /etc/prometheus/prometheus.yml
      - name: Tests unitaires des règles d'alerte (promtool test rules)
        run: docker run --rm -v "$PWD/prometheus:/p:ro" -w /p --entrypoint promtool "$PROMETHEUS" test rules alerts.test.yml
      - name: Configurations d'Alertmanager (amtool check-config)
        run: |
          for f in alertmanager.yml alertmanager-discord.yml; do
            docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool "$ALERTMANAGER" check-config "/etc/alertmanager/$f"
          done
      - name: Pile lancée (sans webhook Discord)
        working-directory: microforge/infra
        run: |
          docker compose --profile monitoring up -d prometheus alertmanager loki grafana
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && break; sleep 2; done
          curl -sf localhost:3000/api/health
          auth="Authorization: Basic $(printf 'admin:%s' "$GRAFANA_ADMIN_PASSWORD" | base64 -w0)"
          dashboards=$(curl -sf -H "$auth" "localhost:3000/api/search?type=dash-db" | jq length)
          sources=$(curl -sf -H "$auth" localhost:3000/api/datasources | jq length)
          for i in $(seq 1 30); do
            managers=$(curl -sf localhost:9090/api/v1/alertmanagers | jq '.data.activeAlertmanagers | length')
            [ "$managers" = "1" ] && break; sleep 2
          done
          for i in $(seq 1 30); do curl -sf localhost:3100/ready && break; sleep 2; done
          loki_rules=$(curl -sf localhost:3100/loki/api/v1/rules | grep -c "alert: ")
          {
            echo "### Supervision"
            echo "- Loki : $loki_rules règle(s) d'alerte sur les journaux"
            echo "- Grafana : $dashboards tableaux de bord, $sources sources de données"
            echo "- Prometheus relié à $managers Alertmanager"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$dashboards" = "2" ] && [ "$sources" = "3" ] && [ "$managers" = "1" ] && [ "$loki_rules" -ge 1 ]
      - name: Journaux en cas d'échec
        if: failure()
        working-directory: microforge/infra
        run: docker compose --profile monitoring logs --tail 80 prometheus alertmanager loki grafana

  pile:
    # La pile telle que Gaël la lance (profils core + monitoring), construite depuis les Dockerfiles.
    # Parcours PWA contre la vraie image nginx (CSP réelles), PostgreSQL et le réseau compose, sans
    # modèle d'IA (copilote par mots-clés) ; puis infra/verifier_pile.py : collecte Prometheus par
    # nom de service, Grafana, journaux des conteneurs dans Loki (Alloy), alerte « échecs de
    # connexion » jusqu'à Alertmanager. Même script que pour un test de fumée en préproduction.
    name: Pile complète (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MF_IMAGE_TAG: ci
      GRAFANA_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Construire et lancer core + monitoring
        working-directory: microforge/infra
        run: |
          # Limiteur de connexion relevé pour l'essai de force brute seulement (10/min par défaut).
          printf 'MF_RATE_LIMIT_TOKEN=200/minute\n' > ../.env
          docker compose --profile core --profile monitoring build
          docker compose --profile core --profile monitoring up -d
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microforge/pwa/package-lock.json
      - name: Playwright et Chromium
        working-directory: microforge/pwa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Supervision de bout en bout
        working-directory: microforge/infra
        run: |
          set -o pipefail  # sans lui, « | tee » masquerait un échec (incident 5)
          python3 verifier_pile.py --force-brute | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Parcours PWA contre la pile
        working-directory: microforge/pwa
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pile-sortie"
          node e2e/parcours-pwa.cjs http://localhost:5173/ "$GITHUB_WORKSPACE/pile-sortie"
      - name: Journaux en cas d'échec
        if: failure()
        working-directory: microforge/infra
        run: docker compose --profile core --profile monitoring logs --tail 60
      - name: Captures du parcours
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: pile-complete
          path: pile-sortie/**
          if-no-files-found: ignore

  firmware-matrix:
    # La matrice vient du catalogue : une entrée par famille de cartes (+ variantes de puce).
    name: Matrice des cartes (catalogue)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - id: m
        run: echo "matrix=$(uv run python -m microforge.core.cli ci-matrix)" >> "$GITHUB_OUTPUT"

  firmware:
    # Compilation RÉELLE (arduino-cli) de tous les modèles sur la carte de référence de chaque
    # famille et sur chaque variante de puce, + un croquis de fumée par carte du catalogue.
    name: Firmwares (${{ matrix.name }})
    needs: firmware-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Installer arduino-cli, le cœur et les bibliothèques du catalogue
        env:
          INDEX: ${{ matrix.index }}
          CORE: ${{ matrix.core }}
          FQBN: ${{ matrix.fqbn }}
        run: |
          mkdir -p "$HOME/.local/bin"  # install.sh exige que le dossier existe
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Serveurs des cœurs (Espressif, Arduino, rp2040…) parfois en 504 : 4 essais espacés
          # (30, 60, 120 s) au lieu d'un échec au premier téléchargement (CI 117 et 118, 09/11).
          retry() {
            for attente in 30 60 120 0; do
              "$@" && return 0
              [ "$attente" -eq 0 ] && return 1
              echo "::warning::échec de « $* », nouvel essai dans $attente s"
              sleep "$attente"
            done
          }
          arduino-cli config init --overwrite
          if [ -n "$INDEX" ]; then arduino-cli config add board_manager.additional_urls "$INDEX"; fi
          retry arduino-cli core update-index
          retry arduino-cli core install "$CORE"
          uv run python -m microforge.core.cli libs --fqbn "$FQBN" | tee libs.txt
          if [ -s libs.txt ]; then retry xargs -d '\n' -a libs.txt arduino-cli lib install; fi
      - name: Générer et compiler TOUS les modèles compatibles
        run: uv run python -m microforge.core.cli compile-demo --all --fqbn "${{ matrix.fqbn }}" --out build/firmware
      - name: Croquis de fumée sur chaque carte de la famille
        if: ${{ matrix.smoke }}
        run: uv run python -m microforge.core.cli board-smoke --family "${{ matrix.family }}"

  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
