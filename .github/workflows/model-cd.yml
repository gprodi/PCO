# C13 — Chaîne de livraison continue du modèle de vision.
# Étapes : tests des données -> entraînement (runner GPU auto-hébergé) -> évaluation + porte de
# non-régression -> enregistrement MLflow (@staging) -> PR « Modèle vX » avec le rapport joint.
# La fusion de la PR (label model-release) promeut le modèle en @production (job promote).
name: model-cd

on:
  push:
    branches: [main]
    paths: ["microforge/ml/**", "**/*.dvc"]
  repository_dispatch:
    types: [retrain]          # envoyé par l'alerte Grafana « taux de corrections > 25 % »
  workflow_dispatch:
    inputs:
      epochs: { description: "Nombre d'epochs", default: "80" }
  schedule:
    - cron: "17 3 1 * *"      # réentraînement mensuel
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
  MLFLOW_S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}

jobs:
  data-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-packages --group dev --extra ml
      - name: Récupérer le dataset versionné (DVC)
        run: uv run dvc pull -r s3 data/dataset.dvc
      - name: Tests des données et du code modèle (C12)
        run: uv run pytest microforge/tests/test_ml_data.py -q

  train-evaluate:
    needs: data-tests
    runs-on: [self-hosted, gpu]          # PC du bureau (GPU 8 Go), profil gpu-8gb
    outputs:
      run_id: ${{ steps.train.outputs.run_id }}
      ok: ${{ steps.eval.outputs.ok }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-packages --extra ml && uv run dvc pull -r s3 data/dataset.dvc
      - id: train
        name: Entraînement (MLflow)
        env: { LLM_PROFILE: gpu-8gb }
        run: echo "run_id=$(uv run python microforge/ml/train.py --epochs ${{ inputs.epochs || 80 }})" >> "$GITHUB_OUTPUT"
      - id: eval
        name: Évaluation + porte de non-régression
        run: |
          set +e
          uv run python microforge/ml/evaluate.py --weights runs/detect/${{ steps.train.outputs.run_id }}/weights/best.pt --out reports/evaluation
          echo "ok=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: evaluation, path: reports/evaluation }

  deliver:
    needs: train-evaluate
    if: needs.train-evaluate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-packages --extra ml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: evaluation, path: microforge/ml/reports/latest }
      - name: Enregistrer le candidat (@staging)
        run: uv run python microforge/ml/register.py --run-id ${{ needs.train-evaluate.outputs.run_id }} --alias staging
      - name: Ouvrir la PR de livraison avec le rapport d'évaluation
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: model/${{ needs.train-evaluate.outputs.run_id }}
          title: "Modèle de détection — run ${{ needs.train-evaluate.outputs.run_id }}"
          body-path: microforge/ml/reports/latest/report.md
          labels: model-release
          commit-message: "Rapport d'évaluation du modèle ${{ needs.train-evaluate.outputs.run_id }}"

  promote:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'model-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-packages --extra ml
      - name: Promotion @production (l'api_ia recharge le modèle par alias)
        run: |
          RUN_ID="${GITHUB_HEAD_REF#model/}"
          uv run python microforge/ml/register.py --run-id "$RUN_ID" --alias production
