# Documentation Sphinx (dossiers E1–E5, API) publiée sur GitHub Pages sous /docs.
name: docs

on:
  push:
    branches: [main]
    paths: ["microforge/docs/**", "microforge/src/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-packages --group docs
      - run: uv run sphinx-build -W --keep-going -b html microforge/docs microforge/docs/_build/html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: docs-html, path: microforge/docs/_build/html }
