# Documentation Sphinx (dossiers E1–E5, API) publiée sur GitHub Pages sous /docs.
name: docs

on:
  push:
    branches: [main]
    paths: ["microforge/docs/**", "microforge/src/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (Node 24)
      - run: uv sync --all-packages --group docs
      - run: uv run sphinx-build -W --keep-going -b html microforge/docs microforge/docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with: { name: docs-html, path: microforge/docs/_build/html }
