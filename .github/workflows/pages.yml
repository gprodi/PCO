# Publication du site « Révisions DevIA » (statique) sur GitHub Pages.
# Activer : Settings > Pages > Source : GitHub Actions. Le chat/l'ajout de cours restent locaux.
name: pages

on:
  push:
    branches: [main]
    paths: ["revision/**", "referentiel/**", "microforge/src/microforge/core/data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Exporter le contenu (seed + données)
        run: |
          uv sync --all-packages
          uv run revise seed
          uv run revise export
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: revision/site/package-lock.json
      - name: Construire le site
        working-directory: revision/site
        env:
          PUBLIC_MODE: static
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: revision/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
