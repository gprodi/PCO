name: jeux-de-donnees
# Le conteneur de développement n'atteint ni Hugging Face ni Mendeley : l'inspection des jeux de
# données candidats (licence, classes, volumes) se fait sur un runner, résultat dans le résumé du job.
on:
  push:
    paths:
      - microforge/ml/candidates.yaml
      - microforge/ml/inspect_sources.py
      - microforge/ml/fetch_mendeley.py
      - microforge/ml/coco_to_yolo.py
      - microforge/ml/fetch_roboflow.py
      - microforge/ml/prepare.py
      - microforge/ml/sources/**
      - microforge/ml/train.py
      - microforge/ml/data/dataset.yaml
      - .github/workflows/jeux-de-donnees.yml
  workflow_dispatch:
permissions:
  contents: read
# Un entraînement à la fois par branche ; un push pendant un entraînement attend la fin de celui-ci
# (une mesure commencée n'est pas perdue) et seul le dernier push en attente est gardé.
concurrency:
  group: jeux-de-donnees-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspecter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Inspecter les candidats
        run: |
          uv run --no-project --with huggingface_hub --with httpx --with pyyaml \
            python microforge/ml/inspect_sources.py microforge/ml/candidates.yaml | tee inspection.md
          cat inspection.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspection-jeux-de-donnees
          path: inspection.md

  iotkits:
    # IoTKITs (Data in Brief 2025, CC BY 4.0) : téléchargement après contrôle de la licence,
    # conversion COCO -> YOLO, inventaire des catégories, puis préparation si la correspondance existe.
    # Avec le secret ROBOFLOW_API_KEY (compte Roboflow gratuit), les jeux Roboflow Universe retenus
    # (ml/sources/*.yaml avec roboflow_version) sont ajoutés : entraînement plus long (~15 000 images).
    name: IoTKITs (+ jeux Roboflow si clé)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Télécharger (licence CC BY vérifiée)
        run: uv run --no-project --with httpx python microforge/ml/fetch_mendeley.py x5thzmkxhy 1 data/raw/iotkits
      - name: Convertir COCO -> YOLO et inventorier les catégories
        run: |
          uv run --no-project --with pyyaml python microforge/ml/coco_to_yolo.py data/raw/iotkits data/sources/iotkits | tee categories.md
          { echo "## IoTKITs : catégories"; cat categories.md; echo; echo '```json'; cat data/raw/iotkits/provenance.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Clé Roboflow configurée ?
        id: roboflow
        env:
          KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          cle=$([ -n "$KEY" ] && echo oui || echo non)
          echo "cle=$cle" >> "$GITHUB_OUTPUT"
          if [ "$cle" = oui ]; then msg="présente : jeux Roboflow téléchargés"; else
            msg="**absente** : secret ROBOFLOW_API_KEY à créer dans Settings > Secrets and variables > Actions > onglet Secrets (pas Variables) > Repository secrets"; fi
          echo "Clé Roboflow $msg" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Jeux Roboflow Universe retenus (licence vérifiée)
        if: steps.roboflow.outputs.cle == 'oui'
        continue-on-error: true # un jeu refusé (licence changée…) n'empêche pas d'entraîner sur les autres
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }} # visible de cette seule étape
        run: |
          set -o pipefail
          uv run --no-project --with httpx --with pyyaml python microforge/ml/fetch_roboflow.py data/sources | tee roboflow.md
          { echo "## Jeux Roboflow Universe"; cat roboflow.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Préparer le dataset (correspondance des classes)
        if: hashFiles('microforge/ml/sources/iotkits.yaml') != ''
        run: |
          set -o pipefail
          cp microforge/ml/sources/iotkits.yaml data/sources/iotkits/source.yaml
          uv run --no-project --with pyyaml --with pillow python microforge/ml/prepare.py \
            --sources data/sources --out data/dataset --dataset-yaml microforge/ml/data/dataset.yaml | tee stats.json
          { echo "## Dataset préparé"; echo '```json'; cat stats.json; echo '```'; cat data/dataset/ATTRIBUTION.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Entraînement court sur CPU (YOLO11n, 15 epochs, 416 px) puis évaluation sur le test
        if: hashFiles('microforge/ml/sources/iotkits.yaml') != ''
        env:
          LLM_PROFILE: cpu
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          DVC_DATA_VERSION: ${{ steps.roboflow.outputs.cle == 'oui' && 'iotkits+roboflow-v1' || 'iotkits-v1' }}
        run: |
          set -o pipefail
          uv sync --all-packages --extra ml
          # Ultralytics résout un « path » relatif depuis son propre dossier : chemin absolu ici.
          uv run python - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open("microforge/ml/data/dataset.yaml"))
          cfg["path"] = os.path.abspath("data/dataset")
          yaml.safe_dump(cfg, open("dataset-runner.yaml", "w"), allow_unicode=True)
          PY
          uv run python microforge/ml/train.py --data dataset-runner.yaml --epochs 15 --imgsz 416 --batch 16 2>&1 | tee entrainement.log
          best=$(ls -t "$PWD"/runs/detect/*/weights/best.pt | head -1)
          test -n "$best"
          uv run yolo val model="$best" data=dataset-runner.yaml split=test imgsz=416 device=cpu project="$PWD/runs/val" name=test 2>&1 | tee evaluation-test.log
          { echo "## Entraînement CPU (15 epochs) et test"; echo '```'; tail -40 evaluation-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iotkits-rapport
          path: |
            categories.md
            roboflow.md
            data/sources/roboflow-provenance.json
            stats.json
            data/raw/iotkits/provenance.json
            data/dataset/ATTRIBUTION.md
            data/dataset/manifest.json
            entrainement.log
            evaluation-test.log
            runs/detect/*/results.csv
            runs/detect/*/weights/best.pt
            runs/val*/**/*.png
            # Suivi MLflow du run (paramètres, métriques par epoch, modèle) : comparable dans « mlflow ui ».
            mlflow.db
            mlruns/**
            mlartifacts/**
          if-no-files-found: ignore
