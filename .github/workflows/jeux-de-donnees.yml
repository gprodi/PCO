name: jeux-de-donnees
# Le conteneur de développement n'atteint ni Hugging Face ni Mendeley : l'inspection des jeux de
# données candidats (licence, classes, volumes) se fait sur un runner, résultat dans le résumé du job.
on:
  push:
    paths:
      - microforge/ml/candidates.yaml
      - microforge/ml/inspect_sources.py
      - .github/workflows/jeux-de-donnees.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Inspecter les candidats
        run: |
          uv run --no-project --with huggingface_hub --with httpx --with pyyaml \
            python microforge/ml/inspect_sources.py microforge/ml/candidates.yaml | tee inspection.md
          cat inspection.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspection-jeux-de-donnees
          path: inspection.md
