# Migrations de la base MicroForge (C4). L'URL de connexion vient de MF_DATABASE_URL
# (fichier .env) : aucun secret dans ce fichier.
#   cd microforge && uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "message"   # après modification de api_data/db.py
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
