# Même routage que alertmanager.yml, notifications sur Discord. L'adresse du webhook (un secret)
# n'est jamais écrite ici : start.sh la recopie depuis DISCORD_WEBHOOK_URL dans le volume du conteneur.
route:
  receiver: discord
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: ['alertname="APIIndisponible"']
    target_matchers: ['alertname=~"LatenceP95Elevee|TauxErreurs5xx"']
    equal: [job]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /alertmanager/discord_webhook_url
        send_resolved: true
