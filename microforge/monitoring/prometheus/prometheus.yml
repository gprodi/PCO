# Collecte des métriques (C11 modèle, C20 application). Intervalle 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api_data
    static_configs: [{ targets: ["api_data:8000"] }]
  - job_name: api_ia
    static_configs: [{ targets: ["api_ia:8001"] }]
  - job_name: litellm
    metrics_path: /metrics/
    static_configs: [{ targets: ["litellm:4000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
