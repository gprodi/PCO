# Règles d'alerte : seuils documentés dans docs/E5/monitoring.md et docs/E3/monitoring-modele.md.
groups:
  - name: application            # C20
    rules:
      - alert: APIIndisponible
        expr: up{job=~"api_data|api_ia"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} ne répond plus depuis 1 min" }
      - alert: LatenceP95Elevee
        expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Latence p95 de {{ $labels.job }} > 2 s" }
      - alert: TauxErreurs5xx
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Plus de 2 % d'erreurs 5xx sur {{ $labels.job }}" }
      - alert: FallbackLLMFrequent
        expr: mf_llm_calls{kind="fallback"} - mf_llm_calls{kind="fallback"} offset 15m > 10
        labels: { severity: warning }
        annotations: { summary: "Le LLM local échoue souvent : repli vers Gemini/Claude" }

  - name: modele                 # C11
    rules:
      - alert: TauxCorrectionsEleve
        expr: mf_detection_correction_rate > 0.25
        for: 1h
        labels: { severity: warning, action: retrain }
        annotations: { summary: "Plus de 25 % des détections {{ $labels.source }} corrigées : réentraînement à déclencher" }
      - alert: ConfianceMoyenneBasse
        expr: sum(rate(mf_detection_confidence_sum[24h])) / sum(rate(mf_detection_confidence_count[24h])) < 0.5
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "Confiance moyenne des détections < 0,5 sur 24 h (dérive des photos ?)" }
      - alert: ObjetsInconnusEnHausse
        expr: sum(rate(mf_detections_unknown_total[6h])) / sum(rate(mf_detections_total[6h])) > 0.2
        for: 1h
        labels: { severity: info }
        annotations: { summary: "Plus de 20 % d'objets hors catalogue : enrichir le catalogue/dataset" }
