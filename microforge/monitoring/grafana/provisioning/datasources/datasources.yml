apiVersion: 1
datasources:
  - { name: Prometheus, type: prometheus, url: http://prometheus:9090, isDefault: true, uid: prom }
  - { name: Loki, type: loki, url: http://loki:3100, uid: loki }
  # Alertes de Prometheus (règles de prometheus/alerts.yml), affichées dans Grafana > Alerting.
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    url: http://alertmanager:9093
    jsonData: { implementation: prometheus, handleGrafanaManagedAlerts: false }
