[project]
name = "microforge"
version = "0.1.0"
description = "MicroForge — de la photo de ton stock électronique au montage soudé, programmé et simulé"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gaël Prodi" }]
dependencies = [
    "llm-gateway",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "typer>=0.12",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "pwdlib[argon2]>=0.2",
    "cryptography>=43",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "pillow>=10.4",
    "email-validator>=2.1",
    # Sorties électroniques
    "schemdraw>=0.19",
]

[project.optional-dependencies]
# E1 — collecte / agrégation (légers : installés en CI)
data = [
    "polars>=1.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.9",
    "tenacity>=9.0",
    "pypdf>=5.0",
]
# Orchestration et big data (lourds : machines locales / Docker)
orchestration = ["prefect>=3.0"]
bigdata = ["pyspark>=3.5", "google-cloud-bigquery>=3.25"]
db = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# E3 — modèle de vision + MLOps
ml = ["ultralytics>=8.3", "mlflow>=2.17", "dvc[s3]>=3.55", "evidently>=0.4", "codecarbon>=2.7", "albumentations>=1.4"]
# Worker de tâches longues
worker = ["celery[redis]>=5.4", "flower>=2.0"]
# Preuve de concept
app = ["streamlit>=1.39"]
# Export KiCad
kicad = ["skidl>=1.2"]

[project.scripts]
microforge = "microforge.core.cli:app"
mf-pipeline = "microforge.data_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microforge"]
