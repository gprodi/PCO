# Préproduction : Traefik devant MicroForge (HTTPS Let's Encrypt, redirection HTTP → HTTPS, en-têtes de
# sécurité). Se superpose au fichier principal ; seuls les ports 80 et 443 de Traefik restent ouverts.
#
#   cd microforge/infra
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml --profile core --profile edge up -d
#
# Variables (fichier ../.env) : MF_DOMAIN (ex. microforge.example.org, avec les enregistrements DNS
# app., api. et ia. vers le serveur) et ACME_EMAIL (contact Let's Encrypt). Procédure : docs/E4/cd.md.

services:
  traefik:
    profiles: [edge]
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false # seuls les services étiquetés sont publiés
      - --providers.docker.network=microforge_frontend
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL requis}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    ports: ["80:80", "443:443"]
    volumes:
      # Lecture seule : Traefik lit les étiquettes des conteneurs, il ne les pilote pas.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [frontend]
    mem_limit: 128m
    labels:
      - traefik.enable=true
      # En-têtes de sécurité, partagés par les trois routes
      - traefik.http.middlewares.securite.headers.stsSeconds=31536000
      - traefik.http.middlewares.securite.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.securite.headers.contentTypeNosniff=true
      - traefik.http.middlewares.securite.headers.frameDeny=true
      - traefik.http.middlewares.securite.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.securite.headers.permissionsPolicy=camera=(self), geolocation=()

  streamlit:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.${MF_DOMAIN:?MF_DOMAIN requis}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.middlewares=securite@docker
      - traefik.http.services.app.loadbalancer.server.port=8501

  api_data:
    ports: !reset []
    networks: [backend, frontend]
    environment:
      MF_CORS_ORIGINS: https://app.${MF_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${MF_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=securite@docker
      - traefik.http.services.api.loadbalancer.server.port=8000

  api_ia:
    ports: !reset []
    networks: [backend, frontend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ia.rule=Host(`ia.${MF_DOMAIN}`)
      - traefik.http.routers.ia.entrypoints=websecure
      - traefik.http.routers.ia.middlewares=securite@docker
      - traefik.http.services.ia.loadbalancer.server.port=8001

volumes:
  letsencrypt: {}
