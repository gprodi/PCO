# Préproduction : Traefik devant MicroForge (HTTPS Let's Encrypt, redirection HTTP → HTTPS, en-têtes de
# sécurité). Se superpose au fichier principal ; seuls les ports 80 et 443 de Traefik restent ouverts.
#
#   cd microforge/infra
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml --profile core --profile edge up -d
#
# Variables (fichier ../.env) : MF_DOMAIN (ex. microforge.example.org, avec les enregistrements DNS
# app., poc., api. et ia. vers le serveur) et ACME_EMAIL (contact Let's Encrypt). Procédure : docs/E4/cd.md.
#   app.  → PWA (application des utilisateurs)      api. → api_data
#   poc.  → Streamlit (preuve de concept)            ia.  → api_ia

services:
  traefik:
    profiles: [edge]
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false # seuls les services étiquetés sont publiés
      - --providers.docker.network=microforge_frontend
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL requis}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    ports: ["80:80", "443:443"]
    volumes:
      # Lecture seule : Traefik lit les étiquettes des conteneurs, il ne les pilote pas.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [frontend]
    mem_limit: 128m
    labels:
      - traefik.enable=true
      # En-têtes de sécurité, partagés par les quatre routes (sauf le cadre de l'atelier, plus bas)
      - traefik.http.middlewares.securite.headers.stsSeconds=31536000
      - traefik.http.middlewares.securite.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.securite.headers.contentTypeNosniff=true
      - traefik.http.middlewares.securite.headers.frameDeny=true
      - traefik.http.middlewares.securite.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.securite.headers.permissionsPolicy=camera=(self), geolocation=()
      # Variante pour le cadre de l'atelier virtuel (app./atelier/) : affichable par l'application
      # elle-même (SAMEORIGIN) ; sa CSP nginx limite déjà frame-ancestors à 'self'.
      - traefik.http.middlewares.securite-cadre.headers.stsSeconds=31536000
      - traefik.http.middlewares.securite-cadre.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.securite-cadre.headers.contentTypeNosniff=true
      - traefik.http.middlewares.securite-cadre.headers.customFrameOptionsValue=SAMEORIGIN
      - traefik.http.middlewares.securite-cadre.headers.referrerPolicy=no-referrer

  pwa:
    ports: !reset []
    environment:
      MF_PUBLIC_API_DATA_URL: https://api.${MF_DOMAIN:?MF_DOMAIN requis}
      MF_PUBLIC_API_IA_URL: https://ia.${MF_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.${MF_DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.middlewares=securite@docker
      - traefik.http.routers.app.service=app
      - traefik.http.services.app.loadbalancer.server.port=8080
      # Règle plus longue, donc prioritaire : seul /atelier/ quitte frameDeny.
      - traefik.http.routers.app-atelier.rule=Host(`app.${MF_DOMAIN}`) && PathPrefix(`/atelier/`)
      - traefik.http.routers.app-atelier.entrypoints=websecure
      - traefik.http.routers.app-atelier.middlewares=securite-cadre@docker
      - traefik.http.routers.app-atelier.service=app

  streamlit:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.poc.rule=Host(`poc.${MF_DOMAIN}`)
      - traefik.http.routers.poc.entrypoints=websecure
      - traefik.http.routers.poc.middlewares=securite@docker
      - traefik.http.services.poc.loadbalancer.server.port=8501

  # Le navigateur (PWA) appelle les deux API : seule l'origine https://app. est autorisée (CORS).
  api_data:
    ports: !reset []
    networks: [backend, frontend]
    environment:
      MF_CORS_ORIGINS: https://app.${MF_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${MF_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=securite@docker
      - traefik.http.services.api.loadbalancer.server.port=8000

  api_ia:
    ports: !reset []
    networks: [backend, frontend]
    environment:
      MF_CORS_ORIGINS: https://app.${MF_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.ia.rule=Host(`ia.${MF_DOMAIN}`)
      - traefik.http.routers.ia.entrypoints=websecure
      - traefik.http.routers.ia.middlewares=securite@docker
      - traefik.http.services.ia.loadbalancer.server.port=8001

volumes:
  letsencrypt: {}
