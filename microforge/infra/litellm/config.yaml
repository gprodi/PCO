# Passerelle LiteLLM (C8) : un point d'entrée compatible OpenAI pour tous les modèles,
# avec clés virtuelles par service, quotas et repli automatique.
# Les noms « mf-* » sont ceux attendus par llm_gateway (profil « litellm »).
model_list:
  - model_name: mf-text
    litellm_params: { model: ollama_chat/qwen3:8b, api_base: "os.environ/OLLAMA_BASE_URL" }
  - model_name: mf-code
    litellm_params: { model: ollama_chat/qwen3:8b, api_base: "os.environ/OLLAMA_BASE_URL" }
  - model_name: mf-vision
    litellm_params: { model: ollama_chat/qwen3-vl:8b, api_base: "os.environ/OLLAMA_BASE_URL" }
  - model_name: mf-embed
    litellm_params: { model: ollama/bge-m3, api_base: "os.environ/OLLAMA_BASE_URL" }
  # Secours (offre gratuite Gemini puis Claude, payant)
  - model_name: mf-text-fallback
    litellm_params: { model: gemini/gemini-flash-latest, api_key: "os.environ/GEMINI_API_KEY" }
  - model_name: mf-vision-fallback
    litellm_params: { model: gemini/gemini-flash-latest, api_key: "os.environ/GEMINI_API_KEY" }
  - model_name: mf-claude
    litellm_params: { model: anthropic/claude-opus-5-5, api_key: "os.environ/ANTHROPIC_API_KEY" }

router_settings:
  num_retries: 1
  timeout: 120
  fallbacks:
    - mf-text: [mf-text-fallback, mf-claude]
    - mf-code: [mf-text-fallback, mf-claude]
    - mf-vision: [mf-vision-fallback, mf-claude]

litellm_settings:
  drop_params: true
  callbacks: ["prometheus"]        # métriques (requêtes, latence, tokens, échecs, fallbacks)

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"   # clés virtuelles, budgets, journal des dépenses
