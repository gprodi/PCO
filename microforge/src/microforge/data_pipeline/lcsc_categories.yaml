  "Connectors / Pin Headers": consommable
  "Connectors / Female Headers": consommable
  "Connectors / Screw Terminal Blocks": consommable
  "Connectors / Shunts, Jumpers": consommable
  "Wire / Cable / Data Cable / Jumper Wire / Enameled Wire / Pre-Crimped Leads": consommable
  "Wires and Cables / Dupont Wire / Terminal Block Wire / Electronic Wire": consommable
