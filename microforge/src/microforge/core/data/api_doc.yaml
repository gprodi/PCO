# Explications des fonctions appelées par les programmes générés (onglet « Apprendre »).
# « {nom} » est remplacé par le nom de la pièce dans le projet (porte, sirene, ecran…).
# Un test vérifie que chaque fonction utilisée par un modèle a son explication.

fonctions:
  "on": "allume « {nom} » (sortie à l'état haut)"
  "off": "éteint « {nom} » (sortie à l'état bas)"
  toggle: "inverse l'état de « {nom} » : allumée devient éteinte, et inversement"
  set: "règle « {nom} » : allumé/éteint, ou intensité de 0 à 255 en PWM"
  beep: "fait sonner « {nom} » : fréquence en hertz, durée en millisecondes"
  stop: "arrête « {nom} »"
  buzz: "fait vibrer « {nom} » pendant la durée donnée (ms)"
  angle: "tourne le servomoteur « {nom} » à l'angle demandé (0 à 180°)"
  steps: "fait avancer le moteur pas à pas « {nom} » du nombre de pas donné (négatif : en arrière) ; l'appel bloque pendant le mouvement"
  degrees: "fait tourner le moteur pas à pas « {nom} » d'un angle en degrés"
  motors: "règle la vitesse des deux moteurs de « {nom} » : de -255 (arrière) à 255 (avant), 0 = arrêt"
  power: "règle la puissance envoyée par « {nom} », en pourcentage (0 à 100 %), par modulation PWM"
  print: "affiche des lignes de texte sur l'écran « {nom} »"
  number: "affiche un nombre sur l'afficheur à 4 chiffres « {nom} »"
  time: "heure courante lue sur « {nom} », sous forme de texte hh:mm:ss"
  date: "date courante lue sur « {nom} » (jj/mm/aaaa)"
  hour: "heure (0 à 23) lue sur l'horloge « {nom} »"
  minute: "minutes (0 à 59) lues sur l'horloge « {nom} »"
  second: "secondes (0 à 59) lues sur l'horloge « {nom} »"
  day: "jour du mois (1 à 31) lu sur l'horloge « {nom} »"
  month: "mois (1 à 12) lu sur l'horloge « {nom} »"
  show: "affiche une image de 8 × 8 points sur la matrice « {nom} » (8 octets, un par ligne)"
  clear: "efface la matrice « {nom} »"
  bars: "dessine des barres verticales (bargraphe) sur la matrice « {nom} »"
  fill: "allume toutes les LED de « {nom} » de la même couleur (rouge, vert, bleu de 0 à 255)"
  pixel: "allume une seule LED de « {nom} » (numéro, puis rouge, vert, bleu)"
  wheel: "colore « {nom} » avec une teinte de l'arc-en-ciel (0 à 255)"
  gauge: "remplit l'anneau « {nom} » comme une jauge, selon un pourcentage"
  color: "règle la couleur de la LED RVB « {nom} » (rouge, vert, bleu de 0 à 255)"
  write: "envoie 8 bits au registre à décalage « {nom} » : une sortie par bit"
  read: "lit les 8 entrées du registre « {nom} » : un bit par entrée"
  append: "ajoute une ligne à un fichier de la carte microSD « {nom} » ; renvoie faux si l'écriture échoue"
  temperature: "température mesurée par « {nom} », en °C"
  humidity: "humidité relative de l'air mesurée par « {nom} », en %"
  pressure_hpa: "pression atmosphérique mesurée par « {nom} », en hectopascals"
  altitude_m: "altitude estimée par « {nom} » à partir de la pression, en mètres"
  distance_cm: "distance de l'obstacle mesurée par « {nom} » en centimètres (temps de vol de l'ultrason) ; -1 sans écho"
  distance_mm: "distance mesurée par le laser « {nom} », en millimètres ; -1 hors de portée"
  light_percent: "lumière captée par « {nom} », en pourcentage"
  lux: "éclairement mesuré par « {nom} », en lux"
  level: "niveau mesuré par « {nom} », de 0 à 100"
  level_percent: "concentration relative de gaz mesurée par « {nom} », en pourcentage"
  raw: "valeur brute lue sur l'entrée analogique de « {nom} » (avant conversion)"
  percent: "position ou valeur de « {nom} » en pourcentage (0 à 100)"
  wet: "vrai si « {nom} » détecte de l'eau"
  detected: "vrai si « {nom} » détecte une flamme"
  intensity: "intensité de la flamme vue par « {nom} », de 0 à 100"
  motion: "vrai si « {nom} » détecte un mouvement"
  open: "vrai si le contact « {nom} » est ouvert (aimant éloigné : porte ouverte)"
  on_line: "vrai si « {nom} » est au-dessus de la ligne noire (moins de lumière réfléchie)"
  pressed: "vrai tant que « {nom} » est enfoncé"
  clicked: "vrai une seule fois par appui sur « {nom} » (front montant, rebonds filtrés)"
  tapped: "vrai une seule fois par toucher de « {nom} »"
  loud: "vrai si « {nom} » entend un bruit fort (clap, claquement)"
  delta: "nombre de crans tournés sur « {nom} » depuis la dernière lecture (négatif : sens inverse)"
  key: "touche pressée sur le clavier « {nom} », ou 0 si aucune"
  command: "code de la touche reçue par « {nom} » depuis la télécommande, ou 0"
  read_uid: "identifiant du badge présenté à « {nom} », ou texte vide"
  grams: "masse posée sur « {nom} », en grammes (après tare)"
  tare: "remet la balance « {nom} » à zéro avec ce qui est posé dessus"
  tilt_x: "inclinaison de « {nom} » sur l'axe X, en degrés"
  tilt_y: "inclinaison de « {nom} » sur l'axe Y, en degrés"
  x: "position horizontale de la manette « {nom} », de -100 à 100"
  "y": "position verticale de la manette « {nom} », de -100 à 100"
  voltage_v: "tension mesurée par « {nom} », en volts"
  current_ma: "courant mesuré par « {nom} », en milliampères"
  power_mw: "puissance mesurée par « {nom} », en milliwatts"

composants:
  relay-module-1ch:
    "on": "ferme le relais « {nom} » : l'appareil branché dessus est alimenté"
    "off": "ouvre le relais « {nom} » : l'appareil est coupé"
  mosfet-irlz44n:
    "on": "rend le transistor « {nom} » passant : la charge est alimentée"
    "off": "bloque le transistor « {nom} » : la charge est coupée"
    set: "règle la puissance envoyée à la charge par « {nom} », de 0 à 255 (PWM)"
  darlington-tip120:
    set: "règle la puissance envoyée à la charge par le transistor « {nom} », de 0 à 255 (PWM)"
  buzzer:
    stop: "coupe le son de « {nom} »"
  l298n-driver:
    stop: "arrête les deux moteurs de « {nom} »"
  tb6612fng-driver:
    stop: "arrête les deux moteurs de « {nom} »"
  tm1637-display:
    time: "affiche une heure hh:mm sur l'afficheur « {nom} » (deux points allumés)"
  ky038-sound:
    level: "niveau sonore capté par « {nom} », de 0 à 100"
  rotary-encoder-ky040:
    pressed: "vrai tant que le bouton de l'encodeur « {nom} » est enfoncé"
  soil-moisture-capacitive:
    percent: "humidité de la terre mesurée par « {nom} », en pourcentage"

arduino:
  delay: "met le programme en pause (en millisecondes) : rien d'autre ne s'exécute pendant ce temps"
  millis: "temps écoulé depuis le démarrage, en millisecondes : sert à mesurer des durées sans bloquer le programme"
  micros: "temps écoulé depuis le démarrage, en microsecondes"
  Serial.print: "écrit un texte ou une valeur dans le moniteur série (sans retour à la ligne)"
  Serial.println: "écrit un texte ou une valeur dans le moniteur série, puis passe à la ligne"
  Serial.begin: "ouvre la liaison série avec l'ordinateur (vitesse en bauds) : c'est le moniteur série"
  String: "transforme une valeur en texte (le second nombre : chiffres après la virgule)"
  map: "convertit une valeur d'une plage vers une autre (ex. 0–100 % vers 0–180°), en nombres entiers"
  constrain: "garde une valeur entre un minimum et un maximum"
  random: "nombre entier au hasard entre deux bornes (la borne haute est exclue)"
  randomSeed: "initialise le hasard, pour ne pas obtenir la même suite à chaque démarrage"
  abs: "valeur absolue (sans signe)"
  isnan: "vrai si la valeur n'est pas un nombre : capteur absent ou mesure ratée"
  mf_setup_components: "prépare chaque composant (broches, bus I2C ou SPI, bibliothèques) : fonction écrite par MicroForge dans mf_components.h"
  WiFi.localIP: "adresse de la carte sur le réseau Wi-Fi, à taper dans le navigateur du téléphone"
  mf_time_hhmm: "heure de l'horloge Internet (NTP) au format hh:mm"
