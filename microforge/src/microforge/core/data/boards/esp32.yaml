# Cartes Espressif ESP32 (cœur esp32:esp32). Bus I2C/SPI par défaut recopiés des fichiers
# variants/<carte>/pins_arduino.h du dépôt espressif/arduino-esp32 ; broches de démarrage, flash/PSRAM
# et USB d'après les fiches techniques Espressif. Noms de broches Wokwi : dépôt wokwi/wokwi-boards.

- id: esp32-devkit-v1
  name: ESP32 DevKit V1 (ESP32-WROOM-32, 30 broches)
  family: esp32
  mcu: ESP32 (Xtensa LX6 double cœur 240 MHz)
  aliases: [esp32, esp32 devkit, esp32-wroom-32, esp32 dev module, doit esp32, esp32 devkitc v4, esp32-wroom-32d, esp32-wroom-32e]
  representative: true
  adc2_wifi_conflict: true
  source: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32/hw-reference/esp32/get-started-devkitc.html"
  logic_v: 3.3
  five_v_tolerant: false
  rails: { "3V3": 3.3, "VIN": 5.0 }
  rail_budget_ma: { "3V3": 300, "VIN": 400 }
  gpio_max_ma: 12
  wifi: true
  bluetooth: true
  fqbn: esp32:esp32:esp32
  platformio_board: esp32doit-devkit-v1
  default_i2c: { sda: 21, scl: 22 }
  default_spi: { mosi: 23, miso: 19, sck: 18, cs: 5 }
  default_uart: { rx: 16, tx: 17 }
  preferred_order: [25, 26, 27, 32, 33, 13, 14, 4, 16, 17, 18, 19, 23, 21, 22, 2, 15, 5, 12]
  wokwi:
    type: wokwi-esp32-devkit-v1
    gnd: GND.1
    rails: { "3V3": "3V3", "VIN": "VIN" }
  kicad: { symbol: "MCU_Module:ESP32-DevKitC", footprint: "Module:ESP32-DevKit-V1_30pin" }
  price_eur: 7.5
  notes:
    - "Les GPIO ne tolèrent PAS le 5 V : tout signal 5 V doit passer par un pont diviseur ou un level shifter."
    - "ADC2 (GPIO 0, 2, 4, 12–15, 25–27) est inutilisable quand le Wi-Fi est actif : utiliser ADC1 (32–39)."
    - "GPIO 0, 2, 5, 12, 15 sont des broches de démarrage (strapping) : à éviter pour des entrées tirées."
    - "GPIO 34, 35, 36 (VP), 39 (VN) sont en entrée seule, sans pull-up interne."
  pins:
    - { gpio: 2,  label: D2,  wokwi: D2,  caps: [digital, pwm, adc, adc2, touch], strapping: true, note: "LED intégrée, strapping" }
    - { gpio: 4,  label: D4,  wokwi: D4,  caps: [digital, pwm, adc, adc2, touch] }
    - { gpio: 5,  label: D5,  wokwi: D5,  caps: [digital, pwm], strapping: true, note: "SPI CS par défaut, strapping" }
    - { gpio: 12, label: D12, wokwi: D12, caps: [digital, pwm, adc, adc2, touch], strapping: true, note: "doit être LOW au boot (tension flash)" }
    - { gpio: 13, label: D13, wokwi: D13, caps: [digital, pwm, adc, adc2, touch] }
    - { gpio: 14, label: D14, wokwi: D14, caps: [digital, pwm, adc, adc2, touch] }
    - { gpio: 15, label: D15, wokwi: D15, caps: [digital, pwm, adc, adc2, touch], strapping: true }
    - { gpio: 16, label: RX2, wokwi: RX2, caps: [digital, pwm, uart] }
    - { gpio: 17, label: TX2, wokwi: TX2, caps: [digital, pwm, uart] }
    - { gpio: 18, label: D18, wokwi: D18, caps: [digital, pwm, spi] }
    - { gpio: 19, label: D19, wokwi: D19, caps: [digital, pwm, spi] }
    - { gpio: 21, label: D21, wokwi: D21, caps: [digital, pwm, i2c] }
    - { gpio: 22, label: D22, wokwi: D22, caps: [digital, pwm, i2c] }
    - { gpio: 23, label: D23, wokwi: D23, caps: [digital, pwm, spi] }
    - { gpio: 25, label: D25, wokwi: D25, caps: [digital, pwm, adc, adc2, dac] }
    - { gpio: 26, label: D26, wokwi: D26, caps: [digital, pwm, adc, adc2, dac] }
    - { gpio: 27, label: D27, wokwi: D27, caps: [digital, pwm, adc, adc2, touch] }
    - { gpio: 32, label: D32, wokwi: D32, caps: [digital, pwm, adc, adc1, touch] }
    - { gpio: 33, label: D33, wokwi: D33, caps: [digital, pwm, adc, adc1, touch] }
    - { gpio: 34, label: D34, wokwi: D34, caps: [digital, adc, adc1], input_only: true }
    - { gpio: 35, label: D35, wokwi: D35, caps: [digital, adc, adc1], input_only: true }
    - { gpio: 36, label: VP,  wokwi: VP,  caps: [digital, adc, adc1], input_only: true }
    - { gpio: 39, label: VN,  wokwi: VN,  caps: [digital, adc, adc1], input_only: true }
    - { gpio: 1,  label: TX0, wokwi: TX0, caps: [digital], reserved: true, note: "USB série (programmation)" }
    - { gpio: 3,  label: RX0, wokwi: RX0, caps: [digital], reserved: true, note: "USB série (programmation)" }

