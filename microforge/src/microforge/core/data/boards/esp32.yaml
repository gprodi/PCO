- id: esp32-cam
  name: ESP32-CAM (AI-Thinker, caméra OV2640 + carte microSD)
  family: esp32
  mcu: ESP32 (Xtensa LX6 double cœur 240 MHz) + PSRAM 4 Mo
  aliases: [esp32 cam, esp32-cam, ai thinker esp32 cam, esp32cam]
  logic_v: 3.3
  five_v_tolerant: false
  rails: { "3V3": 3.3, "5V": 5.0 }
  rail_budget_ma: { "3V3": 200, "5V": 500 }
  gpio_max_ma: 12
  wifi: true
  bluetooth: true
  adc2_wifi_conflict: true
  fqbn: esp32:esp32:esp32cam
  platformio_board: esp32cam
  default_i2c: { sda: 14, scl: 15 }
  preferred_order: [13, 12, 2, 4, 14, 15]
  wokwi:
    type: board-esp32-cam
    gnd: GND.1
    rails: { "3V3": "3V3", "5V": "5V.1" }
  price_eur: 9.0
  source: "https://docs.ai-thinker.com/en/esp32-cam"
  notes:
    - "Très peu de broches libres : la caméra en occupe la plupart. GPIO 2, 4, 12, 13, 14, 15 servent aussi au lecteur microSD."
    - "GPIO 4 pilote la LED flash blanche ; GPIO 16 est réservé à la PSRAM."
    - "Pas de port USB : programmation par adaptateur USB-série (ou carte ESP32-CAM-MB), GPIO 0 à la masse pour téléverser."
    - "I2C sur GPIO 14/15 (Wire.begin(14, 15) généré automatiquement)."
  pins:
    - { gpio: 0,  label: IO0,  wokwi: "0",  caps: [digital], strapping: true, reserved: true, note: "à la masse pour programmer" }
    - { gpio: 2,  label: IO2,  wokwi: "2",  caps: [digital, pwm, adc, adc2], strapping: true, note: "microSD DATA0" }
    - { gpio: 4,  label: IO4,  wokwi: "4",  caps: [digital, pwm, adc, adc2], note: "LED flash + microSD DATA1" }
    - { gpio: 12, label: IO12, wokwi: "12", caps: [digital, pwm, adc, adc2], strapping: true, note: "LOW au démarrage ; microSD DATA2" }
    - { gpio: 13, label: IO13, wokwi: "13", caps: [digital, pwm, adc, adc2], note: "microSD DATA3" }
    - { gpio: 14, label: IO14, wokwi: "14", caps: [digital, pwm, adc, adc2, i2c], note: "microSD CLK" }
    - { gpio: 15, label: IO15, wokwi: "15", caps: [digital, pwm, adc, adc2, i2c], strapping: true, note: "microSD CMD" }
    - { gpio: 16, label: IO16, wokwi: "16", caps: [digital], reserved: true, note: "PSRAM" }
    - { gpio: 1,  label: U0TXD, wokwi: TX, caps: [digital, uart], reserved: true, note: "programmation" }
    - { gpio: 3,  label: U0RXD, wokwi: RX, caps: [digital, uart], reserved: true, note: "programmation" }

