    - { gpio: 0,  label: D0, caps: [digital, uart, interrupt], note: "RX Serial1" }
    - { gpio: 1,  label: D1, caps: [digital, uart, interrupt], note: "TX Serial1" }
    - { gpio: 2,  label: D2, caps: [digital, i2c, interrupt], note: "SDA" }
    - { gpio: 3,  label: D3, caps: [digital, pwm, i2c, interrupt], note: "SCL" }
    - { gpio: 4,  label: D4, caps: [digital] }
    - { gpio: 5,  label: D5, caps: [digital, pwm] }
    - { gpio: 6,  label: D6, caps: [digital, pwm] }
    - { gpio: 7,  label: D7, caps: [digital, interrupt] }
    - { gpio: 8,  label: D8, caps: [digital] }
    - { gpio: 9,  label: D9, caps: [digital, pwm] }
    - { gpio: 10, label: D10, caps: [digital, pwm] }
    - { gpio: 11, label: D11, caps: [digital, pwm] }
    - { gpio: 12, label: D12, caps: [digital] }
    - { gpio: 13, label: D13, caps: [digital, pwm], note: "LED intégrée" }
    - { gpio: 14, label: MISO, caps: [digital, spi], note: "connecteur ICSP" }
    - { gpio: 15, label: SCK,  caps: [digital, spi], note: "connecteur ICSP" }
    - { gpio: 16, label: MOSI, caps: [digital, spi], note: "connecteur ICSP" }
    - { gpio: 17, label: SS,   caps: [digital], reserved: true, note: "LED RX, non accessible" }
    - { gpio: 18, label: A0, caps: [digital, adc] }
    - { gpio: 19, label: A1, caps: [digital, adc] }
    - { gpio: 20, label: A2, caps: [digital, adc] }
    - { gpio: 21, label: A3, caps: [digital, adc] }
    - { gpio: 22, label: A4, caps: [digital, adc] }
    - { gpio: 23, label: A5, caps: [digital, adc] }

