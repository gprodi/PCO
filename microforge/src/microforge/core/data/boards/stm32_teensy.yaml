- id: teensy-40
  name: PJRC Teensy 4.0 (i.MX RT1062, 600 MHz)
  family: teensy
  mcu: NXP i.MX RT1062 (Cortex-M7 600 MHz)
  aliases: [teensy 4.0, teensy40, teensy 4]
  code_labels: analog
  logic_v: 3.3
  five_v_tolerant: false
  rails: { "3.3V": 3.3, "VIN": 5.0 }
  rail_budget_ma: { "3.3V": 250 }
  gpio_max_ma: 4
  fqbn: teensy:avr:teensy40
  platformio_board: teensy40
  default_i2c: { sda: 18, scl: 19 }
  default_spi: { mosi: 11, miso: 12, sck: 13, cs: 10 }
  preferred_order: [2, 3, 4, 5, 6, 7, 8, 9, 0, 1, 14, 15, 16, 17, 20, 21, 22, 23, 10, 11, 12, 13, 18, 19]
  price_eur: 30.0
  source: "https://github.com/PaulStoffregen/cores/blob/master/teensy4/pins_arduino.h"
  notes: ["Broches NON tolérantes au 5 V. Courant de sortie faible : LED via transistor ou résistance ≥ 470 Ω."]
  pin_ranges:
    - { from: 2, to: 13, label: "D{n}", caps: [digital, pwm] }
    - { from: 14, to: 17, label: "A{a}", caps: [digital, adc], analog_offset: 14 }
    - { from: 20, to: 21, label: "A{a}", caps: [digital, adc], analog_offset: 14 }
    - { from: 22, to: 23, label: "A{a}", caps: [digital, pwm, adc], analog_offset: 14 }
  pins:
    - { gpio: 0,  label: D0, caps: [digital, pwm, uart], note: "RX1" }
    - { gpio: 1,  label: D1, caps: [digital, pwm, uart], note: "TX1" }
    - { gpio: 18, label: A4, caps: [digital, pwm, adc, i2c], note: "SDA" }
    - { gpio: 19, label: A5, caps: [digital, pwm, adc, i2c], note: "SCL" }

