- id: capacitor-ceramic
  name: Condensateur céramique (multicouche, traversant)
  category: passif
  description: "Découplage 100 nF au plus près de chaque circuit intégré, filtrage, anti-rebond."
  aliases: [condensateur ceramique, condo ceramique, 100nf, mlcc, capacitor ceramic]
  is_module: false
  passive: true
  parametric: { quantity: capacitance, unit: F, series: E6, min: 1.0e-11, max: 1.0e-6, default: 1.0e-7 }
  pins:
    - { name: "1", role: nc }
    - { name: "2", role: nc }
  kicad: { symbol: "Device:C", footprint: "Capacitor_THT:C_Disc_D5.0mm_W2.5mm_P5.00mm" }
  price_eur: 0.08
  supplier_refs: { lcsc: "C400087" }
  notes: ["Code imprimé : « 104 » = 10 × 10⁴ pF = 100 nF ; « 103 » = 10 nF ; « 22 » = 22 pF."]

- id: capacitor-electrolytic
  name: Condensateur électrolytique (aluminium, radial)
  category: passif
