  is_module: false
  passive: true
  parametric: { quantity: capacitance, unit: F, series: E6, min: 1.0e-6, max: 2.2e-3, default: 1.0e-4 }
  pins:
    - { name: "+", role: nc, description: "patte longue" }
    - { name: "-", role: nc, description: "bande « − » sur le boîtier" }
  kicad: { symbol: "Device:C_Polarized", footprint: "Capacitor_THT:CP_Radial_D8.0mm_P3.50mm" }
  price_eur: 0.08
  supplier_refs: { lcsc: "C112510" }
  notes: ["Polarisé : une inversion le fait gonfler ou éclater.", "Tension de service au moins 1,5 × la tension du circuit (16 V pour du 5 V ou du 12 V… 25 V pour 12 V)."]

