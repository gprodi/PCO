- id: max7219-matrix
  name: Matrice 8×8 LED rouges MAX7219
  category: afficheur
  description: "64 LED pilotées par 3 fils : icônes, émoticônes, défilement."
  aliases: [max7219, matrice led, led matrix, 8x8]
  supply_v: [4.5, 5.5]
  current_ma: 100
  peak_ma: 320
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: DIN, role: gpio_out }
    - { name: CS, role: gpio_out }
    - { name: CLK, role: gpio_out }
  code:
    default:
      # Pilote intégré (shiftOut) : aucune bibliothèque, compile sur toutes les familles.
      # (LedControl inclut <avr/pgmspace.h>, absent du cœur ESP32 3.x : trouvé par la CI.)
      globals: "byte ${name}_buf[8] = {0};"
      setup: |
        pinMode(${DIN}, OUTPUT);
        pinMode(${CLK}, OUTPUT);
        pinMode(${CS}, OUTPUT);
        digitalWrite(${CS}, HIGH);
        ${name}_write(0x0F, 0);  // test d'affichage désactivé
        ${name}_write(0x09, 0);  // pas de décodage BCD
        ${name}_write(0x0B, 7);  // 8 lignes balayées
        ${name}_write(0x0A, 4);  // luminosité (0–15)
        ${name}_write(0x0C, 1);  // sortie de veille
        ${name}_clear();
      api: |
        // Écrit un registre du MAX7219 (adresse puis donnée, 16 bits, MSB d'abord).
        void ${name}_write(byte reg, byte data) {
          digitalWrite(${CS}, LOW);
          shiftOut(${DIN}, ${CLK}, MSBFIRST, reg);
          shiftOut(${DIN}, ${CLK}, MSBFIRST, data);
          digitalWrite(${CS}, HIGH);
        }
        // Affiche une image 8×8 (8 octets, un par ligne).
        void ${name}_show(const byte img[8]) { for (int r = 0; r < 8; r++) { ${name}_buf[r] = img[r]; ${name}_write(r + 1, img[r]); } }
        void ${name}_clear() { for (int r = 0; r < 8; r++) { ${name}_buf[r] = 0; ${name}_write(r + 1, 0); } }
        // Barre-graphe : n colonnes allumées (0–8), en partant de la gauche.
        void ${name}_bars(int n) {
          byte v = 0;
          for (int c = 0; c < 8 && c < n; c++) { v |= (0x80 >> c); }
          for (int r = 0; r < 8; r++) { ${name}_buf[r] = v; ${name}_write(r + 1, v); }
        }
  wokwi: { type: wokwi-max7219-matrix, pins: { VCC: V+, GND: GND, DIN: DIN, CS: CS, CLK: CLK } }
  kicad: { symbol: "Connector:Conn_01x05_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical" }
  price_eur: 3.0

