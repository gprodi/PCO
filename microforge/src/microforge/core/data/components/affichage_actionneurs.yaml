- id: l298n-driver
  name: Pont en H L298N (pilote de 2 moteurs CC)
  category: actionneur
  description: Pilote 2 moteurs à courant continu (sens + vitesse PWM) jusqu'à 2 A par voie.
  aliases: [l298n, pont en h, motor driver, driver moteur]
  supply_v: [4.5, 5.5]
  current_ma: 36
  pins:
    - { name: GND, role: ground, description: "masse commune batterie + carte" }
    - { name: ENA, role: pwm, description: "retirer le cavalier ENA" }
    - { name: IN1, role: gpio_out }
    - { name: IN2, role: gpio_out }
    - { name: IN3, role: gpio_out }
    - { name: IN4, role: gpio_out }
    - { name: ENB, role: pwm, description: "retirer le cavalier ENB" }
  code:
    default:
      setup: |
        pinMode(${ENA}, OUTPUT); pinMode(${IN1}, OUTPUT); pinMode(${IN2}, OUTPUT);
        pinMode(${ENB}, OUTPUT); pinMode(${IN3}, OUTPUT); pinMode(${IN4}, OUTPUT);
      api: |
        // vitesse de -255 (arrière) à 255 (avant) pour chaque moteur.
        void ${name}_motors(int gauche, int droite) {
          digitalWrite(${IN1}, gauche >= 0 ? HIGH : LOW); digitalWrite(${IN2}, gauche >= 0 ? LOW : HIGH);
          digitalWrite(${IN3}, droite >= 0 ? HIGH : LOW); digitalWrite(${IN4}, droite >= 0 ? LOW : HIGH);
          analogWrite(${ENA}, constrain(abs(gauche), 0, 255)); analogWrite(${ENB}, constrain(abs(droite), 0, 255));
        }
        void ${name}_stop() { ${name}_motors(0, 0); }
  wokwi: null
  kicad: { symbol: "Driver_Motor:L298N", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x07_P2.54mm_Vertical" }
  price_eur: 4.0
  notes: ["Alimenter les moteurs par la borne 12V (batterie 7–12 V) ; relier la masse de la batterie à celle de la carte.", "Chute de tension ~2 V dans le L298N : un TB6612FNG est plus efficace."]

