# Afficheurs et actionneurs.

- id: ssd1306-i2c
  name: Écran OLED 0,96" SSD1306 128×64 I2C
  category: afficheur
  description: Petit écran monochrome très lisible, 4 fils (I2C).
  aliases: [oled, ssd1306, ecran oled, 0.96 oled]
  supply_v: [3.3, 5.0]
  current_ma: 20
  i2c_addresses: [0x3C, 0x3D]
  pins:
    - { name: GND, role: ground }
    - { name: VCC, role: power }
    - { name: SCL, role: i2c_scl }
    - { name: SDA, role: i2c_sda }
  code:
    default:
      libraries: ["Adafruit SSD1306", "Adafruit GFX Library"]
      includes: ["#include <Wire.h>", "#include <Adafruit_GFX.h>", "#include <Adafruit_SSD1306.h>"]
      globals: "Adafruit_SSD1306 ${name}_dev(128, 64, &Wire, -1);"
      setup_once: ["Wire.begin();"]
      setup: |
        if (!${name}_dev.begin(SSD1306_SWITCHCAPVCC, ${I2C_ADDR})) { Serial.println(F("OLED introuvable")); }
        ${name}_dev.clearDisplay();
        ${name}_dev.setTextColor(SSD1306_WHITE);
        ${name}_dev.display();
      api: |
        // Affiche jusqu'à 3 lignes (taille 1) ; la 1re ligne peut être agrandie (big = true).
        void ${name}_print(const String& l1, const String& l2 = "", const String& l3 = "", bool big = false) {
          ${name}_dev.clearDisplay();
          ${name}_dev.setCursor(0, 0);
          ${name}_dev.setTextSize(big ? 2 : 1);
          ${name}_dev.println(l1);
          ${name}_dev.setTextSize(1);
          ${name}_dev.println(l2);
          ${name}_dev.println(l3);
          ${name}_dev.display();
        }
  wokwi: { type: board-ssd1306, pins: { GND: GND, VCC: VCC, SCL: SCL, SDA: SDA } }
  kicad: { symbol: "Display_Graphic:OLED-128O064D", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 4.0

- id: lcd1602-i2c
  name: Écran LCD 16×2 avec module I2C (PCF8574)
  category: afficheur
  description: Afficheur 2 lignes de 16 caractères rétroéclairé, piloté en I2C.
  aliases: [lcd 1602, lcd16x2, lcd i2c, "1602"]
  supply_v: [4.5, 5.5]
  current_ma: 30
  i2c_addresses: [0x27, 0x3F]
  pins:
    - { name: GND, role: ground }
    - { name: VCC, role: power }
    - { name: SDA, role: i2c_sda, output_v: 5.0 }
    - { name: SCL, role: i2c_scl, output_v: 5.0 }
  code:
    default:
      libraries: ["LiquidCrystal I2C"]
      includes: ["#include <Wire.h>", "#include <LiquidCrystal_I2C.h>"]
      globals: "LiquidCrystal_I2C ${name}_dev(${I2C_ADDR}, 16, 2);"
      setup_once: ["Wire.begin();"]
      setup: |
        ${name}_dev.init();
        ${name}_dev.backlight();
      api: |
        void ${name}_print(const String& l1, const String& l2 = "") {
          ${name}_dev.clear();
          ${name}_dev.setCursor(0, 0); ${name}_dev.print(l1.substring(0, 16));
          ${name}_dev.setCursor(0, 1); ${name}_dev.print(l2.substring(0, 16));
        }
  wokwi: { type: wokwi-lcd1602, attrs: { pins: i2c }, pins: { GND: GND, VCC: VCC, SDA: SDA, SCL: SCL } }
  kicad: { symbol: "Display_Character:LCD-016N002L", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 5.0
  notes: ["Les pull-ups du module PCF8574 tirent SDA/SCL à 5 V : sur ESP32/Pico, utiliser un level shifter I2C."]

