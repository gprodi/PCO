- id: ws2812-ring-12
  name: Anneau de 12 LED RGB adressables WS2812B (NeoPixel)
  category: actionneur
  description: Chaque LED est pilotable individuellement avec un seul fil de données.
  aliases: [neopixel, ws2812, ws2812b, anneau led, led ring]
  supply_v: [4.0, 5.5]
  current_ma: 60
  peak_ma: 720
  pins:
    - { name: VCC, role: power }
    - { name: DIN, role: gpio_out }
    - { name: GND, role: ground }
  code:
    default:
      libraries: ["Adafruit NeoPixel"]
      includes: ["#include <Adafruit_NeoPixel.h>"]
      globals: "Adafruit_NeoPixel ${name}_dev(12, ${DIN}, NEO_GRB + NEO_KHZ800);"
      setup: |
        ${name}_dev.begin();
        ${name}_dev.setBrightness(40);  // limite le courant (et l'éblouissement)
        ${name}_dev.show();
      api: |
        void ${name}_fill(uint8_t r, uint8_t g, uint8_t b) {
          for (uint16_t i = 0; i < ${name}_dev.numPixels(); i++) { ${name}_dev.setPixelColor(i, ${name}_dev.Color(r, g, b)); }
          ${name}_dev.show();
        }
        // Allume n % des LED (jauge) avec une couleur verte -> rouge.
        void ${name}_gauge(int percent) {
          int n = map(constrain(percent, 0, 100), 0, 100, 0, ${name}_dev.numPixels());
          for (uint16_t i = 0; i < ${name}_dev.numPixels(); i++) {
            uint8_t r = map(i, 0, ${name}_dev.numPixels() - 1, 0, 255);
            ${name}_dev.setPixelColor(i, (int)i < n ? ${name}_dev.Color(r, 255 - r, 0) : 0);
          }
          ${name}_dev.show();
        }
        void ${name}_wheel(uint8_t pos) {
          for (uint16_t i = 0; i < ${name}_dev.numPixels(); i++) {
            ${name}_dev.setPixelColor(i, ${name}_dev.ColorHSV((uint16_t)(pos * 256 + i * 65536L / ${name}_dev.numPixels())));
          }
          ${name}_dev.show();
        }
  wokwi: { type: wokwi-led-ring, attrs: { pixels: "12" }, pins: { VCC: VCC, DIN: DIN, GND: GND } }
  kicad: { symbol: "LED:WS2812B", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical" }
  price_eur: 4.0
  notes: ["Ajouter un condensateur 470 µF entre VCC et GND et une résistance 330 Ω sur DIN pour une installation durable."]

