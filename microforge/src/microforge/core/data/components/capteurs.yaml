- id: mpu6050
  name: Accéléromètre + gyroscope MPU-6050 (module GY-521)
  category: capteur
  description: Centrale inertielle 6 axes ; inclinaison, chocs, mouvements.
  aliases: [gy-521, mpu-6050, accelerometre, gyroscope, imu]
  supply_v: [3.3, 5.0]
  current_ma: 4
  i2c_addresses: [0x68, 0x69]
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: SCL, role: i2c_scl }
    - { name: SDA, role: i2c_sda }
  code:
    default:
      libraries: ["Adafruit MPU6050", "Adafruit Unified Sensor"]
      includes: ["#include <Wire.h>", "#include <Adafruit_MPU6050.h>"]
      globals: "Adafruit_MPU6050 ${name}_dev;"
      setup_once: ["Wire.begin();"]
      setup: |
        if (!${name}_dev.begin(0x68) && !${name}_dev.begin(0x69)) { Serial.println(F("MPU6050 introuvable")); }
      api: |
        // Inclinaison (degrés) autour des axes X et Y, calculée à partir de l'accélération.
        float ${name}_tilt_x() {
          sensors_event_t a, g, t; ${name}_dev.getEvent(&a, &g, &t);
          return atan2(a.acceleration.y, a.acceleration.z) * 180.0 / PI;
        }
        float ${name}_tilt_y() {
          sensors_event_t a, g, t; ${name}_dev.getEvent(&a, &g, &t);
          return atan2(-a.acceleration.x, a.acceleration.z) * 180.0 / PI;
        }
  wokwi: { type: wokwi-mpu6050, pins: { VCC: VCC, GND: GND, SCL: SCL, SDA: SDA } }
  kicad: { symbol: "Sensor_Motion:MPU-6050", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x08_P2.54mm_Vertical" }
  price_eur: 3.5

