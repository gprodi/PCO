- id: ttp223-touch
  name: Bouton tactile capacitif TTP223
  category: entree
  description: Une touche sensitive (même à travers une fine plaque de bois ou de plastique).
  aliases: [ttp223, tactile, touch sensor, capteur tactile]
  supply_v: [2.0, 5.5]
  current_ma: 0.01
  pins:
    - { name: VCC, role: power }
    - { name: SIG, role: gpio_in }
    - { name: GND, role: ground }
  code:
    default:
      globals: "bool ${name}_last = LOW;"
      setup: "pinMode(${SIG}, INPUT);"
      api: |
        bool ${name}_touched() { return digitalRead(${SIG}) == HIGH; }
        // Vrai une seule fois à chaque nouveau contact.
        bool ${name}_tapped() {
          bool now = digitalRead(${SIG});
          bool tap = (now == HIGH && ${name}_last == LOW);
          ${name}_last = now;
          return tap;
        }
  wokwi: { type: wokwi-pushbutton, pins: { SIG: "1.l", GND: "2.l" } }
  kicad: { symbol: "Connector:Conn_01x03_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical" }
