- id: ldr-module
  name: Module photorésistance (capteur de lumière)
  category: capteur
  description: Photorésistance + comparateur ; sortie analogique (AO) et numérique (DO).
  aliases: [ldr, photoresistance, capteur lumiere, light sensor]
  supply_v: [3.3, 5.0]
  current_ma: 1
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: DO, role: nc }
    - { name: AO, role: adc }
  code:
    default:
      api: |
        // 0 % = obscurité, 100 % = pleine lumière (AO baisse quand la lumière augmente).
        int ${name}_light_percent() { return 100 - map(analogRead(${AO}), 0, MF_ADC_MAX, 0, 100); }
  wokwi: { type: wokwi-photoresistor-sensor, pins: { VCC: VCC, GND: GND, DO: DO, AO: AO } }
  kicad: { symbol: "Connector:Conn_01x04_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 1.5

- id: soil-moisture-capacitive
  name: Capteur d'humidité du sol capacitif v1.2
  category: capteur
  description: Mesure l'humidité de la terre sans électrode corrodable ; sortie analogique.
  aliases: [soil moisture, humidite sol, capteur sol]
  supply_v: [3.3, 5.5]
  current_ma: 5
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: AOUT, role: adc }
  code:
    default:
      globals: |
        // Calibrer : valeur brute capteur à l'air (sec) et dans un verre d'eau (humide).
        int ${name}_sec = MF_ADC_MAX * 3 / 4;
        int ${name}_humide = MF_ADC_MAX / 3;
      api: |
        int ${name}_raw() { return analogRead(${AOUT}); }
        int ${name}_percent() {
          return constrain(map(analogRead(${AOUT}), ${name}_sec, ${name}_humide, 0, 100), 0, 100);
        }
  wokwi: null
  kicad: { symbol: "Connector:Conn_01x03_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical" }
  price_eur: 2.5
  notes: ["Dans Wokwi, simuler le capteur avec un potentiomètre."]

