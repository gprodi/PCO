- id: hc-sr04
  name: Capteur de distance à ultrasons HC-SR04
  category: capteur
  description: Mesure 2–400 cm par temps de vol d'un écho ultrason.
  aliases: [hcsr04, ultrason, capteur distance, ultrasonic]
  supply_v: [4.5, 5.5]
  current_ma: 15
  pins:
    - { name: VCC, role: power }
    - { name: TRIG, role: gpio_out }
    - { name: ECHO, role: gpio_in, output_v: 5.0, description: "impulsion 5 V !" }
    - { name: GND, role: ground }
  code:
    default:
      includes: []
      setup: |
        pinMode(${TRIG}, OUTPUT);
        pinMode(${ECHO}, INPUT);
      api: |
        // Distance en cm, -1 si aucun écho (obstacle trop loin).
        float ${name}_distance_cm() {
          digitalWrite(${TRIG}, LOW); delayMicroseconds(2);
          digitalWrite(${TRIG}, HIGH); delayMicroseconds(10);
          digitalWrite(${TRIG}, LOW);
          unsigned long duree = pulseIn(${ECHO}, HIGH, 30000UL);
          return duree == 0 ? -1.0f : duree * 0.0343f / 2.0f;
        }
  wokwi: { type: wokwi-hc-sr04, pins: { VCC: VCC, TRIG: TRIG, ECHO: ECHO, GND: GND } }
  kicad: { symbol: "Connector:Conn_01x04_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 2.5
  notes: ["Sur une carte 3,3 V, ECHO doit passer par un pont diviseur (1 kΩ / 2 kΩ)."]

