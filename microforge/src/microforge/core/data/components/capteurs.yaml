- id: ir-receiver
  name: Récepteur infrarouge VS1838B (télécommande)
  category: communication
  description: Reçoit les codes de n'importe quelle télécommande TV.
  aliases: [ir, infrarouge, vs1838b, telecommande, ir receiver]
  supply_v: [2.7, 5.5]
  current_ma: 1.5
  pins:
    - { name: OUT, role: gpio_in }
    - { name: GND, role: ground }
    - { name: VCC, role: power }
  code:
    default:
      libraries: ["IRremote"]
      includes: ["#include <IRremote.hpp>"]
      setup: "IrReceiver.begin(${OUT}, false);"
      api: |
        // Code de la touche pressée, 0 si rien de nouveau — affiché sur le moniteur série pour l'apprendre.
        // Les trames de répétition (touche maintenue) et le bruit (protocole inconnu) sont ignorés.
        uint16_t ${name}_command() {
          if (!IrReceiver.decode()) { return 0; }
          bool valide = IrReceiver.decodedIRData.protocol != UNKNOWN
                        && !(IrReceiver.decodedIRData.flags & IRDATA_FLAGS_IS_REPEAT);
          uint16_t cmd = IrReceiver.decodedIRData.command;
          IrReceiver.resume();
          return valide ? cmd + 1 : 0;  // +1 : la touche de code 0 reste détectable
        }
  wokwi: { type: wokwi-ir-receiver, pins: { OUT: DAT, GND: GND, VCC: VCC } }
  kicad: { symbol: "Interface_Optical:TSOP382xx", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical" }
  price_eur: 1.0

