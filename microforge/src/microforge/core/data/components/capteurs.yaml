- id: ds18b20
  name: Sonde de température étanche DS18B20 (1-Wire)
  category: capteur
  description: Sonde inox -55…125 °C, précision ±0,5 °C, bus 1-Wire (plusieurs sondes sur un fil).
  aliases: [ds18b20 probe, sonde temperature, onewire]
  supply_v: [3.0, 5.5]
  current_ma: 1.5
  is_module: false
  pins:
    - { name: VCC, role: power, description: "fil rouge" }
    - { name: DQ, role: gpio_io, pullup_ohm: 4700, description: "fil jaune — pull-up 4,7 kΩ vers VCC obligatoire" }
    - { name: GND, role: ground, description: "fil noir" }
  code:
    default:
      libraries: ["OneWire", "DallasTemperature"]
      includes: ["#include <OneWire.h>", "#include <DallasTemperature.h>"]
      globals: |
        OneWire ${name}_bus(${DQ});
        DallasTemperature ${name}_dev(&${name}_bus);
      setup: "${name}_dev.begin();"
      api: |
        float ${name}_temperature() { ${name}_dev.requestTemperatures(); return ${name}_dev.getTempCByIndex(0); }
  wokwi: { type: board-ds18b20, pins: { VCC: VCC, DQ: DQ, GND: GND } }
  kicad: { symbol: "Sensor_Temperature:DS18B20", footprint: "Package_TO_SOT_THT:TO-92_Inline" }
  price_eur: 3.0

- id: bme280
  name: Capteur BME280 (température, humidité, pression) I2C
  category: capteur
  description: Station météo miniature, très précis ; module GY-BME280 alimenté en 3,3 V.
  aliases: [gy-bme280, bme 280, capteur pression]
  supply_v: [1.8, 3.6]
  preferred_supply_v: 3.3
  current_ma: 0.7
  i2c_addresses: [0x76, 0x77]
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: SCL, role: i2c_scl }
    - { name: SDA, role: i2c_sda }
  code:
    default:
      libraries: ["Adafruit BME280 Library", "Adafruit Unified Sensor"]
      includes: ["#include <Wire.h>", "#include <Adafruit_BME280.h>"]
      globals: "Adafruit_BME280 ${name}_dev;"
      setup_once: ["Wire.begin();"]
      setup: |
        if (!${name}_dev.begin(0x76) && !${name}_dev.begin(0x77)) { Serial.println(F("BME280 introuvable")); }
      api: |
        float ${name}_temperature() { return ${name}_dev.readTemperature(); }
        float ${name}_humidity() { return ${name}_dev.readHumidity(); }
        float ${name}_pressure_hpa() { return ${name}_dev.readPressure() / 100.0F; }
        float ${name}_altitude_m() { return ${name}_dev.readAltitude(1013.25F); }
  wokwi: null
  kicad: { symbol: "Sensor:BME280", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 6.0
  notes: ["Le module GY-BME280 « 3.3V » n'a pas de régulateur : ne JAMAIS l'alimenter en 5 V."]

- id: hc-sr04
  name: Capteur de distance à ultrasons HC-SR04
  category: capteur
  description: Mesure 2–400 cm par temps de vol d'un écho ultrason.
  aliases: [hcsr04, ultrason, capteur distance, ultrasonic]
  supply_v: [4.5, 5.5]
  current_ma: 15
  pins:
    - { name: VCC, role: power }
    - { name: TRIG, role: gpio_out }
    - { name: ECHO, role: gpio_in, output_v: 5.0, description: "impulsion 5 V !" }
    - { name: GND, role: ground }
  code:
    default:
      includes: []
      setup: |
        pinMode(${TRIG}, OUTPUT);
        pinMode(${ECHO}, INPUT);
      api: |
        // Distance en cm, -1 si aucun écho (obstacle trop loin).
        float ${name}_distance_cm() {
          digitalWrite(${TRIG}, LOW); delayMicroseconds(2);
          digitalWrite(${TRIG}, HIGH); delayMicroseconds(10);
          digitalWrite(${TRIG}, LOW);
          unsigned long duree = pulseIn(${ECHO}, HIGH, 30000UL);
          return duree == 0 ? -1.0f : duree * 0.0343f / 2.0f;
        }
  wokwi: { type: wokwi-hc-sr04, pins: { VCC: VCC, TRIG: TRIG, ECHO: ECHO, GND: GND } }
  kicad: { symbol: "Connector:Conn_01x04_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 2.5
  notes: ["Sur une carte 3,3 V, ECHO doit passer par un pont diviseur (1 kΩ / 2 kΩ)."]

