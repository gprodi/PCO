- id: mpu6050
  name: Accéléromètre + gyroscope MPU-6050 (module GY-521)
  category: capteur
  description: Centrale inertielle 6 axes ; inclinaison, chocs, mouvements.
  aliases: [gy-521, mpu-6050, accelerometre, gyroscope, imu]
  supply_v: [3.3, 5.0]
  current_ma: 4
  i2c_addresses: [0x68, 0x69]
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: SCL, role: i2c_scl }
    - { name: SDA, role: i2c_sda }
  code:
    default:
      libraries: ["Adafruit MPU6050", "Adafruit Unified Sensor"]
      includes: ["#include <Wire.h>", "#include <Adafruit_MPU6050.h>"]
      globals: "Adafruit_MPU6050 ${name}_dev;"
      setup_once: ["Wire.begin();"]
      setup: |
        if (!${name}_dev.begin(0x68) && !${name}_dev.begin(0x69)) { Serial.println(F("MPU6050 introuvable")); }
      api: |
        // Inclinaison (degrés) autour des axes X et Y, calculée à partir de l'accélération.
        float ${name}_tilt_x() {
          sensors_event_t a, g, t; ${name}_dev.getEvent(&a, &g, &t);
          return atan2(a.acceleration.y, a.acceleration.z) * 180.0 / PI;
        }
        float ${name}_tilt_y() {
          sensors_event_t a, g, t; ${name}_dev.getEvent(&a, &g, &t);
          return atan2(-a.acceleration.x, a.acceleration.z) * 180.0 / PI;
        }
  wokwi: { type: wokwi-mpu6050, pins: { VCC: VCC, GND: GND, SCL: SCL, SDA: SDA } }
  kicad: { symbol: "Sensor_Motion:MPU-6050", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x08_P2.54mm_Vertical" }
  price_eur: 3.5

- id: ds3231-rtc
  name: Horloge temps réel DS3231 (module + pile CR2032)
  category: capteur
  description: Horloge très précise (±2 ppm) qui garde l'heure hors tension.
  aliases: [ds3231, rtc, horloge, real time clock]
  supply_v: [2.3, 5.5]
  current_ma: 0.2
  i2c_addresses: [0x68]
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: SDA, role: i2c_sda }
    - { name: SCL, role: i2c_scl }
  code:
    default:
      libraries: ["RTClib"]
      includes: ["#include <Wire.h>", "#include <RTClib.h>"]
      globals: "RTC_DS3231 ${name}_dev;"
      setup_once: ["Wire.begin();"]
      setup: |
        if (!${name}_dev.begin()) { Serial.println(F("DS3231 introuvable")); }
        if (${name}_dev.lostPower()) { ${name}_dev.adjust(DateTime(F(__DATE__), F(__TIME__))); }
      api: |
        String ${name}_time() { char b[] = "hh:mm:ss"; return String(${name}_dev.now().toString(b)); }
        String ${name}_date() { char b[] = "DD/MM/YYYY"; return String(${name}_dev.now().toString(b)); }
  wokwi: null
  kicad: { symbol: "Timer_RTC:DS3231M", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical" }
  price_eur: 3.0
  notes: ["Adresse 0x68 identique au MPU-6050 : relier AD0 du MPU au 3,3 V (adresse 0x69) si les deux sont présents."]

- id: hx711-load-cell
  name: Amplificateur HX711 + capteur de force (cellule de charge 5 kg)
  category: capteur
  description: Pesée de précision avec une cellule de charge et le convertisseur 24 bits HX711.
  aliases: [hx711, balance, load cell, cellule de charge]
  supply_v: [2.7, 5.5]
  current_ma: 1.5
  pins:
    - { name: VCC, role: power }
    - { name: GND, role: ground }
    - { name: DT, role: gpio_in }
    - { name: SCK, role: gpio_out }
  code:
    default:
      libraries: ["HX711"]
      includes: ["#include <HX711.h>"]
      globals: |
        HX711 ${name}_dev;
        float ${name}_calibration = 420.0f;  // à ajuster avec une masse connue
      setup: |
        ${name}_dev.begin(${DT}, ${SCK});
        ${name}_dev.set_scale(${name}_calibration);
        ${name}_dev.tare();
      api: |
        float ${name}_grams() { return ${name}_dev.is_ready() ? ${name}_dev.get_units(5) : NAN; }
        void ${name}_tare() { ${name}_dev.tare(); }
  wokwi: { type: wokwi-hx711, pins: { VCC: VCC, GND: GND, DT: DT, SCK: SCK } }
  kicad: { symbol: "Connector:Conn_01x04_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 4.0
