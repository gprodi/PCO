- id: ky038-sound
  name: Capteur de son (micro KY-038)
  category: capteur
  description: Détecte un claquement de mains ou mesure le niveau sonore.
  aliases: [ky-038, micro, microphone, capteur son, sound sensor]
  supply_v: [3.3, 5.0]
  current_ma: 4
  pins:
    - { name: AO, role: adc }
    - { name: GND, role: ground }
    - { name: VCC, role: power }
    - { name: DO, role: gpio_in }
  code:
    default:
      globals: "const bool ${name}_DO_ACTIF_BAS = false;  // selon le fabricant : mettre true si la LED DO s'allume sans réaction"
      setup: "pinMode(${DO}, INPUT);"
      api: |
        // Seuil réglé par le potentiomètre bleu du module.
        bool ${name}_loud() { return digitalRead(${DO}) == (${name}_DO_ACTIF_BAS ? LOW : HIGH); }
        int ${name}_level() {
          int lo = MF_ADC_MAX, hi = 0;
          for (int i = 0; i < 50; i++) { int v = analogRead(${AO}); lo = min(lo, v); hi = max(hi, v); }
          // Le signal du KY-038 est faible (quelques dizaines de points) : 1/8 de la pleine échelle = 100 %.
          return constrain(map(hi - lo, 0, MF_ADC_MAX / 8, 0, 100), 0, 100);
        }
  wokwi: null
  kicad: { symbol: "Connector:Conn_01x04_Pin", footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical" }
  price_eur: 1.5
  notes: ["Régler le potentiomètre pour que la LED « DO » s'allume juste au-dessus du bruit ambiant.", "C'est un détecteur de seuil, pas un reconnaisseur de clap : un bruit fort (porte, voix) peut aussi déclencher.", "La polarité de la sortie DO varie selon les fabricants : constante <nom>_DO_ACTIF_BAS en tête du code."]

