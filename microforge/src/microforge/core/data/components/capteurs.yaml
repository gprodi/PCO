# Capteurs. Placeholders du code : ${name} = nom d'instance, ${BROCHE} = constante de broche générée.
# MF_ADC_MAX est défini dans mf_components.h selon la carte (1023 AVR/RP2040, 4095 ESP32).

- id: dht22
  name: Capteur température/humidité DHT22 (module 3 broches)
  category: capteur
  description: Température -40…80 °C (±0,5 °C) et humidité 0–100 % (±2 %), 1 mesure toutes les 2 s.
  aliases: [am2302, dht-22, dht 22, capteur humidite]
  supply_v: [3.3, 5.5]
  current_ma: 1.5
  pins:
    - { name: VCC, role: power }
    - { name: DATA, role: gpio_io, description: "bus 1 fil propriétaire (pull-up 10 kΩ intégré au module)" }
    - { name: GND, role: ground }
  code:
    default:
      libraries: ["DHT sensor library", "Adafruit Unified Sensor"]
      includes: ["#include <DHT.h>"]
      globals: "DHT ${name}_dev(${DATA}, DHT22);"
      setup: "${name}_dev.begin();"
      api: |
        // Renvoie NAN si la lecture échoue (vérifier avec isnan()).
        float ${name}_temperature() { return ${name}_dev.readTemperature(); }
        float ${name}_humidity() { return ${name}_dev.readHumidity(); }
  wokwi: { type: wokwi-dht22, pins: { VCC: VCC, DATA: SDA, GND: GND } }
  kicad: { symbol: "Sensor:DHT11", footprint: "Sensor:Aosong_DHT11_5.5x12.0_P2.54mm" }
  price_eur: 4.5
  notes: ["Respecter 2 s minimum entre deux lectures.", "Le capteur nu (4 broches) nécessite une pull-up 10 kΩ sur DATA."]

