- id: shift-register-74hc595
  name: Registre à décalage 74HC595 (8 sorties, DIP-16)
  category: ci
  description: "Ajoute 8 sorties (LED, afficheur 7 segments) avec 3 broches seulement ; chaînable."
  aliases: [74hc595, hc595, "595", registre a decalage]
  is_module: false
  supply_v: [2.0, 6.0]
  current_ma: 1
  pins:
    - { name: DS, role: gpio_out, description: "données série (broche 14)" }
    - { name: SHCP, role: gpio_out, description: "horloge de décalage (broche 11)" }
    - { name: STCP, role: gpio_out, description: "verrou / latch (broche 12)" }
    - { name: VCC, role: power }
    - { name: GND, role: ground }
  code:
    default:
      setup: "pinMode(${DS}, OUTPUT); pinMode(${SHCP}, OUTPUT); pinMode(${STCP}, OUTPUT);"
      api: |
        // Écrit 8 bits sur Q0..Q7 (Q7 = bit de poids fort) ; OE à la masse, MR au +.
        void ${name}_write(uint8_t bits) {
          digitalWrite(${STCP}, LOW);
          shiftOut(${DS}, ${SHCP}, MSBFIRST, bits);
          digitalWrite(${STCP}, HIGH);
        }
  wokwi: { type: wokwi-74hc595, pins: { DS: DS, SHCP: SHCP, STCP: STCP, VCC: VCC, GND: GND } }
  kicad: { symbol: "74xx:74HC595", footprint: "Package_DIP:DIP-16_W7.62mm" }
  price_eur: 0.12
  supplier_refs: { lcsc: "C507175" }
  notes: ["OE (broche 13) à la masse et MR (broche 10) au +, sinon les sorties restent éteintes.", "Une résistance par LED sur les sorties Q0..Q7."]

- id: shift-register-74hc165
  name: Registre à décalage 74HC165 (8 entrées, DIP-16)
  category: ci
  description: "Lit 8 boutons ou interrupteurs avec 3 broches ; chaînable."
  aliases: [74hc165, hc165, "165"]
  is_module: false
  supply_v: [2.0, 6.0]
  current_ma: 1
  pins:
    - { name: PL, role: gpio_out, description: "chargement parallèle (broche 1, actif bas)" }
    - { name: CP, role: gpio_out, description: "horloge (broche 2)" }
    - { name: Q7, role: gpio_in, description: "sortie série (broche 9)" }
    - { name: VCC, role: power }
    - { name: GND, role: ground }
  code:
    default:
      setup: "pinMode(${PL}, OUTPUT); pinMode(${CP}, OUTPUT); pinMode(${Q7}, INPUT); digitalWrite(${PL}, HIGH);"
      api: |
        // Instantané des 8 entrées D0..D7 (CE à la masse ; tirage 10 kΩ sur chaque entrée).
        uint8_t ${name}_read() {
          digitalWrite(${PL}, LOW);
          delayMicroseconds(5);
          digitalWrite(${PL}, HIGH);
          return shiftIn(${Q7}, ${CP}, MSBFIRST);
        }
  kicad: { symbol: "74xx:74HC165", footprint: "Package_DIP:DIP-16_W7.62mm" }
  price_eur: 0.09
  supplier_refs: { lcsc: "C5613" }

