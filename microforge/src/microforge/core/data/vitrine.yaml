# Vitrine : de vrais projets open source construits par des makers avec des microcontrôleurs.
# Objectif : montrer jusqu'où on peut aller, et relier chacun à ce qu'on apprend dans MicroForge.
# Liens vérifiés par recherche web le 02/11/2026.

- nom: WLED
  url: https://kno.wled.ge/
  categorie: Lumière
  carte: ESP32 / ESP8266
  description: "Firmware qui transforme un ESP32 en contrôleur de rubans LED Wi-Fi : plus de 100 effets, appli mobile, synchronisation musicale."
  commencer_par: [guirlande-animee, lampe-ambiance-neopixel, vu-metre-lumineux]

- nom: ESPHome + Home Assistant
  url: https://esphome.io/
  categorie: Domotique
  carte: ESP32 / ESP8266 / RP2040
  description: "On décrit ses capteurs dans un fichier YAML et ils apparaissent dans Home Assistant, la box domotique libre la plus utilisée."
  commencer_par: [station-meteo-web, thermostat-relais, lampe-tactile]

