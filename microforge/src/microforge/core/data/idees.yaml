      - { titre: "Alerte inondation sur téléphone", difficulte: 3, wifi: true, composants: [water-level-sensor, buzzer], description: "Sirène locale + notification sur le réseau Wi-Fi." }

  - id: cuisine
    titre: Cuisine
    icone: "🍳"
    description: Peser, minuter, surveiller la cuisson.
    idees:
