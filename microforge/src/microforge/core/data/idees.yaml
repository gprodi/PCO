      - { titre: "Boîte aux lettres connectée", difficulte: 2, wifi: true, composants: [reed-switch, ssd1306-i2c], description: "Le contact de la trappe signale le passage du facteur." }
      - { titre: "Tableau de bord des pièces", difficulte: 3, wifi: true, composants: [dht22, bme280], description: "Plusieurs capteurs, une page web récapitulative." }
