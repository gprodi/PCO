    description: "Noël, Halloween, anniversaires : des montages qui font de l'effet."
    idees:
      - { titre: "Guirlande animée", template: guirlande-animee, difficulte: 1, composants: [ws2812-ring-12, pushbutton], description: "Arc-en-ciel, Noël rouge/vert ou blanc chaud." }
      - { titre: "Citrouille d'Halloween qui crie", difficulte: 1, composants: [pir-hc-sr501, buzzer, led], description: "Les yeux s'allument et un cri retentit quand on passe." }
      - { titre: "Calendrier de l'Avent lumineux", difficulte: 2, composants: [ds3231-rtc, ws2812-ring-12], description: "Une LED de plus chaque jour de décembre." }
