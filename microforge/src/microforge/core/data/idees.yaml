      - { titre: "Texte défilant sur matrice", difficulte: 2, composants: [max7219-matrix], description: "Un message qui défile (prénom, citation du jour)." }
      - { titre: "Lampe qui suit la couleur du ciel", difficulte: 2, composants: [ldr-module, ws2812-ring-12], description: "Plus chaude le soir, plus froide en journée." }
      - { titre: "Sculpture qui s'éveille quand on approche", difficulte: 2, composants: [hc-sr04, ws2812-ring-12, sg90-servo], description: "Lumière et mouvement quand un visiteur s'approche." }

  - id: fetes
    titre: Fêtes & déco
