      - { titre: "Veilleuse RGB à modes", template: veilleuse-rgb, difficulte: 1, composants: [rgb-led, pushbutton], description: "Chaque appui change la couleur." }
      - { titre: "Lampe qui respire", difficulte: 1, composants: [ws2812-ring-12], description: "Une lueur qui monte et descend doucement, pour se détendre." }
