  Annexes:
    - "User stories : US1 à US11 avec critères d'acceptation RGAA (docs/E4/user-stories.md) ; chaque US est une issue GitHub au format .github/ISSUE_TEMPLATE/user-story.md."
    - "| Workflow | Déclencheurs | Jobs (dans l'ordre) |\n|---|---|---|\n| ci.yml | push, pull_request, manuel | python (3.12 et 3.13 : ruff, pytest, porte de couverture 80 %) ; e2e (parcours Playwright Streamlit et PWA) ; pwa (Vitest, construction Vite) ; pgvector (tests RAG et mesure des index sur PostgreSQL) ; firmware-matrix (matrice des cartes tirée du catalogue) puis firmware (16 compilations réelles arduino-cli : tous les modèles compatibles et un croquis de fumée par carte) ; monitoring (promtool, amtool, démarrage de la supervision) ; pile (profils core et monitoring construits et lancés, verifier_pile.py, parcours PWA) ; secrets (gitleaks) |\n| cd.yml | push, manuel | images (4 images : api_data, api_ia, streamlit, pwa ; Docker Buildx, connexion GHCR, métadonnées, build et push) puis smoke (démarrage de la pile et tests de fumée) puis release (release-please : changelog et version) |"
    - "Dernière CI complète relue : run 116 (commit 32ab84d, 06/11/2026), 25 jobs verts : Python 3.12 et 3.13, parcours de bout en bout, PWA, pgvector, supervision, pile complète (20 contrôles sur 20, alerte de force brute reçue en 55 s), gitleaks, matrice des cartes et 16 compilations de firmwares."
