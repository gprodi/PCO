# Contenu du rapport E4 (C14 à C19) injecté dans referentiel/modeles/E4_template.docx.
titre: "MicroForge — conception et développement de l'application"
annexe_titre: "Annexe 1 : user stories complètes et fichiers de configuration CI/CD"

sections:
  Introduction:
    - "MicroForge s'adresse aux makers débutants, aux fablabs et aux étudiants en électronique : à partir de leur stock de composants, l'application propose des projets réalisables (145 modèles générables, un par idée, en 17 thèmes) et génère tout ce qu'il faut pour les construire. Ce dossier couvre l'analyse du besoin, le cadre technique, la conduite agile, le développement et les chaînes d'intégration et de livraison continues."

  # ------------------------------------------------------------------ C14
  Modéliser les données de l’application:
    - "Modèle Merise partagé avec le service de données (dossier E1) : utilisateur, inventaire, photo, retour de détection, projet, composant, offre. Côté métier, le catalogue décrit chaque composant (broches, rôles électriques, tensions, code Arduino, rendu Wokwi, symbole KiCad) dans des fichiers YAML versionnés."
  Modéliser les parcours utilisateurs:
    - "- Découvrir : parcours de progression en 7 étapes (de la première LED au robot autonome) et vitrine de vrais projets open source ;\n- Inventaire : photo → détection → correction → stock ;\n- Explorer : thème → idée → projet généré (câblage, code, guide) ;\n- Je veux construire X : description libre → projet + liste d'achat ;\n- Compte : export et suppression des données."
    - "Pas de maquette Penpot séparée : l'interface a été prototypée directement dans la démo en ligne, puis reprise dans l'application Streamlit et dans la PWA. Écrans réels du 04/11/2026 :"
    - "![Accueil de la démo : parcours, chiffres clés et montage d'exemple animé](E4/img/ecran-decouvrir.png)"
    - "![Explorer par thème : idées de projets et jauge des projets réalisables avec le stock](E4/img/ecran-explorer.png)"
    - "![Projet : contrôle électrique et tableau de câblage, fils Dupont en couleur](E4/img/ecran-projet-cablage.png)"
    - "![Atelier virtuel : composants branchés, capteur réglable et écran OLED simulé](E4/img/ecran-atelier.png)"
    - "![Application Streamlit : connexion et création de compte, thème MicroForge](E4/img/ecran-streamlit-accueil.png)"
    - "![PWA au format téléphone, captures du parcours de bout en bout : accueil avec l'établi animé, explorer par thème, projet généré (câblage aux couleurs des fils Dupont)](E4/img/ecran-pwa-telephone.png)"
    - "![PWA, page Projet (capture du parcours de bout en bout du 06/11/2026) : les 9 onglets de la démo, choix de la carte, archive .zip ; l'atelier virtuel tourne dans un cadre isolé (projet branché, écran OLED et moniteur série simulés)](E4/img/ecran-pwa-atelier.png)"
  Rédiger les spécifications fonctionnelles sous forme de user stories:
    - "| # | En tant que… je veux… afin de… | Critères d'acceptation (dont RGAA) |\n|---|---|---|\n| US1 | maker, photographier mon stock pour obtenir l'inventaire | composants courants reconnus ; résultat aussi sous forme de liste texte (1.1) |\n| US2 | maker, corriger une détection | tableau éditable au clavier (7.1, 12.8) ; libellés explicites (11.1) |\n| US3 | maker, voir les projets réalisables avec mon stock | statut en texte et icône, jamais par la seule couleur (3.1) |\n| US4 | maker, obtenir câblage, code et guide | tableau avec en-têtes (5.6) ; SVG avec titre et description (1.1) ; code compilable |\n| US5 | maker, décrire un projet en langage naturel | composants issus du catalogue ; mention « généré par IA » |\n| US6 | maker, connaître la liste d'achat et son coût | total TTC ; liens explicites (6.1) |\n| US8 | maker, saisir mes résistances et condensateurs par valeur ou ajouter un assortiment en un clic | sélecteur de catégorie et de valeur au clavier, saisie libre « 4k7 » normalisée, lots E12/E6/semi-conducteurs/fils Dupont/kit débutant ; le câblage généré utilise les valeurs que je possède |\n| US7 | maker, poser une question sur un composant ou une carte | réponse citée [n] avec ses sources consultables ; « je ne sais pas » plutôt qu'une invention ; mention « généré par IA » |\n| US10 | utilisateur, exporter ou supprimer mes données | export JSON ; suppression confirmée |"
    - "Liste complète et scénarios Gherkin : docs/E4/user-stories.md."
  Définir les objectifs techniques d’accessibilité des interfaces:
    - "Cible RGAA 4.1 niveau AA : navigation complète au clavier, contrastes ≥ 4,5:1, alternatives textuelles des schémas, aucune information portée par la seule couleur, formulaires étiquetés, tests automatisés avec axe."

  # ------------------------------------------------------------------ C15
  Concevoir l’architecture de l’application:
    - "Architecture en micro-services : application (PWA React + Vite pour les utilisateurs, Streamlit en preuve de concept) → api_data (comptes, inventaire, catalogue, projets) et api_ia (vision, génération) → PostgreSQL, stockage objet, passerelle LLM (Ollama local, repli Gemini gratuit), base vectorielle pgvector (copilote), MLflow. Le cœur métier (allocateur de broches, contrôle électrique, génération du firmware et des sorties) est une bibliothèque Python pure, testée indépendamment."
    - "Diagrammes C4 tracés à partir des services réels de infra/docker-compose.yml (source Mermaid dans docs/E4/architecture.md). En pointillés : la cible pas encore en place, Traefik en reverse proxy avec TLS (configuré et testé, pas encore déployé sur un serveur)."
    - "![C4 niveau 1, contexte : le maker, MicroForge et les systèmes externes](E4/img/c4-contexte.png)"
    - "![C4 niveau 2, conteneurs : services par profil docker compose](E4/img/c4-conteneurs.png)"
  Choisir les langages de programmation et les outils de développement:
    - "| Besoin | Choix | Alternative écartée |\n|---|---|---|\n| Back-end | Python 3.12 + FastAPI | Node.js |\n| Front | PWA React 19 + Vite 8 (caméra, hors ligne, installable) ; Streamlit pour la preuve de concept | Flutter |\n| Base | PostgreSQL + pgvector | MongoDB |\n| IA | Ollama local + LiteLLM | API cloud seules |\n| Qualité | uv, ruff, pytest, hypothesis, Vitest, Playwright, axe-core | — |"
  Identifier les flux de données et les zones de stockage:
    - "Photo (navigateur) → api_ia (EXIF supprimé, traitée en mémoire) → détections → api_data (inventaire en base). Projets générés stockés en base ; photos conservées seulement avec consentement (stockage objet, 30 jours sinon). Journaux sans donnée personnelle (identifiant haché)."
  Choisir les services externes complémentaires:
    - "Wokwi (simulation, par export de fichiers), API fournisseurs (prix), Gemini (offre gratuite) en secours ; hébergement de préproduction chez un hébergeur européen engagé (Scaleway, OVHcloud ou Infomaniak)."
  Rédiger les spécifications techniques:
    - "docs/E4/architecture.md et docs/E4/modelisation.md."

  # ------------------------------------------------------------------ C16
  Mettre en place les outils et supports de pilotage de la production:
    - "GitHub Projects : backlog, tableau kanban, itérations de deux semaines, graphique d'avancement ; issues avec modèles (user story, bug, incident)."
  Faciliter les rituels agiles et le respect du cadre:
    - "Scrum adapté à un développeur seul : planification en début de sprint, point quotidien écrit, revue avec démonstration au formateur, rétrospective (docs/E4/agile.md)."
  Communiquer l’avancement des productions techniques:
    - "Compte rendu de revue à chaque sprint, démonstration en ligne (page de démo publiée), notes de version."
    - "Sprint S0 en cours (02/11 → 15/11/2026) : journal quotidien reconstitué à partir de l'historique Git, des runs de CI et des incidents (docs/E4/sprints/journal.md), compte rendu intermédiaire (docs/E4/sprints/S0.md) ; revue et démonstration le vendredi 13/11."
    - "| Jour | Commits | Livré | Problèmes traités |\n|---|---|---|---|\n| 02/11 | 28 | monorepo et CI, cœur déterministe, deux API, pipeline E1, preuve de concept, 40 cartes, site de révision | incidents 1 à 4 (CI, page Explorer, dossier de sketch, macro SPI) |\n| 03/11 | 18 | RAG pgvector et copilote, collecte réelle (100 500 pièces), veille outillée, stock par valeur, atelier virtuel | OneWire refusé par ESP32-C6/H2 : composant exclu de ces puces |\n| 04/11 | 26 | jeux de données et deux entraînements du détecteur, accessibilité, C4, parcours E2E, Traefik, PWA | incidents 5 à 8 (chemin des résultats, gitleaks, polygones, Python 3.12) |\n| 05/11 | — | MCD/MLD vérifiés par un test, mesure des index sur la base réelle | — |"
    - "En avance sur le plan : la collecte réelle, les premiers entraînements, la PWA et Traefik, prévus de S1 à S7, sont livrés dès S0."
    - "[À COMPLÉTER au fil des sprints : comptes rendus S1 à S8]"
  Communiquer les imprévus et les changements:
    - "Journal des risques et des changements. Exemple réel : l'image MinIO n'étant plus publiée, le stockage objet a été remplacé par SeaweedFS (compatible S3) ; Promtail en fin de vie remplacé par Grafana Alloy."

  # ------------------------------------------------------------------ C17
  Installer l'environnement de développement:
    - "```bash\nuv sync --all-packages --group dev --extra data --extra app\ndocker compose -f microforge/infra/docker-compose.yml --profile core up -d\n```"
  Intégrer la mise en page et les contenus des interfaces:
    - "Pages Streamlit : Accueil, Explorer par thème (parcours, vitrine, 17 thèmes), Inventaire photo, Mon stock, Idées de projets, Générer un projet, Mon compte."
    - "PWA (microforge/pwa), pensée d'abord pour le téléphone (barre d'onglets en bas) : Connexion, Accueil (établi animé, parcours en 7 étapes, vitrine), Explorer (145 idées en 17 thèmes annotées avec le stock ; les idées sans modèle se conçoivent avec l'IA), Créer (décrire son idée ou choisir un modèle, carte imposée ou choisie, projets enregistrés), Atelier (un projet, une carte, brancher puis simuler), Mon stock (par catégorie), Photo, Projet (câblage aux couleurs des fils Dupont, schéma, code, nomenclature, contrôle électrique, liste d'achat, provenance affichée pour un projet conçu par l'IA), Copilote (conversation avec sources). Même identité que la démo : polices auto-hébergées, jetons de couleur partagés, thème sombre automatique."
  Développer les fonctionnalités front-end:
    - "Capture photo, tableau éditable des détections, onglets des livrables (câblage, schéma SVG, code, guide de soudure, Wokwi, KiCad, nomenclature, fiabilité et sources), téléchargement du projet en zip."
    - "PWA : photo prise directement par l'appareil (capture=\"environment\") et pièces reconnues ajoutées au stock en un geste ; service worker écrit à la main (interface et fichiers mis en cache à l'installation, liste produite à la construction, cache versionné par empreinte ; appels aux API jamais mis en cache) ; bandeau « hors ligne » ; onglets ARIA au clavier ; configuration des adresses d'API lue au lancement (config.js), pour une seule construction en local, en CI et en préproduction."
  Développer les composants métiers:
    - "- allocateur de broches déterministe (bus I2C/SPI partagés, ADC1 seulement si Wi-Fi, broches réservées évitées, résistances et ponts diviseurs ajoutés automatiquement) ;\n- contrôle électrique (niveaux logiques, budget de courant, sécurité moteurs et relais) ;\n- génération du firmware Arduino, du câblage, du guide, du diagramme Wokwi et de la netlist KiCad ;\n- suggestions à partir du stock et génération « je veux construire X » validée par l'allocateur ;\n- compatibilité composant ↔ carte déclarée dans le catalogue (ex. IRremote absent du cœur Arduino Due, OneWire 2.3.8 refusé par l'ESP32-C6) et vérifiée par l'ERC ;\n- copilote RAG : le catalogue découpé en passages, index PostgreSQL + pgvector, réponses citées, « je ne sais pas » sous un seuil.\n- stock par valeur (résistances, condensateurs, zeners, fils) : valeurs normalisées (séries E6/E12/E24, code couleur), résistances de LED, de tirage et de pont choisies parmi celles possédées dans des plages sûres, nomenclature qui estime les fils Dupont ; règles ERC de diode de roue libre, de MOSFET non logique en 3,3 V et de condensateur réservoir des LED adressables.\n- atelier virtuel : la logique C++ de chaque projet est analysée (analyseur à descente récursive, types suivis pour respecter la division entière et les débordements du C) et traduite en JavaScript asynchrone où delay() avance un temps virtuel ; 55 modèles de comportement de composants ; l'utilisateur branche chaque broche et une erreur est expliquée à partir des capacités de la broche (entrée seule, ADC, bus par défaut, tension). Limite assumée et affichée : simulation du comportement, pas émulation du microcontrôleur.\n- missions de l'atelier (12/11/2026) : 50 défis écrits pour les modèles du parcours (« ouvre la porte : la sirène sonne », « refroidis à 18 °C : le chauffage démarre », « obstacle à 15 cm : le robot recule ») et 2 automatiques par projet (câbler sans aide, une minute sans panne), validés par le simulateur en temps virtuel ; un test joue chaque mission avec son action, puis sans (scénario témoin armé au même instant) : aucune mission impossible ni gagnée d'office. Le scénario témoin a trouvé deux défauts du moteur, corrigés (effet du clic compté avant l'armement de la mission ; appuis d'une mission précédente recomptés). Progression (points, niveaux, 15 badges, avancement des 7 étapes) calculée par une fonction pure, table mission_reussie (migration 0005), exportée et effacée avec le compte.\n- onglet « Apprendre » de chaque projet (12/11/2026) : montage pas à pas, masses puis alimentations puis signaux, chaque fil avec son pourquoi tiré du rôle et des capacités de la broche réellement choisie (ADC1 compatible Wi-Fi, bus I2C par défaut et adresse du module, résistance ajoutée et sa raison) ; programme expliqué ligne par ligne, chaque fonction à sa première apparition (un test vérifie que les 67 fonctions de composants utilisées par les 145 modèles ont leur explication — il a trouvé que les clés on/off d'un YAML devenaient des booléens) ; notions tirées d'un glossaire de 38 termes ; quiz de 6 questions par étape du parcours, enregistré dans la progression quand il est réussi sans faute."
  Gérer les droits et accès à l’application:
    - "Rôles utilisateur et administrateur, contrôle de propriété de chaque objet (inventaire, projets), jetons de courte durée."
  Intégrer les composants d’accès aux données:
    - "Un client par interface, même logique : Python pour Streamlit, JavaScript pour la PWA (src/api.js). Jeton d'accès en mémoire, jeton de rafraîchissement le temps de l'onglet, renouvellement sur une réponse 401 puis requête rejouée, catalogue lu page par page. Un test de contrat garantit que chaque route appelée par Streamlit existe ; le client de la PWA et le rendu du guide de soudure sont couverts par 16 tests Vitest."
  Sécuriser l’application:
    - "Top 10 OWASP : validation des entrées, jetons en mémoire, contenus générés échappés, fichiers contrôlés, limitation de débit, dépendances surveillées (Dependabot, pip-audit), secrets détectés en CI (gitleaks). La PWA est servie par nginx avec une politique CSP stricte (aucun script en ligne, connect-src limité aux deux API, frame-ancestors 'none') ; les API n'acceptent que son origine (CORS). L'atelier virtuel, qui exécute la logique du projet avec new Function, tourne dans un cadre isolé (iframe sandbox, origine opaque) dont la CSP propre autorise unsafe-eval mais interdit toute requête réseau (connect-src 'none') : la règle reste stricte pour le reste de l'application."
  Intégrer des tests automatisés:
    - "1 238 tests MicroForge (couverture mesurée 87,7 % le 06/11/2026), dont la vérification syntaxique C++ de 1 519 firmwares générés (145 projets au 12/11/2026), l'exécution simulée de chaque projet dans Node avec des scénarios ciblés (repas servi à l'heure, compte à rebours du 31 décembre…), la compilation réelle avec arduino-cli en CI et des tests d'intégration sur PostgreSQL + pgvector. Deux parcours de bout en bout pilotés par Playwright démarrent les deux API : Streamlit (inscription → stock → idées → projet, 8 onglets → explorer → copilote) et PWA au format téléphone (inscription → stock → idées → projet, 10 onglets avec atelier virtuel simulé, archive .zip, changement de carte, enregistrement et liste d'achat → missions (onglet Apprendre, quiz sans faute, mission de l'atelier réussie et enregistrée, points et badges à l'accueil) → thème complet (toutes les idées générables) → Créer (modèle, idée libre conçue « avec l'IA » avec repli signalé, projet enregistré rouvert) → Atelier (deux projets simulés) → copilote → photo → rechargement hors ligne), servie avec les en-têtes de son image : une ressource bloquée par la CSP fait échouer le test. Le même parcours tourne aussi contre la vraie pile Docker (job « Pile complète »)."
  C17. Développement des Composants et Interfaces > Versionner les sources avec Git:
    - "Dépôt GitHub, branches de fonctionnalité, demandes de fusion relues."
  Prendre en compte les enjeux d’accessibilité:
    - "Statuts toujours écrits en texte, onglets utilisables au clavier, schémas avec titre et description. Le parcours de la PWA audite chaque vue avec axe-core (WCAG 2.2 A et AA) : 0 violation sur les 6 vues ; le constat relevé pendant le développement (zones défilantes non focalisables au clavier, règle scrollable-region-focusable) a été corrigé avant le premier commit."
  Rédiger la documentation technique:
    - "Documentation Sphinx (Furo + MyST) publiée : installation, architecture, API."

  # ------------------------------------------------------------------ C18
  Choisir l’outil d’intégration continue:
