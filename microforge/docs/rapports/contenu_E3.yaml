# Contenu du rapport E3 (C9 à C13) injecté dans referentiel/modeles/E3_template.docx.
titre: "MicroForge — détecteur de composants : intégration et MLOps"
annexe_titre: "Annexe 1 : extraits du workflow model-cd et du rapport d'évaluation"

sections:
  Introduction:
    - "Le modèle mis en service est le détecteur de composants électroniques (YOLO) qui transforme la photo d'un tiroir en inventaire. Il est exposé par l'API IA de MicroForge, intégré dans l'application, surveillé en production, testé automatiquement et réentraîné par une chaîne de livraison continue qui ouvre une demande de fusion avec son rapport d'évaluation."

  # ------------------------------------------------------------------ C9
  Analyser les spécifications fonctionnelles et techniques:
    - "Entrée : une photo (JPEG, PNG ou WebP, 8 Mo maximum). Sortie : la liste des composants détectés (classe, boîte, confiance), rapprochés du catalogue, avec un affinage optionnel par VLM pour lire les marquages. Temps de réponse visé : moins de 5 s."
  Concevoir l'architecture de l'API:
    - "API séparée de l'API de données (exigence du projet) : api_ia vérifie les jetons émis par api_data avec la seule clé publique RS256 et ne peut pas en émettre. Routes principales : POST /v1/vision/scan, POST /v1/builds/suggest, /generate, /from-goal, /bundle, POST /v1/ideas/explore, GET /v1/ideas/inspiration, POST /v1/copilot/ask (copilote RAG), /health, /metrics."
  Choisir les outils et langages de programmation:
    - "Python, FastAPI, Pydantic v2, Ultralytics YOLO, Pillow, MLflow (registre de modèles), slowapi (quotas), loguru."
  Installer et configurer l'environnement de développement:
    - "```bash\nuv sync --all-packages --group dev --extra data --extra app\nLLM_CHAIN=fake uv run uvicorn microforge.api_ia.main:app --port 8001\n```"
  Développer la vérification et la transformation des paramètres:
    - "Le type réel du fichier est vérifié par Pillow (et non par l'extension), la taille est bornée, les métadonnées EXIF/GPS sont supprimées (RGPD) et l'image est redimensionnée avant l'inférence."
  Développer l'exécution du modèle à partir de la requête client:
    - "Le détecteur est chargé une seule fois au démarrage depuis le registre MLflow (alias @production) ou depuis un fichier local ; les classes sont rapprochées du catalogue (correspondance exacte puis approximative)."
    - "Copilote (POST /v1/copilot/ask) : RAG sur le catalogue lui-même (379 passages : composants, 40 cartes, projets, idées). La question est vectorisée (bge-m3 via Ollama), les passages les plus proches sont cherchés dans PostgreSQL + pgvector (index HNSW, distance cosinus) puis le modèle local répond en citant [n]. Sous un seuil de similarité (MF_COPILOT_MIN_SCORE), la réponse est « je ne sais pas » sans appel au LLM ; sans LLM joignable, les passages sont renvoyés tels quels. L'index est reconstruit automatiquement si le catalogue (empreinte) ou le modèle d'embeddings (dimension) change."
  Développer la réponse de l'API avec le résultat du modèle:
    - "Réponse typée (ScanResult) : détections, composants proposés pour l'inventaire, version du modèle, durée d'analyse."
  Développer les règles d'autorisation et d'accès:
    - "Toutes les routes métier exigent un jeton valide ; quotas par utilisateur (ex. 20 générations d'idées par heure) ; erreurs 401/403/413/415/429 explicites."
  Sécuriser l'API:
    - "Vérification RS256 par clé publique, limitation de débit, taille et type de fichier contrôlés, aucun stockage de photo sans consentement, en-têtes de sécurité, Top 10 OWASP API passé en revue."
  Développer des tests d'intégration:
    - "tests/test_api_ia.py : TestClient FastAPI, détecteur statique et fournisseur LLM simulé ; un test de contrat vérifie que chaque route appelée par l'application existe bien dans l'une des deux API."
    - "tests/test_copilot.py : réponse citée, refus sous le seuil sans appel au LLM, repli extractif, prise en compte du stock, route protégée (401, 422, 503) ; le même scénario tourne en CI sur une vraie base PostgreSQL + pgvector (service Docker pgvector/pgvector:pg17, job dédié qui échoue si un test est ignoré)."
  Versionner les sources avec Git:
    - "Branches de fonctionnalité, commits explicites, CI à chaque push (ruff, pytest avec seuil de couverture de 80 %)."
  Rédiger et/ou générer la documentation de l'API:
    - "OpenAPI générée (/docs) et page docs/E3/api-ia.md avec exemples."

  # ------------------------------------------------------------------ C10
  Installer l'environnement de développement de l'application:
    - "Preuve de concept Streamlit multipage (app_streamlit/), puis PWA React + Vite (microforge/pwa) pour les utilisateurs, au format téléphone : mêmes API, même authentification."
  Programmer les étapes d'authentification et d'autorisation:
    - "Inscription et connexion par l'API de données ; le client conserve le jeton d'accès en mémoire et le renouvelle automatiquement avec le jeton de rafraîchissement quand il reçoit une 401, puis rejoue la requête (testé dans tests/test_streamlit_client.py)."
  Programmer la communication avec l'API:
    - "Client httpx unique (app_streamlit/client.py) : inventaire, scan photo, suggestions, génération, exploration par thème, inspiration, copilote (page « Copilote » en st.chat_message, sources dépliables avec leur score)."
  Intégrer les adaptations d'interface:
    - "Résultats de détection affichés sous forme de liste éditable (pas seulement des boîtes sur l'image), onglets câblage / schéma / code / guide / Wokwi / KiCad / nomenclature / fiabilité et sources."
  Tester et valider l'accessibilité des interfaces:
    - "Navigation au clavier, libellés explicites, statut exprimé par du texte et pas seulement par la couleur, schéma SVG avec titre et description."
    - "Audit axe-core 4.10.3 (règles WCAG 2.2 A et AA) du 04/11/2026, thèmes clair et sombre : 9 vues de la démo et l'accueil de l'application Streamlit. Avant : 30 constats de gravité « serious » (vue × thème × règle) (langue de page absente, aria-label sans rôle sur le bloc de contrôle électrique et le moniteur série, deux contrastes insuffisants à 3,93:1 et 4,35:1). Après correction : 0 violation. Les contrastes du thème sont vérifiés à chaque commit (tests/test_streamlit_theme.py) ; clavier, focus visible, statut écrit en toutes lettres et animations coupées par prefers-reduced-motion vérifiés à la main (docs/E3/accessibilite.md)."
  C10. Intégration de l'API dans une Application > Développer des tests d'intégration:
    - "Tests du client (renouvellement de jeton, erreurs, nouvelles routes), tests Playwright de l'atelier virtuel (tests/test_sim.py), et parcours complet de bout en bout avec Playwright, lancé à chaque push par le job CI « e2e » (tests/test_e2e_parcours.py : api_data, api_ia et Streamlit démarrés par le test, base SQLite jetable, modèle de langage simulé ; 13 étapes, aucune exception tolérée) : inscription, ajout d'un lot au stock, idées, génération, chaque onglet ouvert sans erreur, exploration par thème, question au copilote (réponse appuyée sur des sources)."
  C10. Intégration de l'API dans une Application > Versionner les sources avec Git:
    - "Même dépôt et même CI que les API."

  # ------------------------------------------------------------------ C11
  Lister les métriques du modèle à monitorer:
    - "| Métrique | Signification | Seuil |\n|---|---|---|\n| mf_detection_correction_rate | part des détections corrigées par les utilisateurs (7 jours) | > 25 % → alerte et réentraînement |\n| mf_detection_confidence | confiance des prédictions | moyenne < 0,5 sur 24 h |\n| mf_detections_unknown_total | objets hors catalogue | > 20 % sur 6 h |\n| mf_scan_seconds | durée d'analyse | p95 > 5 s |\n| mAP50 sur les retours étiquetés | performance réelle | baisse > 5 points |"
  Choisir une solution ou un outil pour le monitorage:
    - "Prometheus (métriques exposées par les deux API, collectées toutes les 15 s) et Alertmanager pour le routage des alertes. Pas d'outil de rapport de dérive séparé (Evidently n'est pas intégré) : la dérive est suivie par trois indicateurs calculés en continu, taux de corrections, confiance moyenne et part d'objets hors catalogue."
  Intégrer la solution ou l'outil de monitorage:
    - "Instrumentation dans api_ia (histogrammes, compteurs, séries créées à 0 au démarrage pour que la première photo compte) et calcul du taux de corrections dans api_data à partir de la table retour_detection."
  Sélectionner un outil de restitution des métriques:
    - "Grafana : tableau « Modèle » provisionné (monitoring/grafana/)."
  Intégrer l'outil de restitution et les alertes:
    - "Règles d'alerte Prometheus (monitoring/prometheus/alerts.yml), envoyées à Alertmanager (Discord si l'adresse du webhook est fournie). L'alerte « taux de corrections » porte l'étiquette action=retrain ; le workflow de réentraînement model-cd.yml se lance par repository_dispatch (type retrain), envoyé aujourd'hui à la main (gh api …/dispatches) : l'envoi automatique depuis Alertmanager demande un relais muni d'un jeton, pas encore fait."
  Tester et valider le bon fonctionnement de la chaîne de monitorage:
    - "Bac à sable : un générateur de trafic injecte volontairement une dérive (images sombres, classes inconnues) pour vérifier que l'alerte se déclenche."
    - "Tests unitaires des règles avec promtool (monitoring/prometheus/alerts.test.yml) : pour chaque alerte, des séries synthétiques au-dessus et en dessous du seuil ; l'alerte doit se déclencher après sa durée et rester muette en dessous. Lancés par le job CI « Supervision ». Rejoués sur les anciennes règles, ils échouent sur deux alertes : ce sont deux défauts réels trouvés par l'essai ci-dessous."
    - "Essai réel du 06/11/2026 (pile lancée sur le poste de développement, modèle de langage simulé, donc détections fictives) : trafic en dérive -> taux de corrections mesuré 60 % ; les trois alertes du modèle passent à l'état pending (elles déclenchent après 1 h ou 2 h de dépassement, par construction). L'essai a révélé trois défauts, corrigés et couverts par des tests : la latence p95 lisait un histogramme plafonné à 1 s (alerte à 2 s impossible), les compteurs créés à la première photo rendaient la confiance moyenne incalculable sur faible trafic, et la part d'objets inconnus était divisée par les seules détections reconnues (alerte muette si tout est inconnu)."
    - "![Grafana, tableau « Modèle de vision » pendant l'essai de dérive du 06/11/2026 : taux de corrections, confiance moyenne, objets hors catalogue, durée d'analyse](E3/img/grafana-modele.png)"
  C11. Monitorage d'un Modèle d'IA > Versionner les sources avec Git:
    - "Tableaux Grafana et règles d'alerte versionnés en fichiers (provisioning)."
  Rédiger la documentation technique et utilisateur:
    - "docs/E3/monitoring-modele.md : installation, lecture des tableaux, conduite à tenir pour chaque alerte."

  # ------------------------------------------------------------------ C12
  Définir le périmètre des tests pour chaque composante du modèle:
    - "| Partie | Cas testés |\n|---|---|\n| Données | format des lignes YOLO, classes connues, coordonnées normalisées, labels manquants |\n| Sources | licence CC BY ou domaine public (API et README), archives sans chemin dangereux |\n| Préparation | correspondance des classes, polygones convertis, EXIF retiré, attribution, déterminisme |\n| Fuites | même image (SHA-256) dans deux ensembles ; photos d'un même composant, copies augmentées et quasi-doublons dans le même ensemble |\n| Cohérence | dataset.yaml = classes.yaml = identifiants du catalogue |\n| Entraînement | test fumée d'une epoch sur CPU |\n| Évaluation | porte de non-régression : mAP50 ≥ production − 0,02 |\n| Inférence | schéma de sortie, correspondance avec le catalogue |"
  Choisir les outils de test:
    - "pytest (tests paramétrés, fixtures), hypothesis pour l'allocateur de broches, CI GitHub Actions."
  Installer et configurer l'environnement d'exécution des tests:
    - "uv sync puis uv run pytest ; l'entraînement réel de référence et son évaluation sur le split de test tournent sur un runner GitHub sans GPU (workflow jeux-de-donnees), le runner GPU auto-hébergé de la chaîne model-cd restant à installer."
  Intégrer les tests:
    - "tests/test_ml_data.py, test_ml_prepare.py, test_ml_import.py et test_ml_roboflow.py (63 tests) et ml/evaluate.py, exécutés à chaque push et dans la chaîne de livraison du modèle."
  Versionner les sources et les données avec Git:
    - "Code, correspondances de classes et licences dans Git ; chaque source épinglée (version Roboflow, version Mendeley et SHA-256 du zip) ; préparation déterministe et manifest.json (origine, licence, SHA-256 de chaque image) : le dataset se reconstruit à l'identique. DVC (dvc.yaml présent) n'est pas encore initialisé : il versionnera les photos personnelles une fois choisi un stockage S3 joignable depuis la CI."
  C12. Tests Automatisés d'un Modèle d'IA > Rédiger la documentation technique:
    - "docs/E3/tests-modele.md."

  # ------------------------------------------------------------------ C13
  C13. Création d'une Chaîne de Livraison Continue > Définir les étapes, tâches et déclencheurs de la chaîne de livraison continue:
    - "Déclencheurs : modification de ml/** ou des fichiers .dvc, alerte de monitoring (repository_dispatch), lancement manuel, réentraînement mensuel. Étapes : tests des données → entraînement → évaluation → comparaison avec @production → enregistrement en @staging → demande de fusion avec le rapport → promotion en @production à la fusion."
  C13. Création d'une Chaîne de Livraison Continue > Paramétrer la chaîne de livraison continue:
    - ".github/workflows/model-cd.yml, actions épinglées par empreinte de commit."
  Intégrer l'exécution des tests du modèle et des données:
    - "Première étape de la chaîne : tests de données et test fumée."
  Intégrer les étapes d'entraînement et d’évaluation du modèle:
    - "ml/train.py (périphérique choisi selon la machine : cuda, mps ou cpu), suivi MLflow ; ml/evaluate.py calcule mAP50, mAP50-95, précision et rappel par classe."
    - "Premier entraînement de référence, exécuté par la chaîne sur un runner GitHub sans GPU (04/11/2026, run 41785539714) : YOLO11n, 15 epochs, 416 px, jeu public IoTKITs (CC BY 4.0, 8 classes de cartes), 31 minutes. Sur le split de test, jamais utilisé pendant l'entraînement (138 images, 119 cartes) : mAP50 0,974, mAP50-95 0,930, précision 0,944, rappel 0,931 (validation : mAP50 0,966, mAP50-95 0,930). Classes les plus faibles : Arduino Pro Mini (mAP50 0,869) et ESP32 (rappel 0,751) ; les classes de moins de 10 objets en test ont un score instable. 35,5 ms par image sur CPU. Photos de cartes seules et bien cadrées : le score sur les photos réelles reste à mesurer."
    - "Entraînement sur l'ensemble des données (04/11/2026, run 41791374429) : IoTKITs et 6 jeux Roboflow Universe sous licence CC BY 4.0, téléchargés par la chaîne elle-même (licence vérifiée par l'API puis dans l'export) ; YOLO11n, 15 epochs, 416 px, 3 h 29 sur CPU. Sur le split de test (1 801 images, 2 560 objets, 27 classes) : mAP50 0,692, mAP50-95 0,592, précision 0,777, rappel 0,694 (validation : mAP50 0,734). Fiables (≥ 30 objets en test, mAP50 ≥ 0,9) : Uno, Mega, NodeMCU, servo SG90, potentiomètre, trimmer, HC-SR04. À améliorer : bouton, LED, diode, transistor, résistance (0,599). En échec : condensateurs (0,04 et 0,45) et fils Dupont (0,06, sur 19 objets seulement). Dix autres classes ont moins de 30 objets en test et ne sont pas mesurables ; deux classes n'ont aucun objet en test. Inférence : 18,9 ms par image sur CPU."
  Intégrer la génération des rapports d'évaluation:
    - "Rapport Markdown et matrice de confusion joints à la demande de fusion ouverte automatiquement."
  Intégrer l'étape de livraison:
    - "À la fusion, le modèle passe en @production ; api_ia recharge le modèle par son alias."
  C13. Création d'une Chaîne de Livraison Continue > Versionner les sources de la chaîne avec Git:
    - "Workflow et scripts dans le dépôt."
  Documenter les procédures d’installation et de test de la chaîne:
    - "docs/E3/cd-modele.md : installation du runner GPU, secrets nécessaires, lancement manuel."
  Documenter l'utilisation de la chaîne:
    - "[À COMPLÉTER : capture d'une demande de fusion « Modèle vX » avec son rapport]"

  Conclusion:
    - "Le détecteur est exposé par une API sécurisée, intégré dans l'application avec renouvellement transparent des jetons, surveillé par des métriques métier (taux de corrections) et techniques, testé à chaque étape et réentraîné automatiquement. Une première version est entraînée par la chaîne sur des jeux publics sous licence vérifiée : mAP50 0,974 sur le test pour les 8 cartes d'IoTKITs, 0,692 pour 27 classes de cartes, modules et composants, avec des classes fiables (cartes, servo, capteur à ultrasons, potentiomètres) et d'autres en échec (condensateurs, fils). Restent : un entraînement plus long sur GPU, des photos pour les classes faibles ou absentes, et la mesure sur les composants réels de l'utilisateur."
  Annexes:
    - "Extrait de la chaîne de livraison du modèle. Elle n'a pas encore tourné de bout en bout : il lui faut le runner GPU auto-hébergé et le stockage DVC (choix en attente). Les entraînements réels ont été faits par la chaîne CPU jeux-de-donnees.yml, qui applique les mêmes étapes (préparation contrôlée, entraînement, évaluation sur le split de test)."
    - |-
      ```yaml
      # .github/workflows/model-cd.yml (extrait) : tests des données -> entraînement GPU -> porte -> PR
      on:
        push: { branches: [main], paths: ["microforge/ml/**", "**/*.dvc"] }
        repository_dispatch: { types: [retrain] }   # alerte TauxCorrectionsEleve (action=retrain)
        schedule: [{ cron: "17 3 1 * *" }]          # réentraînement mensuel
      jobs:
        data-tests:        # pytest microforge/tests/test_ml_data.py (C12)
        train-evaluate:
          runs-on: [self-hosted, gpu]
          steps:
            - id: eval     # code 1 si mAP50 < mAP50(@production) - 0,02 : pas de livraison
              run: uv run python microforge/ml/evaluate.py --weights .../best.pt --out reports/evaluation
        deliver:           # si la porte passe : MLflow @staging + PR « Modèle de détection — run … »
          if: needs.train-evaluate.outputs.ok == 'true'
        promote:           # PR fusionnée (label model-release) : alias @production
      ```
    - "Rapport d'évaluation réel, produit par ml/compare_runs.py à partir du registre ml/experiences.yaml (scores recopiés des journaux des runs GitHub Actions) :"
    - "| Run | Données | Classes | Durée (CPU) | Validation mAP50 | Test mAP50 | Test mAP50-95 | Inférence |\n|---|---|---|---|---|---|---|---|\n| iotkits-v1 (41785539714) | IoTKITs (CC BY 4.0) | 8 | 0,51 h | 0,966 | 0,974 | 0,930 | 35,5 ms |\n| complet-v1 (41791374429) | IoTKITs + 6 jeux Roboflow Universe (CC BY 4.0) | 27 | 3,49 h | 0,734 | 0,692 | 0,592 | 18,9 ms |"
    - "Run complet-v1, classes mesurables (au moins 30 objets dans le split de test), par score décroissant :"
    - "| Classe | mAP50 test (objets) |\n|---|---|\n| arduino_uno | 0,995 (179) |\n| arduino_mega | 0,995 (33) |\n| nodemcu | 0,995 (185) |\n| potentiometer | 0,990 (87) |\n| servo_sg90 | 0,982 (99) |\n| hc_sr04 | 0,978 (69) |\n| trimmer | 0,917 (192) |\n| push_button | 0,895 (134) |\n| led | 0,844 (217) |\n| diode | 0,830 (145) |\n| transistor | 0,790 (228) |\n| resistor | 0,599 (766) |\n| capacitor_electrolytic | 0,449 (52) |\n| capacitor_ceramic | 0,040 (68) |"
    - "Lecture : les cartes et les modules au contour net sont fiables ; les petits composants passifs, vus sous tous les angles et souvent mal annotés, ne le sont pas encore (condensateurs céramiques 0,04). Onze classes, fils Dupont compris, ont moins de 30 objets en test : leur score n'est pas interprétable."
