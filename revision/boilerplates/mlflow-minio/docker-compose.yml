# Versions vérifiées le 03/11/2026 (tags des dépôts officiels).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: mlflow
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
  s3:
    image: chrislusf/seaweedfs:4.52
    # les clés sont injectées dans s3.json au démarrage (jamais écrites dans le dépôt)
    entrypoint: >
      sh -c "sed -e \"s/S3_ACCESS_KEY/$$S3_ACCESS_KEY/\" -e \"s/S3_SECRET_KEY/$$S3_SECRET_KEY/\"
      /etc/seaweedfs/s3.template.json > /tmp/s3.json && weed server -dir=/data -s3 -s3.config=/tmp/s3.json"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./mlflow-server/s3.json:/etc/seaweedfs/s3.template.json:ro
      - s3:/data
  mlflow:
    build: ./mlflow-server
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
volumes:
  postgres:
  s3:
