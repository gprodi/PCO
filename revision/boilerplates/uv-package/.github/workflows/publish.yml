name: publier
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi            # environnement déclaré dans PyPI (Trusted Publishing)
    permissions:
      id-token: write            # jeton OIDC à durée de vie courte, aucun secret stocké
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv run --group dev pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
