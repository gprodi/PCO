groups:
  - name: api-modele
    rules:
      - alert: TauxErreursEleve
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critique}
        annotations:
          summary: "Plus de 5 % de réponses 5xx sur 5 minutes"
      - alert: LatenceP95Elevee
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: {severity: attention}
        annotations:
          summary: "Latence p95 au-dessus de 500 ms"
      - alert: DeriveConfianceModele
        expr: histogram_quantile(0.5, sum by (le) (rate(model_prediction_confidence_bucket[30m]))) < 0.6
        for: 30m
        labels: {severity: attention}
        annotations:
          summary: "Confiance médiane du modèle sous 0,6 : données inhabituelles ? réentraîner ?"
      - alert: CibleInjoignable
        expr: up == 0
        for: 2m
        labels: {severity: critique}
        annotations:
          summary: "{{ $labels.job }} ne répond plus à Prometheus"
