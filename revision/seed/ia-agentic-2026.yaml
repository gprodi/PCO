exercices:
  - titre: "Classer des architectures"
    niveau: 1
    enonce: "Pour chaque besoin, propose l'architecture la plus simple qui convient : (a) reformuler un texte ; (b) répondre sur le règlement intérieur de l'école ; (c) commander des composants manquants chez un fournisseur ; (d) converser en se souvenant du prénom de l'utilisateur."
    corrige: |
      (a) LLM seul (sans état) ; (b) chatbot RAG avec citations ; (c) agent avec outils (API fournisseur, panier) et validation humaine avant paiement ; (d) chatbot avec historique.
  - titre: "Mini-RAG avec citation"
    niveau: 2
    enonce: "Étends le code « Le R de RAG » : renvoie les 2 meilleurs passages avec leur numéro, et construis un prompt qui oblige la réponse à citer [n]. Si le meilleur score est inférieur à 0,1, réponds « je ne sais pas » sans appeler le LLM."
    corrige: |
      ```python
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.metrics.pairwise import cosine_similarity

      MOTS_VIDES = ["le", "la", "les", "un", "une", "des", "du", "de", "est", "et", "quel", "quelle", "pour"]

      def rag_prompt(question: str, passages: list[str], k: int = 2, seuil: float = 0.1) -> str | None:
          vect = TfidfVectorizer(stop_words=MOTS_VIDES).fit(passages)
          scores = cosine_similarity(vect.transform([question]), vect.transform(passages))[0]
          meilleurs = scores.argsort()[::-1][:k]
          if scores[meilleurs[0]] < seuil:
              return None                          # « je ne sais pas » : rien de pertinent
          contexte = "\n".join(f"[{i}] {passages[i]}" for i in meilleurs)
          return ("Réponds uniquement à partir des passages ci-dessous et cite-les sous la forme [n].\n"
                  f"{contexte}\n\nQuestion : {question}")

      passages = ["Le DHT22 mesure température et humidité.", "Le SG90 est un servomoteur."]
      print(rag_prompt("Quel capteur pour l'humidité ?", passages))
      print(rag_prompt("Quelle est la capitale du Pérou ?", passages))   # None
      ```
      Sans la liste de mots vides, la question sur le Pérou obtient un score non nul (le mot « est » est commun avec un passage) et un contexte hors sujet est envoyé au LLM : c'est pour cela qu'on retire les mots vides et qu'on fixe un seuil — et qu'on préfère des embeddings en production.
mindmap: |
  # IA agentique 2026
  ## Histoire
  - Règles (ELIZA)
  - Statistique (TF-IDF, NLTK)
  - Embeddings (Word2Vec)
  - Transformer (2017)
  - LLM (GPT, ChatGPT)
  ## Attention
  - Lier chaque mot à tous les autres
  - Têtes multiples
  ## Niveaux
  - LLM sans état
  - Chatbot (historique)
  - RAG (savoir)
  - Agent (outils, boucle)
  - Multi-agents
  ## Outils
  - LangChain
  - LangGraph
  ## Choisir
  - Le plus simple qui suffit
  - Coût, fiabilité, risque
podcast_titre: "Soixante ans de chatbots en dix minutes"
podcast:
  - { voix: A, texte: "Karim, ChatGPT, c'est sorti de nulle part en 2022 ?" }
  - { voix: B, texte: "Pas du tout. En 1966, ELIZA répondait déjà avec des règles et des mots-clés, sans rien comprendre. Puis le NLP statistique, puis les embeddings en 2013 : les mots deviennent des vecteurs." }
  - { voix: A, texte: "Et le grand tournant ?" }
  - { voix: B, texte: "2017, le Transformer. L'attention relie chaque mot à tous les autres, d'un coup. Tout part de là : BERT, GPT, les LLM actuels." }
  - { voix: A, texte: "Pourquoi mon LLM oublie ce que je lui ai dit juste avant ?" }
  - { voix: B, texte: "Parce qu'il est sans état. Un chatbot lui renvoie tout l'historique à chaque message. Ça a un coût : plus la conversation est longue, plus tu paies de tokens." }
  - { voix: A, texte: "Et pour qu'il connaisse mes documents ?" }
  - { voix: B, texte: "Le RAG : on cherche les passages pertinents dans ta base, et le LLM répond à partir d'eux, en les citant. Mon outil de révision fait exactement ça avec tes cours." }
  - { voix: A, texte: "Et un agent ?" }
  - { voix: B, texte: "On lui donne des outils : appeler une API, lancer du code, interroger une base. Il décide lui-même quoi faire, observe le résultat, recommence. Puissant, mais à n'utiliser que si la tâche l'exige vraiment." }
