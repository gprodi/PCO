  - { recto: "Exécuter le pipeline", verso: "kedro run (--pipeline nom, --nodes nom pour cibler)" }
  - { recto: "Déclarer un jeu de données", verso: "Dans catalog.yml : nom, type (pandas.CSVDataset…), filepath" }
  - { recto: "Node", verso: "node(fonction, inputs=..., outputs=..., name=...)" }
  - { recto: "Pipeline", verso: "pipeline([node(...), node(...)]) ; ordre déduit des dépendances." }
  - { recto: "Paramètres", verso: "conf/base/parameters.yml ; utilisés via \"params:nom\"" }
  - { recto: "Secrets", verso: "conf/local/credentials.yml (jamais versionné)" }
  - { recto: "Visualiser", verso: "kedro viz run" }
  - { recto: "Couches de data/", verso: "01_raw, 02_intermediate, 03_primary… 06_models, 08_reporting" }
  - { recto: "Données en mémoire pour les tests", verso: "MemoryDataset" }
  - { recto: "Kedro + MLflow", verso: "Plugin kedro-mlflow : journalisation automatique de chaque run." }
  - { recto: "Rôle des notebooks dans Kedro", verso: "Explorer ; le code de production vit dans les nodes du pipeline." }
exercices:
  - titre: "Du notebook au pipeline"
    niveau: 1
    enonce: "Un notebook lit `data/ventes.csv`, supprime les lignes vides, calcule le total par mois et sauvegarde `total_mois.csv`. Découpe-le en catalogue + nodes + pipeline Kedro."
    corrige: |
      **catalog.yml** : `ventes_brutes` (pandas.CSVDataset, data/01_raw/ventes.csv) et `total_mois` (pandas.CSVDataset, data/08_reporting/total_mois.csv).

      ```python
      import pandas as pd
      from kedro.pipeline import node, pipeline

      def nettoyer(df: pd.DataFrame) -> pd.DataFrame:
          return df.dropna()

      def total_par_mois(df: pd.DataFrame) -> pd.DataFrame:
          return df.groupby(pd.to_datetime(df["date"]).dt.to_period("M"))["montant"].sum().reset_index()

      def create_pipeline(**kwargs):
          return pipeline([
              node(nettoyer, "ventes_brutes", "ventes_propres"),
              node(total_par_mois, "ventes_propres", "total_mois"),
          ])
      ```
      `ventes_propres`, absent du catalogue, reste en mémoire entre les deux nodes.
  - titre: "Tester un node"
    niveau: 2
    enonce: "Écris un test pytest pour le node `nettoyer` du cours (dropna + drop_duplicates)."
    corrige: |
      ```python
      import pandas as pd

      def nettoyer(df: pd.DataFrame) -> pd.DataFrame:
          return df.dropna().drop_duplicates()

      def test_nettoyer():
          df = pd.DataFrame({"a": [1, 1, None], "b": ["x", "x", "y"]})
          assert nettoyer(df).to_dict("records") == [{"a": 1.0, "b": "x"}]
      ```
mindmap: |
  # Kedro
  ## Sans structure
  - Notebooks, fichiers locaux
  - Dépendances invisibles
  - Expériences non comparables
  ## Template
  - conf/, data/, src/, tests/
  ## Data Catalog
  - catalog.yml
  - Types de datasets
  ## Code
  - Nodes (fonctions pures)
  - Pipelines
  - params:
  ## Outils
  - kedro run
  - Kedro-Viz
  - kedro-mlflow
  ## Configuration
  - conf/base
  - conf/local (secrets)
podcast_titre: "Ranger son projet de data science avant qu'il ne déborde"
podcast:
  - { voix: A, texte: "Karim, le cours sur Kedro était un combat de jeu vidéo avec des points de vie. Je n'ai pas tout compris." }
  - { voix: B, texte: "L'idée : un projet de data science sans structure perd des points à chaque étape. Fichiers sans nom, notebooks qu'on relance dans le désordre, résultats impossibles à comparer." }
  - { voix: A, texte: "Et Kedro rend des points de vie ?" }
  - { voix: B, texte: "Il impose une structure. D'abord un catalogue : chaque jeu de données est déclaré une fois, avec son chemin et son format. Ton code ne manipule plus de chemins." }
  - { voix: A, texte: "Et le code lui-même ?" }
  - { voix: B, texte: "Découpé en nodes : des fonctions pures, avec des entrées et des sorties nommées. Kedro les assemble en pipeline et devine l'ordre tout seul." }
  - { voix: A, texte: "Et les paramètres comme la taille du jeu de test ?" }
  - { voix: B, texte: "Dans parameters point yml, et le node les reçoit avec params deux-points nom. Les secrets vont dans conf local, jamais dans Git." }
  - { voix: A, texte: "Ça remplace Prefect ?" }
  - { voix: B, texte: "Non, c'est complémentaire : Kedro organise le code, Prefect planifie et exécute en production. Et Kedro-Viz te dessine le pipeline, parfait pour la soutenance." }
