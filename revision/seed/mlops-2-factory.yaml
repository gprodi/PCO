  - { recto: "Lancer le serveur MLflow avec S3", verso: "mlflow server --backend-store-uri … --default-artifact-root s3://mlflow/ --host 0.0.0.0" }
  - { recto: "Ports MinIO", verso: "9000 : API S3 ; 9001 : console web." }
  - { recto: "Créer un bucket", verso: "boto3.client(\"s3\", endpoint_url=...).create_bucket(Bucket=\"mlflow\")" }
  - { recto: "Enregistrer un modèle", verso: "mlflow.sklearn.log_model(model, name=\"model\", registered_model_name=\"iris_model\")" }
  - { recto: "Poser un alias", verso: "MlflowClient().set_registered_model_alias(nom, \"Production\", version)" }
  - { recto: "Version pointée par un alias", verso: "client.get_model_version_by_alias(nom, alias).version" }
  - { recto: "Charger par alias", verso: "mlflow.pyfunc.load_model(\"models:/iris_model@Production\")" }
  - { recto: "Variables côté client", verso: "MLFLOW_TRACKING_URI, MLFLOW_S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY" }
  - { recto: "Rollback", verso: "Remettre l'alias sur la version précédente." }
  - { recto: "Stages vs alias", verso: "Stages (Staging/Production) dépréciés depuis MLflow 2.9 ; on utilise des alias libres." }
  - { recto: "Dans un conteneur, adresse de MinIO", verso: "http://minio:9000 (nom du service), pas localhost." }
exercices:
  - titre: "Promouvoir et revenir en arrière"
    niveau: 1
    enonce: "Le modèle iris_model a les versions 1 (accuracy 0,91) et 2 (0,95). Écris les appels pour mettre la v2 en Production, puis, après un incident, revenir à la v1. Que doit faire l'API ?"
    corrige: |
      ```python
      from mlflow import MlflowClient

      client = MlflowClient()
      client.set_registered_model_alias("iris_model", "Production", "2")
      # incident…
      client.set_registered_model_alias("iris_model", "Production", "1")
      ```
      L'API n'a rien à faire : au prochain contrôle (TTL), elle voit que l'alias pointe vers une autre version et recharge le modèle.
  - titre: "Stack Compose MLflow + MinIO propre"
    niveau: 2
    enonce: "Réécris le compose du cours : versions épinglées, identifiants dans le .env, volumes pour MinIO et pour la base MLflow, console MinIO et interface MLflow accessibles seulement depuis la machine."
    corrige: |
      ```yaml
      services:
        minio:
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          command: server /data --console-address ":9001"
          environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
          volumes: [minio_data:/data]
          ports: ["127.0.0.1:9001:9001"]

        mlflow:
          image: ghcr.io/mlflow/mlflow:v3.5.0
          depends_on: [minio]
          environment:
            MLFLOW_S3_ENDPOINT_URL: http://minio:9000
            AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
            AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
          command: >
            mlflow server --host 0.0.0.0 --port 5000
            --backend-store-uri sqlite:////mlflow/mlflow.db
            --default-artifact-root s3://mlflow/
          volumes: [mlflow_db:/mlflow]
          ports: ["127.0.0.1:5000:5000"]

      volumes:
        minio_data:
        mlflow_db:
      ```
      Remarque : l'image officielle MLflow n'inclut pas toujours boto3 ; si `mlflow server` signale son absence, construire une image dérivée (`pip install boto3`).
mindmap: |
  # MLOps 2 — usine ML
  ## Tracking
  - Serveur MLflow (5000)
  - Backend store (SQL)
  ## Stockage
  - MinIO (S3), bucket mlflow
  - boto3
  - MLFLOW_S3_ENDPOINT_URL
  ## Registre
  - registered_model_name
  - Versions
  - Alias Production / Staging
  - MlflowClient
  ## Inférence
  - models:/nom@alias
  - Cache + TTL
  - Rechargement automatique
  - 503 si indisponible
  ## Exploitation
  - Promotion, rollback
  - Volumes, secrets
podcast_titre: "Déployer un nouveau modèle sans toucher au code"
podcast:
  - { voix: A, texte: "Karim, aujourd'hui pour changer de modèle, je remplace le fichier model point pkl dans mon API et je redéploie. Il y a mieux ?" }
  - { voix: B, texte: "Bien mieux : l'usine ML. MLflow garde la trace de chaque entraînement, MinIO stocke les fichiers des modèles, et le registre numérote les versions." }
  - { voix: A, texte: "Et comment l'API sait quelle version utiliser ?" }
  - { voix: B, texte: "Par un alias. Tu dis : la version 3 est Production. L'API charge models slash iris arobase Production et ne connaît jamais le numéro." }
  - { voix: A, texte: "Donc pour passer à la version 4…" }
  - { voix: B, texte: "Tu déplaces l'alias. L'API vérifie régulièrement, voit que l'alias pointe ailleurs, et recharge. Et si la version 4 pose problème, tu remets l'alias sur la 3 : rollback en une ligne." }
  - { voix: A, texte: "MinIO, c'est comme Amazon S3 ?" }
  - { voix: B, texte: "C'est compatible S3, mais chez toi. Il faut créer le bucket, donner l'adresse à MLflow avec MLFLOW S3 ENDPOINT URL, et surtout ne pas garder minioadmin comme mot de passe." }
  - { voix: A, texte: "Et si MLflow tombe pendant que l'API tourne ?" }
  - { voix: B, texte: "Si le modèle est en cache, l'API continue. Sinon elle renvoie 503, service indisponible, et ton monitoring doit le voir tout de suite." }
