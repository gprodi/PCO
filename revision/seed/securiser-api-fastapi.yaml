exercices:
  - titre: "Décoder un JWT à la main"
    niveau: 1
    enonce: "Décode le header et le payload du jeton `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhbGljZSIsImV4cCI6MTczNTY4OTYwMH0.<signature>` sans clé, puis explique pourquoi cela ne pose pas de problème de sécurité… à une condition."
    indices: ["base64.urlsafe_b64decode, en complétant avec des = si besoin"]
    corrige: |
      ```python
      import base64, json

      def b64(s: str) -> dict:
          return json.loads(base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)))

      print(b64("eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"))   # {'alg': 'HS256', 'typ': 'JWT'}
      print(b64("eyJzdWIiOiJhbGljZSIsImV4cCI6MTczNTY4OTYwMH0"))   # {'sub': 'alice', 'exp': 1735689600}
      ```
      La lecture est libre : la sécurité vient de la **signature**, qui empêche toute modification. À condition de ne jamais mettre de donnée sensible dans le payload et de toujours vérifier la signature côté serveur avec un algorithme figé.
  - titre: "Prouver les refus par les tests"
    niveau: 2
    enonce: "Avec l'API du cours, écris les tests : login correct → 200 ; mauvais mot de passe → 401 ; /predict sans jeton → 401 ; /predict avec le refresh token à la place de l'access → 401."
    indices: ["client.post('/token', data={...})", "headers={'Authorization': f'Bearer {jeton}'}"]
    corrige: |
      ```python
      from fastapi.testclient import TestClient

      client = TestClient(app)

      def _login(mdp="secret123"):
          return client.post("/token", data={"username": "alice", "password": mdp})

      def test_login_ok():
          assert _login().status_code == 200

      def test_mauvais_mot_de_passe():
          assert _login("faux").status_code == 401

      def test_sans_jeton():
          assert client.post("/predict").status_code == 401

      def test_refresh_refuse_comme_access():
          refresh = _login().json()["refresh_token"]
          r = client.post("/predict", headers={"Authorization": f"Bearer {refresh}"})
          assert r.status_code == 401
      ```
  - titre: "Rotation et détection de vol"
    niveau: 3
    enonce: "Implémente POST /refresh : vérifie le type, que le jti est actif, révoque l'ancien jti et émet un nouveau couple. Si un jti déjà tourné est présenté, révoque toute la famille de la session. Décris la structure de données côté serveur."
    indices: ["Famille = identifiant de session stocké dans le jeton (claim fam)", "Retenir le dernier jti émis par famille"]
    corrige: |
      Structure (en mémoire pour l'exercice, Redis ou base en production) : `familles: dict[str, str]` (famille → dernier jti émis) et `revoquees: set[str]` (familles révoquées).

      ```python
      from pydantic import BaseModel

      familles: dict[str, str] = {}
      revoquees: set[str] = set()

      class RefreshIn(BaseModel):
          refresh_token: str          # dans le corps, jamais dans l'URL (qui finit dans les logs)

      @app.post("/refresh")
      def refresh(body: RefreshIn):
          refus = HTTPException(401, "Refresh invalide, expiré ou révoqué")
          try:
              d = lire_token(body.refresh_token, "refresh")
          except jwt.InvalidTokenError:
              raise refus from None
          fam = d.get("fam")
          if fam in revoquees:
              raise refus
          if familles.get(fam) != d["jti"]:        # jeton déjà tourné : vol probable
              revoquees.add(fam)
              raise refus
          access, _ = creer_token(d["sub"], "access", timedelta(minutes=15))
          nouveau, jti = creer_token(d["sub"], "refresh", timedelta(days=7))   # + claim fam = fam
          familles[fam] = jti                       # rotation : l'ancien n'est plus le dernier
          return {"access_token": access, "refresh_token": nouveau, "token_type": "bearer"}
      ```
      Au login, on crée une nouvelle famille (`fam = secrets.token_hex(8)`) et on enregistre son premier jti. C'est le mécanisme de la table `RefreshToken` de MicroForge.
mindmap: |
  # Sécuriser une API FastAPI
  ## Fondamentaux
  - AuthN (401) / AuthZ (403)
  - Stateless, Bearer
  ## JWT
  - header.payload.signature
  - Claims : sub, exp, iat, iss, aud, jti
  - HS256 / RS256
  - Attaques : alg none, confusion
  - Décodage strict
  ## OAuth2
  - Rôles (owner, client, serveurs)
  - Password Grant : POST /token
  - Hash bcrypt / argon2
  - Depends + OAuth2PasswordBearer
  ## Refresh
  - Access 15 min / refresh 7 j
  - Rotation, révocation (jti)
  - Familles, détection de vol
  ## Production
  - SECRET_KEY (fail-closed)
  - HTTPS, CORS, rate limiting
  - Rôles, scopes
  - OWASP API Top 10
podcast_titre: "Le bracelet de festival de votre API"
podcast:
  - { voix: A, texte: "Karim, mon API de prédiction est en ligne. N'importe qui peut l'appeler… c'est grave ?" }
  - { voix: B, texte: "Oui : c'est une porte grande ouverte. Il faut savoir qui entre, et ce qu'il a le droit de faire. Authentification, puis autorisation." }
  - { voix: A, texte: "Et concrètement ?" }
  - { voix: B, texte: "Pense à un festival. Tu montres ta pièce d'identité une fois à l'entrée, on te met un bracelet, et ensuite le bracelet suffit partout. Le bracelet, c'est le JWT." }
  - { voix: A, texte: "Et si quelqu'un fabrique un faux bracelet ?" }
  - { voix: B, texte: "Impossible : il est signé avec une clé que seul le serveur connaît. Par contre, tout le monde peut lire ce qui est écrit dessus. Donc jamais de mot de passe dans un JWT." }
  - { voix: A, texte: "J'ai lu qu'il existe des attaques sur les JWT." }
  - { voix: B, texte: "Les classiques : un jeton qui déclare « pas de signature », ou qui change d'algorithme. La parade tient en un paramètre : algorithms égal la liste avec le seul algorithme attendu. Et n'oublie pas audience, sinon un jeton d'une autre API passe." }
  - { voix: A, texte: "Pourquoi deux jetons, access et refresh ?" }
  - { voix: B, texte: "L'access dure quinze minutes : s'il fuit, il expire vite. Le refresh dure sept jours mais ne sert qu'à renouveler. À chaque usage, on le remplace ; si un ancien revient, c'est un vol, et on coupe toute la famille." }
  - { voix: A, texte: "Et avant la mise en production ?" }
  - { voix: B, texte: "La checklist : clé secrète dans l'environnement, et refus de démarrer sans elle. HTTPS, limitation des tentatives de login, CORS restreint, et des tests qui prouvent les 401 et 403. C'est exactement ce que le jury veut voir." }
