  - { recto: "Structure d'un JWT", verso: "header.payload.signature (base64url) — signé, pas chiffré." }
  - { recto: "Claims standards", verso: "sub, exp, iat, iss, aud, jti (+ nbf)." }
  - { recto: "Décodage strict PyJWT", verso: "jwt.decode(t, cle, algorithms=[\"HS256\"], audience=\"...\", options={\"require\": [\"exp\", \"sub\"]})" }
  - { recto: "En-tête d'authentification", verso: "Authorization: Bearer <jeton>" }
  - { recto: "Route de login OAuth2", verso: "POST /token avec OAuth2PasswordRequestForm (username, password)." }
  - { recto: "Protéger une route FastAPI", verso: "Paramètre user = Depends(utilisateur_courant), qui dépend de OAuth2PasswordBearer." }
  - { recto: "Hacher un mot de passe", verso: "PasswordHash.recommended().hash(mdp) ; .verify(mdp, hash)" }
  - { recto: "Durées usuelles", verso: "Access ≈ 15 min ; refresh ≈ 7 jours." }
  - { recto: "Révoquer un JWT", verso: "Garder côté serveur les jti actifs (Redis/base) ; retirer le jti au logout ou à la rotation." }
  - { recto: "Générer une clé secrète", verso: "python -c \"import secrets; print(secrets.token_urlsafe(32))\"" }
