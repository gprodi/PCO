titre: "HorRAGor 2 — agent ReAct"
fiche:
  titre: "HorRAGor partie 2 : un agent ReAct avec outils, pgvector, FAISS, FastAPI et Streamlit"
  resume: >-
    La partie 2 construit le « cerveau » de HorRAGor : un agent autonome fondé sur ReAct (raisonner, agir,
    observer) qui interroge son savoir structuré et vectoriel, calcule l'âge des œuvres, recommande des films
    proches et, si besoin, va chercher des détails sur le web. L'architecture est strictement découplée : un
    front Streamlit ou Gradio (st.chat_input, st.chat_message, indicateur de chargement, thème sombre dans
    .streamlit/config.toml) qui ne contient aucune logique métier et appelle une API FastAPI ; l'API expose
    POST /chat, typée avec Pydantic, pilote le graphe LangGraph jusqu'au verdict d'un nœud juge et garde
    seule les clés Supabase. Un index FAISS en mémoire associe nom de film et identifiant pour valider
    rapidement qu'un film existe. Les outils sont précis et sûrs : requêtes SQL écrites à l'avance (jamais de
    SQL généré par le LLM), recommandation par similarité cosinus avec pgvector, scraping à la demande,
    calcul d'âge, et un simulateur de survie ludique. Prefect peut orchestrer en option l'ingestion de la
    partie 1.
  objectifs:
    - Concevoir une architecture découplée front / API / agent / base
    - Écrire des outils sûrs pour un agent (SQL paramétré, similarité pgvector, scraping ciblé)
    - Router rapidement les entités avec un index FAISS en mémoire
    - Exposer l'agent par une API FastAPI typée et une interface de chat Streamlit
  notions:
    - { terme: "ReAct", definition: "Boucle Reason + Act : pensée, appel d'outil, observation, jusqu'à la réponse finale." }
    - { terme: "Découplage", definition: "Le front capture et affiche ; l'API porte toute la logique (LLM, graphe, base, clés)." }
    - { terme: "FAISS", definition: "Bibliothèque d'index vectoriels en mémoire, très rapide ; ici un routeur nom de film → identifiant." }
    - { terme: "pgvector", definition: "Extension PostgreSQL qui stocke des vecteurs et calcule des distances (<=> cosinus) directement en SQL." }
    - { terme: "Outil SQL sûr", definition: "Fonction Python qui exécute une requête paramétrée écrite à l'avance ; le LLM ne fournit que des paramètres." }
    - { terme: "Nœud juge", definition: "Nœud du graphe qui évalue la réponse (pertinence, sources) avant de la renvoyer." }
    - { terme: "Supabase", definition: "PostgreSQL hébergé avec API, authentification et extension pgvector." }
  points_cles:
    - "Le LLM ne génère jamais de SQL brut : il choisit un outil et fournit des paramètres validés."
    - "Similarité de films : ORDER BY embedding <=> (SELECT embedding FROM films WHERE id = :id) LIMIT k."
    - "FAISS en RAM sert de vérification rapide avant les appels lourds (base, web)."
    - "Les clés (Supabase, TMDB) ne vivent que dans l'API ; le front ne parle qu'à l'API."
    - "Le scraping à la demande n'est déclenché que si l'information manque en base : coût et latence."
  code:
    - titre: "Outils sûrs : métadonnées SQL et films similaires (pgvector)"
      lang: python
      code: |
        from datetime import date

        from langchain_core.tools import tool
        from sqlalchemy import create_engine, text

        engine = create_engine("postgresql+psycopg://...")   # URL lue dans l'environnement en vrai

        @tool
        def query_movie_metadata(film_id: int) -> dict:
            """Renvoie titre, année, réalisateur, genre et note d'un film à partir de son identifiant."""
            sql = text("SELECT titre, annee, realisateur, genre, note FROM films WHERE id = :id")
            with engine.connect() as c:
                ligne = c.execute(sql, {"id": film_id}).mappings().first()
            return dict(ligne) if ligne else {"erreur": "film inconnu"}

        @tool
        def find_similar_horror_movies(film_id: int, k: int = 5) -> list[str]:
            """Recommande les k films d'horreur au synopsis le plus proche (similarité cosinus pgvector)."""
            sql = text("""
                SELECT titre FROM films
                WHERE id <> :id
                ORDER BY embedding <=> (SELECT embedding FROM films WHERE id = :id)
                LIMIT :k""")
            with engine.connect() as c:
                return [r.titre for r in c.execute(sql, {"id": film_id, "k": min(k, 20)})]

        @tool
        def calculate_movie_age(annee: int) -> int:
            """Calcule l'âge d'un film à partir de son année de sortie."""
            return date.today().year - annee
      explication: "Requêtes paramétrées, k borné : le LLM ne peut ni injecter de SQL ni demander 10 000 lignes."
    - titre: "API /chat et front découplé"
      lang: python
      code: |
        # api.py — seul composant qui connaît le graphe et les clés
        from fastapi import FastAPI
        from pydantic import BaseModel, Field

        class Question(BaseModel):
            message: str = Field(min_length=1, max_length=2000)
            session_id: str

        class Reponse(BaseModel):
            reponse: str
            sources: list[str] = []
            verdict_juge: str

        api = FastAPI()

        @api.post("/chat", response_model=Reponse)
        async def chat(q: Question) -> Reponse:
            # etat = await agent_app.ainvoke({"messages": [("user", q.message)]},
            #                                {"configurable": {"thread_id": q.session_id}})
            return Reponse(reponse="…", sources=[], verdict_juge="valide")

        # front.py — aucune logique métier
        # import httpx, streamlit as st
        # if prompt := st.chat_input("Pose ta question d'horreur…"):
        #     with st.spinner("HorRAGor réfléchit…"):
        #         r = httpx.post(f"{API}/chat", json={"message": prompt, "session_id": sid}, timeout=60)
        #     st.chat_message("assistant").write(r.json()["reponse"])
      explication: "thread_id relie les messages d'une même session (mémoire du graphe via checkpointer)."
  pieges:
    - "Laisser le LLM écrire du SQL : injection, requêtes destructrices, fuite de données."
    - "Mettre la clé Supabase dans le front Streamlit : elle devient visible et réutilisable."
    - "Pas de limite sur k ou sur la longueur des questions : coût et lenteur incontrôlés."
    - "Scraper à chaque question au lieu de seulement en cas de manque : lent et risqué."
    - "Pas de spinner ni de blocage pendant la réflexion : l'utilisateur envoie trois fois la même question."
  aller_plus_loin:
    - titre: "Index HNSW dans pgvector"
      contenu: "`CREATE INDEX ON films USING hnsw (embedding vector_cosine_ops);` accélère fortement la recherche de voisins sur des dizaines de milliers de films, au prix d'une recherche approchée. Mesure le temps de requête avant/après."
      lien: "https://github.com/pgvector/pgvector#hnsw"
    - titre: "Recherche hybride"
      contenu: "Combine la similarité vectorielle (sens) et la recherche plein texte PostgreSQL (mots exacts, titres) avec une fusion des rangs (RRF) : plus robuste pour les noms propres et les titres."
      lien: "https://github.com/pgvector/pgvector-python"
    - titre: "Streaming de la réponse"
      contenu: "Renvoie les tokens au fur et à mesure (StreamingResponse côté FastAPI, st.write_stream côté Streamlit) : l'utilisateur voit la réponse se construire au lieu d'attendre."
      lien: "https://docs.streamlit.io/develop/api-reference/write-magic/st.write_stream"
  jury: >-
    **E3 (C9, C10)** et **E2 (C8)** : exposer et intégrer un service d'IA paramétré, avec une architecture
    découplée et des outils sûrs. MicroForge reprend ce découpage (Streamlit → `api_ia` → passerelle LLM)
    et son copilote RAG (en cours d'ajout) s'appuiera sur pgvector, déjà présent dans l'image PostgreSQL de
    la stack (`pgvector/pgvector:pg17`).
  competences: [C8, C9, C10]
  sources: []
qcm:
  - question: "Pourquoi le LLM ne doit-il jamais générer de SQL brut ?"
    choix: ["C'est trop lent", "Risque d'injection, de requêtes destructrices et de fuite de données", "Le SQL est obsolète", "Les LLM ne connaissent pas SQL"]
    bonne: 1
    explication: "On expose des fonctions à requêtes paramétrées écrites à l'avance."
    difficulte: 1
  - question: "Comment pgvector trouve-t-il les films proches ?"
    choix: ["Par ordre alphabétique", "En triant par distance entre embeddings (opérateur <=> pour le cosinus)", "Avec un LIKE sur le titre", "Avec Selenium"]
    bonne: 1
    explication: "ORDER BY embedding <=> :vecteur LIMIT k."
    difficulte: 2
  - question: "Rôle de l'index FAISS en mémoire dans HorRAGor 2 ?"
    choix: ["Stocker toute la base", "Valider rapidement qu'un film existe et récupérer son identifiant avant les actions lourdes", "Remplacer le LLM", "Gérer les utilisateurs"]
    bonne: 1
    explication: "Un routeur rapide nom → ID."
    difficulte: 2
  - question: "Où doivent se trouver les clés Supabase ?"
    choix: ["Dans le front Streamlit", "Uniquement dans l'API back-end (variables d'environnement)", "Dans le README", "Dans le navigateur"]
    bonne: 1
    explication: "Le front ne parle qu'à l'API."
    difficulte: 1
  - question: "Quand déclencher l'outil de scraping à la demande ?"
    choix: ["À chaque question", "Seulement si l'information demandée manque en base", "Jamais", "Au démarrage"]
    bonne: 1
    explication: "Coût, latence et respect des sites."
    difficulte: 1
  - question: "Que garantit la validation Pydantic de la route /chat ?"
    choix: ["Que la réponse est vraie", "Que les entrées et sorties ont le format attendu (longueurs, champs obligatoires)", "Que le LLM est rapide", "Que la base est à jour"]
    bonne: 1
    explication: "Typage strict des requêtes et des réponses."
    difficulte: 1
  - question: "À quoi sert le paramètre thread_id passé au graphe ?"
    choix: ["À choisir le modèle", "À rattacher les messages à une session (mémoire via checkpointer)", "À limiter les tokens", "À chiffrer"]
    bonne: 1
    explication: "Chaque session a son historique."
    difficulte: 2
  - question: "Quel élément d'interface est demandé pour éviter les doubles soumissions ?"
    choix: ["Un captcha", "Un indicateur d'activité (spinner) pendant la réflexion", "Un rechargement de page", "Un mot de passe"]
    bonne: 1
    explication: "Retour visuel pendant que l'agent travaille."
    difficulte: 1
