exercices:
  - titre: "Table films avec pgvector"
    niveau: 1
    enonce: "Écris le SQL qui active pgvector, crée la table films (id, titre, annee, synopsis, embedding de dimension 768) et l'index HNSW cosinus, puis la requête des 5 films les plus proches du film 42."
    corrige: |
      ```sql
      CREATE EXTENSION IF NOT EXISTS vector;

      CREATE TABLE films (
          id        SERIAL PRIMARY KEY,
          titre     TEXT NOT NULL,
          annee     INT,
          synopsis  TEXT,
          embedding vector(768)
      );

      CREATE INDEX ON films USING hnsw (embedding vector_cosine_ops);

      SELECT titre, 1 - (embedding <=> (SELECT embedding FROM films WHERE id = 42)) AS similarite
      FROM films
      WHERE id <> 42
      ORDER BY embedding <=> (SELECT embedding FROM films WHERE id = 42)
      LIMIT 5;
      ```
  - titre: "Tester un outil sans base"
    niveau: 2
    enonce: "Teste l'outil `calculate_movie_age` et vérifie qu'un appel de l'outil SQL avec un identifiant inconnu renvoie un message d'erreur, en remplaçant le moteur par une base SQLite en mémoire."
    corrige: |
      ```python
      from datetime import date

      from sqlalchemy import create_engine, text

      def test_age():
          assert calculate_movie_age.invoke({"annee": 1980}) == date.today().year - 1980

      def test_film_inconnu(monkeypatch):
          moteur = create_engine("sqlite://")
          with moteur.begin() as c:
              c.execute(text("CREATE TABLE films (id INT, titre TEXT, annee INT, realisateur TEXT, genre TEXT, note REAL)"))
          monkeypatch.setitem(query_movie_metadata.func.__globals__, "engine", moteur)
          assert query_movie_metadata.invoke({"film_id": 999}) == {"erreur": "film inconnu"}
      ```
mindmap: |
  # HorRAGor 2
  ## Architecture
  - Front Streamlit/Gradio
  - API FastAPI POST /chat
  - Graphe LangGraph + juge
  - Supabase (clés côté API)
  ## Mémoire
  - FAISS (routeur nom → ID)
  - pgvector (similarité)
  ## Outils
  - SQL paramétré
  - Films similaires (cosinus)
  - Scraping à la demande
  - Âge du film
  - Simulateur de survie
  ## Option
  - Prefect pour l'ingestion
podcast_titre: "Le cerveau de HorRAGor"
podcast:
  - { voix: A, texte: "Karim, dans HorRAGor 2, le front Streamlit ne fait presque rien. C'est voulu ?" }
  - { voix: B, texte: "Complètement. Il capture la question, l'envoie à l'API et affiche la réponse. Le LLM, le graphe, les clés de la base : tout reste côté API." }
  - { voix: A, texte: "Et l'agent, il peut interroger la base comme il veut ?" }
  - { voix: B, texte: "Surtout pas en écrivant du SQL lui-même. On lui donne des outils : des fonctions Python avec des requêtes paramétrées écrites à l'avance. Il ne choisit que l'outil et les paramètres." }
  - { voix: A, texte: "Comment il recommande des films proches ?" }
  - { voix: B, texte: "Avec pgvector : chaque synopsis a un embedding dans PostgreSQL, et on trie par distance cosinus avec l'opérateur flèche. Une requête SQL, et tu as les cinq films les plus proches." }
  - { voix: A, texte: "Et FAISS, alors ?" }
  - { voix: B, texte: "Un petit index en mémoire, ultra rapide, pour vérifier qu'un film existe et retrouver son identifiant avant d'aller plus loin." }
  - { voix: A, texte: "Et si la base ne sait pas tout ?" }
  - { voix: B, texte: "L'outil de scraping, seulement à la demande. Puis un nœud juge vérifie la réponse avant de la renvoyer. Le même découpage sert pour le copilote de MicroForge." }
