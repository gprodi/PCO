titre: "Pandas & Seaborn"
fiche:
  titre: "Préparer des données pour un modèle : filtrer, nettoyer, visualiser"
  resume: >-
    Avant d'entraîner un modèle, on prépare les données. Pandas charge un fichier (CSV, Excel) dans un
    DataFrame, puis on filtre : suppression des lignes incomplètes (dropna) ou remplacement des manques par
    une valeur par défaut comme la moyenne (fillna), sélection des lignes selon un critère et des seules
    colonnes utiles. Seaborn, construit sur Matplotlib, aide à comprendre ces données : un histogramme avec
    densité (histplot, kde=True) montre la distribution, un boxplot révèle les valeurs aberrantes. On nettoie
    ensuite : doublons supprimés, outliers filtrés par la règle de l'écart interquartile (IQR), variables
    catégorielles converties en nombres (encodage ordinal avec map, ou one-hot). describe() et info() restent
    les premiers réflexes pour vérifier le résultat à chaque étape.
  objectifs:
    - Charger, inspecter et filtrer un DataFrame
    - Traiter les valeurs manquantes en choisissant entre suppression et imputation
    - Détecter et filtrer les valeurs aberrantes avec un boxplot et la règle IQR
    - Encoder les variables catégorielles pour un modèle
  notions:
    - { terme: "Series / DataFrame", definition: "Series : une colonne étiquetée. DataFrame : table de Series partageant le même index." }
    - { terme: "dropna / fillna", definition: "dropna supprime les lignes (ou colonnes) incomplètes ; fillna remplace les manques par une valeur (moyenne, médiane, constante)." }
    - { terme: "Imputation", definition: "Remplacement d'une valeur manquante par une estimation ; la médiane résiste mieux aux valeurs extrêmes que la moyenne." }
    - { terme: "Outlier", definition: "Valeur anormalement éloignée des autres (erreur de saisie ou cas rare) qui peut fausser un modèle." }
    - { terme: "IQR", definition: "Écart interquartile Q3 − Q1 ; on considère aberrant ce qui sort de [Q1 − 1,5·IQR ; Q3 + 1,5·IQR]." }
    - { terme: "Encodage ordinal", definition: "Remplacer des catégories ordonnées par des entiers (aucun=0, bac=1, bac+2=2…) avec map." }
    - { terme: "One-hot encoding", definition: "Une colonne 0/1 par catégorie (pd.get_dummies) pour les catégories sans ordre (ville, couleur)." }
  points_cles:
    - "Inspecter avant et après chaque transformation : shape, info(), describe(), isna().sum()."
    - "Supprimer les lignes incomplètes est simple mais fait perdre des données ; imputer garde les lignes mais invente une valeur."
    - "Une imputation par la moyenne ou un filtrage d'outliers se calcule sur le jeu d'entraînement seulement, puis s'applique au jeu de test."
    - "Encodage ordinal pour les catégories ordonnées ; one-hot pour les catégories sans ordre (sinon le modèle croit à un ordre)."
    - "Le boxplot et l'histogramme guident les décisions de nettoyage ; ils ne remplacent pas la connaissance métier."
  code:
    - titre: "Pipeline de nettoyage"
      lang: python
      code: |
        import pandas as pd

        df = pd.read_csv("data.csv")
        df = df.drop_duplicates()
        df = df[["age", "revenu_estime_mois", "niveau_etude"]]
        df["revenu_estime_mois"] = df["revenu_estime_mois"].fillna(df["revenu_estime_mois"].median())

        q1, q3 = df["revenu_estime_mois"].quantile([0.25, 0.75])
        iqr = q3 - q1
        df = df[df["revenu_estime_mois"].between(q1 - 1.5 * iqr, q3 + 1.5 * iqr)]

        ordre = {"aucun": 0, "bac": 1, "bac+2": 2, "master": 3, "doctorat": 4}
        df["niveau_etude"] = df["niveau_etude"].map(ordre)
        print(df.describe(), df.isna().sum(), sep="\n")
      explication: "On réaffecte la colonne au lieu d'utiliser inplace=True sur une colonne, qui n'a plus d'effet avec pandas 3."
    - titre: "Explorer avant de nettoyer"
      lang: python
      code: |
        import seaborn as sns
        import matplotlib.pyplot as plt

        fig, axes = plt.subplots(1, 2, figsize=(10, 4))
        sns.histplot(df["age"], kde=True, ax=axes[0])
        sns.boxplot(x=df["revenu_estime_mois"], ax=axes[1])
        plt.tight_layout()
        plt.show()

        pd.get_dummies(df, columns=["ville"], drop_first=True)   # one-hot si catégories sans ordre
      explication: "Deux graphiques côte à côte : distribution des âges et repérage des revenus extrêmes."
  pieges:
    - "df['col'].fillna(..., inplace=True) : affectation en chaîne, sans effet avec le copy-on-write de pandas 3 ; écrire df['col'] = df['col'].fillna(...)."
    - "Calculer la moyenne d'imputation sur tout le jeu avant le découpage train/test : fuite de données."
    - "Encoder des villes 0, 1, 2 : le modèle croit que la ville 2 « vaut plus » que la ville 1."
    - "Supprimer tous les outliers à l'aveugle : certains sont des cas réels importants (fraude, panne)."
  aller_plus_loin:
    - titre: "Pipeline scikit-learn reproductible"
      contenu: "`ColumnTransformer` + `SimpleImputer` + `OneHotEncoder` + `StandardScaler` dans un `Pipeline` : les étapes apprises sur le train sont rejouées à l'identique sur le test et en production. C'est la suite naturelle du cours Machine Learning."
      lien: "https://scikit-learn.org/stable/modules/compose.html"
    - titre: "Valider les données avec un schéma"
      contenu: "Pandera (ou Pydantic) décrit les colonnes attendues : type, plage, valeurs autorisées. Défi : écris un schéma qui refuse un âge négatif ou un niveau d'étude inconnu et fais échouer un test pytest."
      lien: "https://pandera.readthedocs.io/"
    - titre: "Polars pour les gros fichiers"
      contenu: "Polars lit et transforme des millions de lignes beaucoup plus vite que pandas, en mode paresseux (`scan_csv`). Il est utilisé dans le pipeline de données de MicroForge (dépendance `data`)."
      lien: "https://docs.pola.rs/"
  jury: >-
    **E1 (C3, C4)** : agréger et nettoyer les données, avec des règles explicites et justifiées (manquants,
    doublons, aberrants, normalisation). Dans le rapport E1 de MicroForge, montre les règles de nettoyage du
    pipeline (normalisation des références et des prix des composants) et un graphique avant/après.
  competences: [C3, C4]
  sources: []
qcm:
  - question: "Que fait df.dropna() par défaut ?"
    choix: ["Remplace les manques par 0", "Supprime les lignes contenant au moins une valeur manquante", "Supprime les colonnes vides", "Compte les manques"]
    bonne: 1
    explication: "Par défaut axis=0 et how='any'."
    difficulte: 1
  - question: "Quelle imputation résiste le mieux aux valeurs extrêmes ?"
    choix: ["La moyenne", "La médiane", "Le maximum", "Zéro"]
    bonne: 1
    explication: "La médiane n'est pas tirée par quelques valeurs énormes."
    difficulte: 2
  - question: "Selon la règle IQR, une valeur est aberrante si elle est :"
    choix: ["Supérieure à la moyenne", "Hors de [Q1 − 1,5·IQR ; Q3 + 1,5·IQR]", "Négative", "Différente de la médiane"]
    bonne: 1
    explication: "IQR = Q3 − Q1 ; c'est aussi la règle des moustaches du boxplot."
    difficulte: 2
  - question: "Quel graphique sert à repérer des outliers ?"
    choix: ["Camembert", "Boxplot", "Courbe temporelle", "Carte"]
    bonne: 1
    explication: "Les points au-delà des moustaches sont les valeurs atypiques."
    difficulte: 1
  - question: "Comment encoder une colonne « ville » (Paris, Lyon, Lille) pour un modèle linéaire ?"
    choix: ["map vers 0, 1, 2", "One-hot (pd.get_dummies)", "La supprimer toujours", "La laisser en texte"]
    bonne: 1
    explication: "Sans ordre naturel, l'encodage ordinal introduirait un ordre fictif."
    difficulte: 2
  - question: "Pourquoi éviter df['col'].fillna(v, inplace=True) en pandas récent ?"
    choix: ["C'est plus lent", "L'affectation en chaîne n'a plus d'effet avec le copy-on-write", "Ça supprime la colonne", "Ce n'est pas du Python valide"]
    bonne: 1
    explication: "On écrit df['col'] = df['col'].fillna(v)."
    difficulte: 3
  - question: "Pourquoi calculer la valeur d'imputation sur le jeu d'entraînement seulement ?"
    choix: ["Pour aller plus vite", "Pour éviter une fuite d'information du test vers l'entraînement", "Parce que le test n'a pas de manques", "Ce n'est pas nécessaire"]
    bonne: 1
    explication: "Sinon l'évaluation est trop optimiste : le modèle a « vu » une statistique du test."
    difficulte: 3
  - question: "Quelle fonction donne d'un coup moyenne, écart type, min, quartiles et max des colonnes numériques ?"
    choix: ["df.info()", "df.describe()", "df.head()", "df.shape"]
    bonne: 1
    explication: "info() montre plutôt les types et le nombre de valeurs non nulles."
    difficulte: 1
