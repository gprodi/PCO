  - Statistiques sur le train
  - Vérifier à chaque étape
podcast_titre: "Des données propres avant tout modèle"
podcast:
  - { voix: A, texte: "Karim, on dit que la préparation des données prend 80 % du temps d'un projet d'IA. Vrai ?" }
  - { voix: B, texte: "Souvent, oui. Et c'est là que se gagnent les points : un modèle moyen sur des données propres bat un super modèle sur des données sales." }
  - { voix: A, texte: "Première étape ?" }
  - { voix: B, texte: "Regarder : info pour les types et les manques, describe pour les statistiques. Puis un histogramme et un boxplot avec Seaborn." }
  - { voix: A, texte: "Pour les valeurs manquantes, je supprime ou je remplace ?" }
  - { voix: B, texte: "Ça dépend combien il en manque. Supprimer est simple mais perd des lignes. Remplacer par la médiane garde les lignes ; la médiane est moins sensible aux valeurs extrêmes que la moyenne." }
  - { voix: A, texte: "Et les valeurs extrêmes justement ?" }
  - { voix: B, texte: "La règle de l'écart interquartile les repère. Mais attention : un billet de première classe très cher n'est pas une erreur. On décide avec la connaissance du métier." }
  - { voix: A, texte: "Dernier point : les colonnes texte comme le niveau d'études." }
  - { voix: B, texte: "Si les catégories ont un ordre, on les remplace par des entiers avec map. Si elles n'en ont pas, comme des villes, on fait du one-hot. Et toutes ces statistiques se calculent sur l'entraînement seulement, pour éviter les fuites." }
