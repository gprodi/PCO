  - { recto: "Lire un fichier Excel", verso: "pd.read_excel(\"fichier.xlsx\") (dépend d'openpyxl)." }
  - { recto: "Garder des colonnes", verso: "df[[\"age\", \"revenu\"]] (double crochet = DataFrame)." }
  - { recto: "Filtrer les lignes", verso: "df[df[\"age\"] > 30]" }
  - { recto: "Imputer par la médiane", verso: "df[\"c\"] = df[\"c\"].fillna(df[\"c\"].median())" }
  - { recto: "Quartiles", verso: "q1, q3 = df[\"c\"].quantile([0.25, 0.75])" }
  - { recto: "Filtre IQR en une ligne", verso: "df[df[\"c\"].between(q1 - 1.5*iqr, q3 + 1.5*iqr)]" }
  - { recto: "Encodage ordinal", verso: "df[\"niveau\"] = df[\"niveau\"].map({\"aucun\": 0, \"bac\": 1, ...})" }
  - { recto: "One-hot", verso: "pd.get_dummies(df, columns=[\"ville\"], drop_first=True)" }
  - { recto: "Distribution + densité", verso: "sns.histplot(df[\"age\"], kde=True)" }
  - { recto: "Boxplot d'une colonne", verso: "sns.boxplot(x=df[\"revenu\"])" }
  - { recto: "Supprimer les doublons", verso: "df = df.drop_duplicates()" }
  - { recto: "Types et valeurs non nulles", verso: "df.info()" }
exercices:
  - titre: "Nettoyage guidé"
    niveau: 1
    enonce: "Sur le Titanic, garde les colonnes Survived, Pclass, Sex, Age, Fare ; impute l'âge par la médiane ; encode Sex en 0/1 ; vérifie qu'il ne reste aucune valeur manquante."
    indices: ["df[[...]]", "map({'male': 0, 'female': 1})", "isna().sum()"]
    corrige: |
      ```python
      df = df[["Survived", "Pclass", "Sex", "Age", "Fare"]].copy()
      df["Age"] = df["Age"].fillna(df["Age"].median())
      df["Sex"] = df["Sex"].map({"male": 0, "female": 1})
      assert df.isna().sum().sum() == 0
      ```
  - titre: "Outliers : décider avec les graphiques"
    niveau: 2
    enonce: "Trace le boxplot de Fare, compte les valeurs au-delà de Q3 + 1,5·IQR, puis compare la moyenne de Fare avant et après filtrage. Ces valeurs sont-elles des erreurs ?"
    indices: ["quantile([0.25, 0.75])", "len(df) avant/après"]
    corrige: |
      ```python
      q1, q3 = df["Fare"].quantile([0.25, 0.75])
      haut = q3 + 1.5 * (q3 - q1)
      print((df["Fare"] > haut).sum(), "valeurs hautes")
      print(df["Fare"].mean(), df.loc[df["Fare"] <= haut, "Fare"].mean())
      ```
      Ce ne sont pas des erreurs : ce sont des billets de première classe très chers. Les supprimer biaiserait l'étude de la survie selon la classe ; on préfère garder ces lignes, ou transformer la variable (log).
  - titre: "Préparation sans fuite"
    niveau: 3
    enonce: "Découpe le jeu en train/test, calcule la médiane d'imputation et les bornes IQR sur le train uniquement, puis applique-les aux deux jeux. Explique pourquoi."
    indices: ["train_test_split", "Calculer les statistiques sur X_train seulement"]
    corrige: |
      ```python
      from sklearn.model_selection import train_test_split

      train, test = train_test_split(df, test_size=0.2, random_state=42)
      med = train["Age"].median()
      q1, q3 = train["Fare"].quantile([0.25, 0.75])
      borne = q3 + 1.5 * (q3 - q1)
      for part in (train, test):
          part["Age"] = part["Age"].fillna(med)
          part["Fare"] = part["Fare"].clip(upper=borne)
      ```
      Le test simule des données jamais vues : utiliser ses statistiques pendant la préparation surestimerait la performance réelle du modèle.
