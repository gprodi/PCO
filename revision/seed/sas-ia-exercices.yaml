exercices:
  - titre: "Statistiques NumPy"
    niveau: 1
    enonce: "Écris `stats(t)` qui renvoie un dictionnaire {moyenne, mediane, ecart_type} d'un tableau NumPy, et `binariser(t, seuil=5)` qui remplace les valeurs < seuil par 0 et les autres par 1. Ajoute un test pytest pour chacune."
    indices: ["np.median", "np.where", "assert ... == ..."]
    corrige: |
      ```python
      import numpy as np

      def stats(t: np.ndarray) -> dict:
          return {"moyenne": t.mean(), "mediane": float(np.median(t)), "ecart_type": t.std()}

      def binariser(t: np.ndarray, seuil: float = 5) -> np.ndarray:
          return np.where(t < seuil, 0, 1)

      # tests/test_stats.py
      def test_stats():
          assert stats(np.array([1, 2, 3]))["mediane"] == 2

      def test_binariser():
          assert binariser(np.array([1, 5, 9])).tolist() == [0, 1, 1]
      ```
  - titre: "Code César testé"
    niveau: 2
    enonce: "Écris `cesar(texte, decalage)` qui décale chaque lettre (majuscules et minuscules) en conservant espaces et ponctuation, puis `decoder(texte, decalage)`. Vérifie par un test que decoder(cesar(t, k), k) == t pour plusieurs k."
    indices: ["ord / chr et le modulo 26", "pytest.mark.parametrize pour plusieurs décalages"]
    corrige: |
      ```python
      import pytest

      def cesar(texte: str, decalage: int) -> str:
          res = []
          for c in texte:
              if c.isalpha():
                  base = ord("A") if c.isupper() else ord("a")
                  res.append(chr((ord(c) - base + decalage) % 26 + base))
              else:
                  res.append(c)
          return "".join(res)

      def decoder(texte: str, decalage: int) -> str:
          return cesar(texte, -decalage)

      @pytest.mark.parametrize("k", [1, 3, 13, 25])
      def test_aller_retour(k):
          t = "Bonjour, le Monde !"
          assert decoder(cesar(t, k), k) == t
      ```
  - titre: "Analyse des notes d'étudiants"
    niveau: 3
    enonce: "Avec un DataFrame `grades` (colonnes ID, salle, note sur 17), convertis les notes sur 20, ajoute une colonne `result` (« Réussite » si >= 10, sinon « Échec »), affiche la moyenne par salle et trace avec seaborn le nombre de réussites et d'échecs."
    indices: ["df['note'] * 20 / 17", "np.where pour result", "groupby('salle')['note20'].mean()", "sns.countplot"]
    corrige: |
      ```python
      import numpy as np
      import seaborn as sns
      import matplotlib.pyplot as plt

      grades["note20"] = grades["note"] * 20 / 17
      grades["result"] = np.where(grades["note20"] >= 10, "Réussite", "Échec")
      print(grades.groupby("salle")["note20"].mean().round(2))
      sns.countplot(data=grades, x="result")
      plt.show()
      ```
