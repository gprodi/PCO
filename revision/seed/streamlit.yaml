podcast_titre: "Streamlit sans se faire piéger par la réexécution"
podcast:
  - { voix: A, texte: "Karim, Streamlit, c'est vraiment une appli web sans HTML ?" }
  - { voix: B, texte: "Oui : un script Python, streamlit run, et tu as une page web. Un slider s'écrit en une ligne et renvoie directement sa valeur." }
  - { voix: A, texte: "Mon application est lente : chaque clic prend plusieurs secondes." }
  - { voix: B, texte: "Normal si tu recharges ton modèle à chaque fois. À chaque interaction, Streamlit réexécute tout le script. Mets st cache resource sur le chargement du modèle et st cache data sur la lecture du CSV." }
  - { voix: A, texte: "Et mon compteur qui revient à zéro ?" }
  - { voix: B, texte: "Même cause. Une variable normale est recréée à chaque réexécution. Ce qui doit persister va dans st session state." }
  - { voix: A, texte: "Pour un vrai projet, Streamlit peut parler directement à la base ?" }
  - { voix: B, texte: "Techniquement oui, mais c'est une mauvaise idée. Streamlit est un client : il appelle ton API, qui contrôle et valide. C'est ce que fait MicroForge." }
  - { voix: A, texte: "Et on peut tester une page Streamlit ?" }
  - { voix: B, texte: "Oui, avec AppTest : tu lances la page, tu bouges un widget en code et tu vérifies qu'il n'y a pas d'exception. Parfait pour la CI." }
