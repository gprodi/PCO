exercices:
  - titre: "Compteur et historique"
    niveau: 1
    enonce: "Crée une page avec un bouton « + 1 » qui incrémente un compteur conservé entre les clics, et un champ texte dont chaque saisie validée s'ajoute à un historique affiché en liste."
    indices: ["if \"compteur\" not in st.session_state:", "st.text_input + st.button"]
    corrige: |
      ```python
      import streamlit as st

      if "compteur" not in st.session_state:
          st.session_state.compteur = 0
          st.session_state.historique = []

      if st.button("+ 1"):
          st.session_state.compteur += 1
      st.metric("Compteur", st.session_state.compteur)

      texte = st.text_input("Note")
      if st.button("Ajouter") and texte:
          st.session_state.historique.append(texte)
      for ligne in st.session_state.historique:
          st.write("•", ligne)
      ```
  - titre: "Analyseur de ventes de jeux vidéo"
    niveau: 2
    enonce: "Page `pages/1_data_analyst.py` : dépôt d'un CSV, aperçu, statistiques, choix de deux colonnes numériques pour un nuage de points Seaborn, histogramme avec nombre de classes réglable, filtre par valeur d'une colonne, et résumé `info()` correctement affiché."
    indices: ["st.cache_data pour la lecture", "io.StringIO pour info()", "sns.scatterplot(data=df, x=..., y=..., ax=ax)"]
    corrige: |
      ```python
      import io

      import matplotlib.pyplot as plt
      import pandas as pd
      import seaborn as sns
      import streamlit as st

      @st.cache_data
      def charger(f):
          return pd.read_csv(f)

      f = st.file_uploader("Ventes de jeux vidéo (CSV)", type="csv")
      if f:
          df = charger(f)
          st.dataframe(df.head())
          st.write(df.describe())
          num = df.select_dtypes("number").columns.tolist()
          x, y = st.selectbox("X", num), st.selectbox("Y", num, index=min(1, len(num) - 1))
          fig, ax = plt.subplots()
          sns.scatterplot(data=df, x=x, y=y, ax=ax)
          st.pyplot(fig)
          col = st.selectbox("Histogramme de", num)
          fig2, ax2 = plt.subplots()
          ax2.hist(df[col].dropna(), bins=st.slider("Classes", 5, 100, 20))
          st.pyplot(fig2)
          filtre = st.selectbox("Filtrer sur", df.columns)
          valeur = st.selectbox("Valeur", df[filtre].dropna().unique())
          st.dataframe(df[df[filtre] == valeur])
          buf = io.StringIO()
          df.info(buf=buf)
          st.text(buf.getvalue())
      ```
