podcast_titre: "Industrialiser son projet avant son modèle"
podcast:
  - { voix: A, texte: "Karim, MLOps, je pensais que c'était déployer des modèles. Pourquoi on commence par uv et ruff ?" }
  - { voix: B, texte: "Parce qu'on ne déploie bien que ce qu'on sait reconstruire. uv te donne un environnement reproductible, avec uv lock qui fige toutes les versions." }
  - { voix: A, texte: "Et ruff ?" }
  - { voix: B, texte: "Il vérifie et formate ton code en une fraction de seconde. Tout le monde écrit dans le même style, et les erreurs bêtes sont attrapées avant l'exécution." }
  - { voix: A, texte: "Ensuite la CI ?" }
  - { voix: B, texte: "Un fichier YAML dans point github slash workflows : à chaque push, GitHub installe le projet, lance ruff et pytest. Si c'est rouge, on ne fusionne pas." }
  - { voix: A, texte: "Et Docker, ça sert à quoi de plus ?" }
  - { voix: B, texte: "À livrer l'environnement complet : Python, dépendances, code. Ce qui tourne sur ta machine tourne pareil sur le serveur. Copie d'abord le pyproject et le lock, installe, puis copie le code : la construction reste rapide." }
  - { voix: A, texte: "Et les mots de passe dans tout ça ?" }
  - { voix: B, texte: "Jamais dans le Dockerfile ni dans le workflow. Dans les secrets GitHub, injectés au moment voulu. Et épingle tes versions d'image : latest, c'est une surprise qui t'attend." }
