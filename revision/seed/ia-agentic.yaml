  - { recto: "Sortie structurée", verso: "llm.with_structured_output(ModelePydantic).invoke(question)" }
  - { recto: "Déclarer un outil", verso: "@tool sur une fonction typée avec une docstring explicite." }
  - { recto: "Donner les outils au LLM", verso: "llm.bind_tools(outils)" }
  - { recto: "Graphe ReAct minimal", verso: "StateGraph(MessagesState) ; nœuds agent + ToolNode ; START→agent ; conditional_edges(agent, tools_condition) ; tools→agent" }
  - { recto: "Bases vectorielles du cours", verso: "Chroma (local), FAISS (LlamaIndex), pgvector (PostgreSQL)." }
  - { recto: "Streaming", verso: "for morceau in llm.stream(...) ; StreamingResponse côté FastAPI." }
