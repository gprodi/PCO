exercices:
  - titre: "Extraire un inventaire structuré"
    niveau: 1
    enonce: "Définis un modèle Pydantic `Inventaire` (liste de `Composant` avec référence et quantité ≥ 0) et explique comment l'obtenir d'un LLM à partir de « 3 DHT22, deux servos SG90 et une LED rouge »."
    corrige: |
      ```python
      from pydantic import BaseModel, Field

      class Composant(BaseModel):
          reference: str = Field(description="Référence ou nom normalisé du composant")
          quantite: int = Field(ge=0)

      class Inventaire(BaseModel):
          composants: list[Composant]

      # inventaire = llm.with_structured_output(Inventaire).invoke(
      #     "Extrais les composants et quantités : 3 DHT22, deux servos SG90 et une LED rouge")
      # -> composants=[Composant('DHT22', 3), Composant('SG90', 2), Composant('LED rouge', 1)]
      ```
      La validation Pydantic refuse une quantité négative ; le code reçoit un objet exploitable directement (insertion en base, calcul de projets réalisables).
  - titre: "Tester un graphe d'agent sans LLM"
    niveau: 3
    enonce: "Écris un test du graphe ReAct du cours qui remplace le LLM par un faux modèle : au premier appel il demande l'outil prix_ttc(3.5), au second il répond « 4,20 € ». Vérifie que l'outil a bien été exécuté."
    indices: ["AIMessage(content='', tool_calls=[{'name': ..., 'args': ..., 'id': ...}])", "Remplacer la fonction agent par une version qui lit une liste de réponses"]
    corrige: |
      ```python
      from langchain_core.messages import AIMessage, HumanMessage, ToolMessage
      from langchain_core.tools import tool
      from langgraph.graph import START, MessagesState, StateGraph
      from langgraph.prebuilt import ToolNode, tools_condition

      @tool
      def prix_ttc(prix_ht: float) -> float:
          """Calcule le prix TTC (TVA 20 %)."""
          return round(prix_ht * 1.20, 2)

      def test_boucle_react():
          reponses = iter([
              AIMessage(content="", tool_calls=[{"name": "prix_ttc", "args": {"prix_ht": 3.5}, "id": "1"}]),
              AIMessage(content="Le prix TTC est de 4,20 €."),
          ])

          def agent(state: MessagesState):
              return {"messages": [next(reponses)]}

          g = StateGraph(MessagesState)
          g.add_node("agent", agent)
          g.add_node("tools", ToolNode([prix_ttc]))
          g.add_edge(START, "agent")
          g.add_conditional_edges("agent", tools_condition)
          g.add_edge("tools", "agent")
          sortie = g.compile().invoke({"messages": [HumanMessage("Prix TTC de 3,50 € HT ?")]})

          outils = [m for m in sortie["messages"] if isinstance(m, ToolMessage)]
          assert outils and outils[0].content == "4.2"
          assert sortie["messages"][-1].content == "Le prix TTC est de 4,20 €."
      ```
      Le câblage du graphe et l'outil sont testés de façon déterministe, sans GPU ni réseau.
mindmap: |
  # IA agentique — pratique
  ## Bases
  - Stateless / stateful
  - LCEL (prompt | llm | parser)
  - Sortie structurée (Pydantic)
  - Streaming
  ## Savoir (RAG)
  - Chunking, embeddings
  - Chroma, FAISS, pgvector
  - Citations
  ## Action
  - @tool, bind_tools
  - StateGraph, ToolNode
  - Boucle ReAct
  ## Contrôle
  - Nœud juge
  - Garde-fous, injection de prompt
  - Validation humaine (checkpoint)
  - Time travel
  ## Échelle
  - Multi-agents (pair à pair, superviseur)
  - Langfuse
  - MCP (FastMCP)
podcast_titre: "Donner des bras à un LLM sans perdre le contrôle"
podcast:
  - { voix: A, texte: "Karim, mon LLM me répond en phrases. Comment j'en fais quelque chose d'exploitable par mon code ?" }
  - { voix: B, texte: "Sortie structurée : tu définis un modèle Pydantic et tu appelles with structured output. Tu récupères un objet validé, pas du texte à découper." }
  - { voix: A, texte: "Et pour qu'il connaisse mes documents ?" }
  - { voix: B, texte: "Un RAG : tu découpes tes documents, tu les vectorises dans Chroma ou pgvector, et à chaque question tu récupères les passages proches pour les donner au modèle." }
  - { voix: A, texte: "Et pour qu'il agisse ?" }
  - { voix: B, texte: "Tu lui donnes des outils avec arobase tool. La docstring est essentielle : c'est elle qui dit au modèle quand s'en servir. Avec LangGraph, un nœud agent, un nœud outils, et une arête conditionnelle : c'est la boucle ReAct." }
  - { voix: A, texte: "Ça ne devient pas dangereux ?" }
  - { voix: B, texte: "Si. L'injection de prompt peut venir de l'utilisateur ou d'un document lu par l'agent. On empile les défenses, et toute action irréversible passe par une validation humaine grâce au checkpointer." }
  - { voix: A, texte: "Et MCP, j'en entends parler partout." }
  - { voix: B, texte: "C'est l'USB-C des outils : tu exposes tes outils une fois avec FastMCP, et n'importe quel client compatible peut les utiliser. Si tu sais faire une API FastAPI, tu sais faire un serveur MCP." }
