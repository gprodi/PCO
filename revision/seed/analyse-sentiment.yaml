exercices:
  - titre: "Interpréter des scores"
    niveau: 1
    enonce: "Classe ces résultats : (a) compound = 0,636 ; (b) compound = −0,03 ; (c) compound = −0,52 ; (d) neg = 0, neu = 1, pos = 0 pour « Ce capteur est génial ». Que conclure de (d) ?"
    indices: ["Seuils ±0,05", "Quelle langue comprend VADER ?"]
    corrige: |
      (a) positif ; (b) neutre ; (c) négatif ; (d) neutre — mais c'est un faux neutre : « génial » est un mot français absent du lexique anglais de VADER. Il faut un modèle français pour ce cas.
  - titre: "Tester l'API d'IA"
    niveau: 2
    enonce: "Écris trois tests TestClient pour l'API du cours : un texte anglais positif (compound > 0,05), un texte vide (422), et la présence exacte des quatre clés dans la réponse."
    indices: ["from fastapi.testclient import TestClient", "set(r.json()) == {...}"]
    corrige: |
      ```python
      from fastapi.testclient import TestClient
      from sentiment_api import app

      client = TestClient(app)

      def test_positif():
          r = client.post("/analyse_sentiment/", json={"texte": "I love this, it is great!"})
          assert r.status_code == 200 and r.json()["compound"] > 0.05

      def test_texte_vide_refuse():
          assert client.post("/analyse_sentiment/", json={"texte": ""}).status_code == 422

      def test_contrat():
          r = client.post("/analyse_sentiment/", json={"texte": "ok"})
          assert set(r.json()) == {"neg", "neu", "pos", "compound"}
      ```
mindmap: |
  # Brief analyse de sentiment
  ## API IA (FastAPI)
  - POST /analyse_sentiment/
  - Pydantic Texte
  - VADER (NLTK)
  - HTTPException 500
  ## API données
  - Citations (CRUD)
  ## Front (Streamlit)
  - Recherche par ID
  - Bouton Analyser
  - requests + timeout
  - Seuils du compound
  ## Transverse
  - Loguru (client + serveur)
  - .env (hôte, port, URL)
  - .venv, requirements, README, .gitignore
  ## Limites
  - VADER anglais
  - Données personnelles dans les logs
podcast_titre: "Brief sentiment : trois briques qui se parlent"
podcast:
  - { voix: A, texte: "Karim, le brief demande deux API et un Streamlit pour analyser un sentiment. Ce n'est pas trop pour un simple score ?" }
  - { voix: B, texte: "C'est volontaire : on apprend à séparer le modèle, les données et l'interface. Chaque brique se teste et se remplace seule." }
  - { voix: A, texte: "L'API d'IA fait quoi exactement ?" }
  - { voix: B, texte: "Elle reçoit du JSON, Pydantic vérifie qu'il y a bien un champ texte, puis VADER renvoie quatre scores : négatif, neutre, positif, et le compound entre moins un et plus un." }
  - { voix: A, texte: "J'ai testé avec « bonjour » et c'est neutre. Et même « génial » est neutre…" }
  - { voix: B, texte: "Parce que VADER a un lexique anglais. C'est une vraie limite à écrire dans ton rapport, et une bonne raison de comparer avec un modèle français de Hugging Face." }
  - { voix: A, texte: "Et côté Streamlit ?" }
  - { voix: B, texte: "requests post avec un timeout, raise for status, et un except sur les erreurs réseau. L'utilisateur voit un message clair, le détail part dans les logs." }
  - { voix: A, texte: "Les logs, je mets tout le texte dedans ?" }
  - { voix: B, texte: "Attention : ce sont des saisies d'utilisateurs, donc potentiellement des données personnelles. Journalise la longueur, le résultat, et garde une rétention courte. Le jury appréciera." }
