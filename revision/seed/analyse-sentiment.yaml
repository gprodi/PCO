  - { recto: "Contraindre la longueur d'un champ", verso: "texte: str = Field(min_length=1, max_length=5000)" }
  - { recto: "Appel robuste depuis Streamlit", verso: "requests.post(url, json=..., timeout=10) puis r.raise_for_status()" }
